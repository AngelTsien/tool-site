<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调音器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>调音器</h1></header><main><div class=panel style="text-align:center"><p style="color:#7a706a">点击开始并允许使用麦克风，对着麦克风弹一根弦</p><button id=go>🎤 开始调音</button><div id=nt style="font-size:96px;font-weight:700;color:#b98a62;margin-top:10px">–</div><div id=hz style="color:#a99">– Hz</div>
<div style="position:relative;height:40px;margin:20px auto;max-width:420px;background:linear-gradient(90deg,#e08a7a,#e8c26a 40%,#8fc79a 47% 53%,#e8c26a 60%,#e08a7a);border-radius:20px"><div id=nd style="position:absolute;left:50%;top:-6px;width:4px;height:52px;background:#3a3330;transition:left .15s"></div></div><div id=ce style="font-size:20px"></div>
<p style="font-size:13px;color:#a99">吉他标准音：E2 A2 D3 G3 B3 E4</p><div class=row style="justify-content:center" id=rf></div><p id=msg style="color:#c05a4a"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="tuner");r.unshift("tuner");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const NN="C C# D D# E F F# G G# A A# B".split(" ");let A;
function ac(buf,sr){let n=buf.length,rms=0;for(const v of buf)rms+=v*v;if(Math.sqrt(rms/n)<.01)return-1;const c=new Float32Array(n);for(let l=0;l<n;l++){let s=0;for(let i=0;i<n-l;i++)s+=buf[i]*buf[i+l];c[l]=s}let d=0;while(d<n-1&&c[d]>c[d+1])d++;let mx=-1,p=-1;for(let i=d;i<n;i++)if(c[i]>mx){mx=c[i];p=i}return p>0?sr/p:-1}
const show=f=>{if(f<0)return;const m=12*Math.log2(f/440)+69,r=Math.round(m),cent=Math.round((m-r)*100);nt.textContent=NN[r%12]+(Math.floor(r/12)-1);hz.textContent=f.toFixed(1)+" Hz";nd.style.left=50+cent+"%";ce.textContent=Math.abs(cent)<5?"✅ 准了":cent>0?`偏高 ${cent} 音分 ↓`:`偏低 ${-cent} 音分 ↑`;ce.style.color=Math.abs(cent)<5?"#4a9a5a":"#c09a2a"};
go.onclick=async()=>{try{A=new AudioContext();const s=await navigator.mediaDevices.getUserMedia({audio:true}),an=A.createAnalyser();an.fftSize=2048;A.createMediaStreamSource(s).connect(an);const b=new Float32Array(2048);go.textContent="🎶 正在聆听…";
const lp=()=>{an.getFloatTimeDomainData(b);show(ac(b,A.sampleRate));requestAnimationFrame(lp)};lp()}catch(e){msg.textContent="无法使用麦克风："+e.message}};
[["E2",82.41],["A2",110],["D3",146.83],["G3",196],["B3",246.94],["E4",329.63]].forEach(([n,f])=>{const b=document.createElement("button");b.className="alt";b.textContent="🔈"+n;b.onclick=()=>{const a=A||(A=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+2);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+2)};rf.appendChild(b)});window.__show=show</script></html>
