<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字数统计 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>字数统计</h1></header><main><div class=panel><textarea id=t style="min-height:200px" placeholder="粘贴讲稿或文章…">起初，神创造天地。地是空虚混沌，渊面黑暗；神的灵运行在水面上。God said, Let there be light.</textarea></div><div class="panel stat" id=s></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="count");r.unshift("count");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const f=()=>{const v=t.value,h=(v.match(/[\u4e00-\u9fff]/g)||[]).length,w=(v.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).length,p=(v.match(/[\p{P}]/gu)||[]).length,n=(v.match(/\d+/g)||[]).length,min=(h/220+w/150);
s.innerHTML=[["总字符",v.length],["不含空格",v.replace(/\s/g,"").length],["汉字",h],["英文单词",w],["标点",p],["数字",n],["段落",v.split(/\n+/).filter(x=>x.trim()).length],["朗读约",min<1?Math.round(min*60)+" 秒":min.toFixed(1)+" 分钟"]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join("")};t.oninput=f;f()</script></html>
