<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生肖星座/年龄 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>生肖星座/年龄</h1></header><main><div class=panel><label>出生日期</label><input type=date id=bd value="1990-06-15"></div><div class="stat panel" id=r></div><div class=panel><div id=dt style="line-height:1.9"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/lunar.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="zodiac");r.unshift("zodiac");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const SX="鼠牛虎兔龙蛇马羊猴鸡狗猪",SE=[..."🐭🐮🐯🐰🐲🐍🐴🐑🐵🐔🐶🐷"],XZ=[["摩羯座","♑",1,19],["水瓶座","♒",2,18],["双鱼座","♓",3,20],["白羊座","♈",4,19],["金牛座","♉",5,20],["双子座","♊",6,21],["巨蟹座","♋",7,22],["狮子座","♌",8,22],["处女座","♍",9,22],["天秤座","♎",10,23],["天蝎座","♏",11,22],["射手座","♐",12,21],["摩羯座","♑",12,31]];
const TG="甲乙丙丁戊己庚辛壬癸",DZ="子丑寅卯辰巳午未申酉戌亥",W="日一二三四五六";
const f=()=>{const[y,m,d]=bd.value.split("-").map(Number);if(!y)return;const T=new Date(),B=new Date(y,m-1,d);let age=T.getFullYear()-y-((T.getMonth()+1<m||(T.getMonth()+1==m&&T.getDate()<d))?1:0);
let ly=y;try{ly=Solar.fromYmd(y,m,d).getLunar().getYear()}catch(e){}const sx=((ly-4)%12+12)%12,xz=XZ.find(z=>m<z[2]||(m==z[2]&&d<=z[3])),days=Math.floor((T-B)/864e5),nb=new Date(T.getFullYear(),m-1,d);if(nb<T)nb.setFullYear(T.getFullYear()+1);
r.innerHTML=`<div><b style="font-size:40px">${SE[sx]}</b>属${SX[sx]}</div><div><b style="font-size:32px">${xz[1]}</b>${xz[0]}</div><div><b>${age}</b>周岁</div><div><b>${T.getFullYear()-ly+1}</b>虚岁</div><div><b>${days.toLocaleString()}</b>已活天数</div><div><b>${Math.ceil((nb-T)/864e5)}</b>天后生日</div>`;
let lun="";try{const L=Solar.fromYmd(y,m,d).getLunar();lun=`农历 ${L.getYearInGanZhi()}年 ${L.getMonthInChinese()}月${L.getDayInChinese()}`}catch(e){}
dt.innerHTML=`📅 出生那天是 <b>星期${W[B.getDay()]}</b><br>🌙 ${lun||"干支年："+TG[((ly-4)%10+10)%10]+DZ[sx]+"年"}<br>⏳ 约 ${(days/7|0).toLocaleString()} 周、${(days*24).toLocaleString()} 小时<br>🎂 第 10000 天：${new Date(B.getTime()+1e4*864e5).toLocaleDateString("zh-CN")}<br>💡 生肖按农历新年划分（春节前出生属上一年生肖）`};bd.oninput=f;f()</script></html>
