<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>敬拜歌单 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>敬拜歌单</h1></header><main><div class=panel><div class=row><input id=dt type=date><input id=ti placeholder="聚会名称（主日崇拜）" style="flex:1"></div><div class=row style="margin-top:8px"><input id=sn placeholder="诗歌名" style="flex:1" list=lib><datalist id=lib></datalist><select id=ky></select><input id=bp type=number placeholder="BPM" style="width:80px"><input id=mi type=number placeholder="分钟" value=4 style="width:70px"><button id=ad>➕</button></div>
<input id=no placeholder="备注（如：副歌重复两次、间奏转调）" style="width:100%;margin-top:8px"></div>
<div class=panel><div id=ls></div><p id=sum style="color:#7a706a"></p><div class=row><button onclick="print()">🖨 打印</button><button class=alt id=cp>📋 复制发群</button><button class=alt id=cl>清空本场</button></div></div>
<style>@media print{header,footer,.panel:first-of-type,.np{display:none!important}}.sg{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;margin:6px 0;background:#faf6f1}.k{font-size:20px;font-weight:700;width:52px;text-align:center;color:#8a5a3a}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="setlist");r.unshift("setlist");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const K=["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];ky.innerHTML=K.map(k=>`<option>${k}</option>`).join("");ky.value="G";
let S=JSON.parse(localStorage.setlist||'{"l":[],"lib":{}}');dt.value=S.dt||new Date().toISOString().slice(0,10);ti.value=S.ti||"";
const sv=()=>{S.dt=dt.value;S.ti=ti.value;localStorage.setlist=JSON.stringify(S)};dt.oninput=ti.oninput=()=>{sv()};
const rd=()=>{sv();lib.innerHTML=Object.keys(S.lib).map(x=>`<option value="${x}">`).join("");let t=0;ls.innerHTML=S.l.map((x,i)=>{t+=+x.m||0;let w="";if(i){const a=K.indexOf(S.l[i-1].k),b=K.indexOf(x.k),d=((b-a)%12+12)%12,j=Math.min(d,12-d);w=j==0?"🔗 同调衔接":[5,7].includes(d)?"🎵 四/五度，衔接自然":j<=2?`↗ ${d<=6?"升":"降"} ${j} 个半音，可直接转调`:`⚠️ 相差 ${j} 个半音，建议加过门/祷告衔接`}
return(i?`<div class=np style="font-size:12px;color:#998;padding-left:60px">${w}</div>`:"")+`<div class=sg><div class=k><select onchange="S.l[${i}].k=this.value;S.lib[S.l[${i}].n].k=this.value;rd()" style="font-weight:700;padding:4px">${K.map(k=>`<option ${k==x.k?"selected":""}>${k}</option>`).join("")}</select></div><div style="flex:1"><b>${i+1}. ${x.n}</b><div style="font-size:13px;color:#888">${x.b?x.b+" BPM · ":""}${x.m} 分钟${x.no?" · "+x.no:""}</div></div>
<span class=np><button class=alt onclick="mv(${i},-1)">↑</button><button class=alt onclick="mv(${i},1)">↓</button><button class=alt onclick="S.l.splice(${i},1);rd()">✕</button></span></div>`}).join("")||"<p style='color:#a99'>还没有诗歌。添加过的诗歌会记住调性，下次直接选。</p>";
const ks=S.l.map(x=>x.k);sum.textContent=S.l.length?`共 ${S.l.length} 首 · 约 ${t} 分钟 · 调性：${ks.join(" → ")}`:""};
const mv=(i,d)=>{const j=i+d;if(j<0||j>=S.l.length)return;[S.l[i],S.l[j]]=[S.l[j],S.l[i]];rd()};
sn.oninput=()=>{const x=S.lib[sn.value];if(x){ky.value=x.k;bp.value=x.b||"";mi.value=x.m||4}};
ad.onclick=()=>{const n=sn.value.trim();if(!n)return;const x={n,k:ky.value,b:bp.value,m:+mi.value||4,no:no.value};S.lib[n]={k:x.k,b:x.b,m:x.m};S.l.push(x);sn.value=no.value=bp.value="";rd()};sn.onkeydown=e=>{if(e.key=="Enter")ad.onclick()};
cl.onclick=()=>{S.l=[];rd()};cp.onclick=()=>{const t=`🎶 ${dt.value} ${ti.value}\n`+S.l.map((x,i)=>`${i+1}. ${x.n}（${x.k}${x.b?" · "+x.b+"BPM":""}）${x.no?" "+x.no:""}`).join("\n");navigator.clipboard&&navigator.clipboard.writeText(t);cp.textContent="✓ 已复制";window.__t=t};rd();</script></html>
