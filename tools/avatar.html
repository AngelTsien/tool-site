<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>头像裁剪 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>头像裁剪</h1></header><main><div class=panel><input type=file id=f accept="image/*"><div class=row><label>缩放</label><input type=range id=z min=1 max=4 step=0.01 value=1 style="flex:1"><select id=sh><option value=sq>方形</option><option value=ci>圆形</option></select><select id=sz><option>512</option><option>256</option><option>1024</option></select><button id=dl>下载</button></div><p style="color:#a99;font-size:13px">在图上拖动调整位置</p>
<canvas id=c width=360 height=360 style="touch-action:none;display:block;margin:auto;background:#eee4da;cursor:grab"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="avatar");r.unshift("avatar");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const im=new Image();let ox=0,oy=0,dr=null;const sm=()=>{const s=document.createElement("canvas");s.width=s.height=400;const x=s.getContext("2d"),g=x.createRadialGradient(200,150,20,200,200,260);g.addColorStop(0,"#f6d1b8");g.addColorStop(1,"#8fae9a");x.fillStyle=g;x.fillRect(0,0,400,400);x.font="200px serif";x.textAlign="center";x.fillText("🙂",200,270);im.src=s.toDataURL()};
const paint=(cv,S)=>{const x=cv.getContext("2d"),b=Math.max(S/im.width,S/im.height)*z.value,k=S/360;x.clearRect(0,0,S,S);x.save();if(sh.value=="ci"){x.beginPath();x.arc(S/2,S/2,S/2,0,7);x.clip()}x.drawImage(im,S/2-im.width*b/2+ox*k,S/2-im.height*b/2+oy*k,im.width*b,im.height*b);x.restore()};
const d=()=>{paint(c,360);if(sh.value=="sq"){}};im.onload=()=>{ox=oy=0;d()};f.onchange=()=>im.src=URL.createObjectURL(f.files[0]);z.oninput=sh.onchange=d;
c.onpointerdown=e=>{dr=[e.clientX-ox,e.clientY-oy];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(dr){ox=e.clientX-dr[0];oy=e.clientY-dr[1];d()}};c.onpointerup=()=>dr=null;
dl.onclick=()=>{const o=document.createElement("canvas");o.width=o.height=+sz.value;paint(o,+sz.value);const a=document.createElement("a");a.download="头像.png";a.href=o.toDataURL();a.click()};sm()</script></html>
