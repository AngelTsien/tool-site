<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>装修材料估算 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>装修材料估算</h1></header><main><div class=panel><h3>📐 房间尺寸（米）</h3><div class=row><label>长</label><input id=L type=number value=4.5 step=0.1 style="width:80px"><label>宽</label><input id=W type=number value=3.6 step=0.1 style="width:80px"><label>层高</label><input id=H type=number value=2.8 step=0.1 style="width:80px"></div>
<div class=row style="margin-top:6px"><label>门 个数</label><input id=dn type=number value=1 style="width:60px"><label>窗 个数</label><input id=wn type=number value=2 style="width:60px"><label>损耗率 %</label><input id=ws type=number value=8 style="width:60px"></div></div>
<div class="panel stat" id=ar></div><div class=grid style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class=panel><h3>🎨 墙面油漆</h3><div class=row><label>涂几遍</label><input id=pc type=number value=2 style="width:60px"><label>每升可涂 m²</label><input id=pr type=number value=10 style="width:70px"><label>每桶(升)</label><input id=pb type=number value=5 style="width:60px"><label>每桶价</label><input id=pp type=number value=45 style="width:70px"></div><p id=o1 class=res></p></div>
<div class=panel><h3>🪵 地板</h3><div class=row><label>每盒 m²</label><input id=fb type=number value=2.2 step=0.1 style="width:70px"><label>每盒价</label><input id=fp type=number value=60 style="width:70px"></div><p id=o2 class=res></p></div>
<div class=panel><h3>🧱 瓷砖</h3><div class=row><label>砖长cm</label><input id=tl type=number value=60 style="width:60px"><label>砖宽cm</label><input id=tw type=number value=60 style="width:60px"><label>每片价</label><input id=tp type=number value=8 style="width:60px"></div><p id=o3 class=res></p></div>
<div class=panel><h3>📏 踢脚线</h3><div class=row><label>每根长 m</label><input id=bl type=number value=2.4 step=0.1 style="width:70px"><label>每根价</label><input id=bp type=number value=12 style="width:60px"></div><p id=o4 class=res></p></div></div><style>.res{font-size:17px;color:#7a5a46;line-height:1.7}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="reno");r.unshift("reno");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const v=e=>+e.value||0,c=x=>Math.ceil(x-1e-9);const f=()=>{const A=v(L)*v(W),Pm=2*(v(L)+v(W)),wall=Math.max(0,Pm*v(H)-v(dn)*0.9*2.1-v(wn)*1.5*1.5),k=1+v(ws)/100;
ar.innerHTML=`<div><b>${A.toFixed(2)}</b>地面 m²</div><div><b>${wall.toFixed(2)}</b>墙面 m²（扣门窗）</div><div><b>${Pm.toFixed(2)}</b>周长 m</div><div><b>${(A*v(H)).toFixed(1)}</b>体积 m³</div>`;
const lit=wall*v(pc)/v(pr)*k,bk=c(lit/v(pb));o1.innerHTML=`需约 <b>${lit.toFixed(1)}</b> 升 → <b>${bk}</b> 桶，约 ¥${(bk*v(pp)).toFixed(0)}<br><small>（含天花板再加 ${(A*v(pc)/v(pr)).toFixed(1)} 升）</small>`;
const bx=c(A*k/v(fb));o2.innerHTML=`需 <b>${bx}</b> 盒（${(bx*v(fb)).toFixed(1)} m²），约 ¥${(bx*v(fp)).toFixed(0)}`;const ta=v(tl)*v(tw)/1e4,tn=c(A*k/ta);o3.innerHTML=`每片 ${ta.toFixed(3)} m²，需 <b>${tn}</b> 片，约 ¥${(tn*v(tp)).toFixed(0)}`;
const bl0=Math.max(0,Pm-v(dn)*0.9)*k,bn=c(bl0/v(bl));o4.innerHTML=`长度约 ${bl0.toFixed(1)} m，需 <b>${bn}</b> 根，约 ¥${(bn*v(bp)).toFixed(0)}`};document.querySelectorAll("input").forEach(e=>e.oninput=f);f()</script></html>
