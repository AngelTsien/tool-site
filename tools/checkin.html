<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>背经打卡 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>背经打卡</h1></header><main><div class=panel><label>今天要背的经文</label><textarea id=v style="min-height:70px"></textarea><div class=row><input id=r placeholder="出处，如 诗篇 119:105"><button id=ok>✅ 今天背好了</button></div></div>
<div class="panel stat"><div><b id=cur>0</b>连续天数 🔥</div><div><b id=best>0</b>最长连续</div><div><b id=tot>0</b>累计天数</div></div><div class=panel><h3 id=mt></h3><div id=cal style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center"></div></div><div class=panel><h3>已背经文</h3><div id=ls></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="checkin");r.unshift("checkin");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let D=JSON.parse(localStorage.checkin||"{}");const k=d=>d.toISOString().slice(0,10),T=new Date();v.value=localStorage.ckv||"你的话是我脚前的灯，是我路上的光。";r.value=localStorage.ckr||"诗篇 119:105";
const rd=()=>{localStorage.checkin=JSON.stringify(D);const ks=Object.keys(D).sort();let c=0,d=new Date(T);if(!D[k(d)])d.setDate(d.getDate()-1);while(D[k(d)]){c++;d.setDate(d.getDate()-1)}let b=0,run=0,prev=null;ks.forEach(x=>{run=prev&&(new Date(x)-new Date(prev))==864e5?run+1:1;b=Math.max(b,run);prev=x});
cur.textContent=c;best.textContent=b;tot.textContent=ks.length;const y=T.getFullYear(),m=T.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();mt.textContent=`${y} 年 ${m+1} 月`;
cal.innerHTML="日一二三四五六".split("").map(w=>`<b style="color:#a99">${w}</b>`).join("")+"<div></div>".repeat(f)+Array.from({length:n},(_,i)=>{const dk=k(new Date(Date.UTC(y,m,i+1)));return`<div title="${D[dk]?D[dk].r:""}" style="padding:8px 0;border-radius:10px;background:${D[dk]?"linear-gradient(135deg,#f2b179,#e07a5f)":"#f3ece2"};color:${D[dk]?"#fff":"#7a706a"};${i+1==T.getDate()?"outline:2px solid #8fae9a":""}">${i+1}</div>`}).join("");
ls.innerHTML=ks.reverse().map(x=>`<p style="margin:6px 0"><span style="color:#a99">${x}</span>　<b>${D[x].r}</b>　${D[x].v}</p>`).join("")||"<p style=color:#a99>还没有记录</p>";ok.textContent=D[k(T)]?"✅ 今天已打卡（再点更新）":"✅ 今天背好了"};
ok.onclick=()=>{localStorage.ckv=v.value;localStorage.ckr=r.value;D[k(T)]={v:v.value,r:r.value};rd();ok.animate([{transform:"scale(1.2)"},{transform:"scale(1)"}],300)};rd()</script></html>
