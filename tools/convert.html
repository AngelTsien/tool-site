<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简繁转换 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>简繁转换</h1></header><main><div class=panel><textarea id=a>我们爱，因为神先爱我们。</textarea><p class=row><button id=s2t>简 → 繁</button><button id=s2tw class=alt>简 → 台湾正体</button><button id=t2s class=alt>繁 → 简</button><button id=cp class=alt>复制结果</button></p><textarea id=b readonly></textarea></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/opencc.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="convert");r.unshift("convert");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const C={s2t:OpenCC.Converter({from:"cn",to:"t"}),s2tw:OpenCC.Converter({from:"cn",to:"twp"}),t2s:OpenCC.Converter({from:"t",to:"cn"})};let m="s2t";const go=k=>{m=k;b.value=C[k](a.value)};
