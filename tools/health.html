<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喝水/体重记录 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>喝水/体重记录</h1></header><main><div class=panel style="text-align:center"><h3>💧 今天喝水</h3><div style="position:relative;width:140px;height:200px;margin:auto;border:4px solid #7ab0d6;border-top:none;border-radius:0 0 30px 30px;overflow:hidden"><div id=wv style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#9fd0ee,#5a9fd0);transition:height .5s"></div><div id=wt style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#2c4a63"></div></div>
<div class=row style="justify-content:center;margin-top:10px"><button data-ml=250>+ 一杯 250ml</button><button class=alt data-ml=500>+ 一瓶 500ml</button><button class=alt data-ml=-250>撤销 250</button><label>目标</label><input id=gl type=number value=2000 style="width:90px"></div></div>
<div class=panel><h3>⚖️ 体重</h3><div class=row><input id=kg type=number step=0.1 placeholder="今天体重 kg" style="width:140px"><button id=sk>记录</button><span id=wd style="color:#7a706a"></span></div><canvas id=c width=800 height=300 style="width:100%;margin-top:10px"></canvas></div><div class=panel><h3>近 7 天喝水</h3><div id=wk style="display:flex;gap:8px;align-items:flex-end;height:140px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="health");r.unshift("health");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let D=JSON.parse(localStorage.hlth||"{}");const k=d=>d.toISOString().slice(0,10),T=k(new Date());gl.value=localStorage.hgoal||2000;const g=d=>D[d]=D[d]||{w:0};
const rd=()=>{localStorage.hlth=JSON.stringify(D);localStorage.hgoal=gl.value;const w=g(T).w,p=Math.min(100,w/gl.value*100);wv.style.height=p+"%";wt.textContent=`${w} ml`+(w>=gl.value?" 🎉":"");
wk.innerHTML=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const v=(D[k(d)]||{}).w||0;return`<div style="flex:1;text-align:center;font-size:12px"><div style="height:${Math.min(110,v/gl.value*100)}px;background:${v>=gl.value?"#5a9fd0":"#b8d6ec"};border-radius:6px 6px 0 0"></div>${d.getMonth()+1}/${d.getDate()}<br>${v}</div>`}).join("");
const W=Object.keys(D).sort().filter(d=>D[d].kg).map(d=>[d,D[d].kg]),x=c.getContext("2d");x.clearRect(0,0,800,300);if(W.length){const v=W.map(a=>a[1]),mn=Math.min(...v)-1,mx=Math.max(...v)+1,X=i=>40+(W.length<2?360:i*720/(W.length-1)),Y=y=>260-(y-mn)/(mx-mn)*230;
x.strokeStyle="#eee";x.fillStyle="#a99";x.font="14px sans-serif";for(let s=0;s<=4;s++){const yy=mn+(mx-mn)*s/4;x.beginPath();x.moveTo(40,Y(yy));x.lineTo(780,Y(yy));x.stroke();x.fillText(yy.toFixed(1),0,Y(yy)+4)}
x.strokeStyle="#d9a47c";x.lineWidth=3;x.beginPath();W.forEach(([d,y],i)=>i?x.lineTo(X(i),Y(y)):x.moveTo(X(i),Y(y)));x.stroke();W.forEach(([d,y],i)=>{x.fillStyle="#c48fa8";x.beginPath();x.arc(X(i),Y(y),5,0,7);x.fill();x.fillStyle="#7a706a";x.fillText(d.slice(5),X(i)-18,290)});
wd.textContent=W.length>1?`较上次 ${(v[v.length-1]-v[v.length-2]>0?"+":"")+(v[v.length-1]-v[v.length-2]).toFixed(1)} kg，共 ${W.length} 次记录`:""}else{x.fillStyle="#a99";x.font="18px sans-serif";x.fillText("还没有体重记录",320,150)}};
document.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{g(T).w=Math.max(0,g(T).w+ +b.dataset.ml);rd()});sk.onclick=()=>{if(+kg.value){g(T).kg=+kg.value;kg.value="";rd()}};gl.onchange=rd;rd();window.__D=()=>D</script></html>
