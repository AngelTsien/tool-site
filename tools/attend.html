<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聚会签到 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>聚会签到</h1></header><main><div class=panel><details><summary>👥 名单（每行一人，可加分组：姓名,小组）</summary><textarea id=t style="min-height:110px">张弟兄,青年组
李姊妹,青年组
王弟兄,夫妻组
陈姊妹,夫妻组
刘弟兄,长青组
赵姊妹,长青组</textarea><button id=sv>保存名单</button></details><div class=row style="margin-top:8px"><input type=date id=dt><input id=ev value="主日崇拜"><input id=q placeholder="🔍 搜名字" style="width:120px"><input id=nw placeholder="新朋友名字" style="width:120px"><button class=alt id=an>+ 新朋友</button></div></div>
<div class="panel stat" id=sm></div><div id=ls class=grid></div><div class=panel><p class=row><button class=alt id=ex>导出本次 CSV</button><button class=alt id=hx>历史出席统计</button></p><div id=hs class=out style="display:none"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="attend");r.unshift("attend");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>t.value=localStorage.attl||t.value;dt.valueAsDate=new Date();let H=JSON.parse(localStorage.atth||"{}");const key=()=>dt.value+" "+ev.value,L=()=>t.value.split("\n").map(l=>l.split(/[,，]/).map(s=>s.trim())).filter(a=>a[0]);
const rd=()=>{localStorage.atth=JSON.stringify(H);const r=H[key()]=H[key()]||{in:{},nw:[]},P=L();const all=[...P,...r.nw.map(n=>[n,"新朋友"])];const ins=all.filter(p=>r.in[p[0]]).length;
const G={};all.forEach(p=>{const g=p[1]||"其他";G[g]=G[g]||[0,0];G[g][1]++;if(r.in[p[0]])G[g][0]++});sm.innerHTML=`<div><b>${ins}/${all.length}</b>已签到</div><div><b>${all.length?Math.round(ins/all.length*100):0}%</b>出席率</div><div><b>${r.nw.length}</b>新朋友</div>`+Object.entries(G).map(([g,[a,b]])=>`<div><b>${a}/${b}</b>${g}</div>`).join("");
ls.innerHTML=all.filter(p=>!q.value||p[0].includes(q.value)).map(p=>`<div class=card style="cursor:pointer;text-align:center;--c:${r.in[p[0]]?"#8fc79a":"#eee"};${r.in[p[0]]?"border-color:#8fc79a":""}" data-n="${p[0]}"><div style="font-size:20px;font-weight:700">${r.in[p[0]]?"✅ ":""}${p[0]}</div><p>${p[1]||""}${r.in[p[0]]?" · "+r.in[p[0]]:""}</p></div>`).join("")};
ls.onclick=e=>{const c=e.target.closest("[data-n]");if(!c)return;const r=H[key()],n=c.dataset.n;r.in[n]?delete r.in[n]:r.in[n]=new Date().toTimeString().slice(0,5);rd()};
an.onclick=()=>{const n=nw.value.trim();if(n){const r=H[key()];r.nw.push(n);r.in[n]=new Date().toTimeString().slice(0,5);nw.value="";rd()}};[dt,ev,q].forEach(e=>e.oninput=rd);sv.onclick=()=>{localStorage.attl=t.value;rd()};
ex.onclick=()=>{const r=H[key()],all=[...L(),...r.nw.map(n=>[n,"新朋友"])];const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff姓名,小组,签到时间\n"+all.map(p=>[p[0],p[1]||"",r.in[p[0]]||"缺席"].join(",")).join("\n")]));a.download=`签到_${key()}.csv`;a.click()};
hx.onclick=()=>{hs.style.display="";const P=L(),ks=Object.keys(H).sort();hs.textContent=ks.map(k=>`${k}：${Object.keys(H[k].in).length} 人`).join("\n")+"\n\n个人出席次数：\n"+P.map(p=>`${p[0]} ${ks.filter(k=>H[k].in[p[0]]).length}/${ks.length}`).join("\n")};rd()</script></html>
