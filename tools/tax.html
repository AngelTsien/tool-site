<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个税计算 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>个税计算</h1></header><main><div class=panel><div class=row><div><label>月税前工资</label><input id=s type=number value=20000></div><div><label>五险一金（个人/月）</label><input id=i type=number value=3000></div><div><label>专项附加扣除（/月）</label><input id=a type=number value=2000></div><div><label>年终奖（可选）</label><input id=b type=number value=0></div></div><p style="font-size:12px;color:#a99">专项附加：子女教育/婴幼儿照护 每孩 2000、赡养老人 3000、房贷利息 1000、住房租金 800–1500、继续教育 400 等</p></div>
<div class="panel stat" id=sm></div><div class=panel style="overflow:auto"><table id=tb style="width:100%;border-collapse:collapse;font-size:14px"></table></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="tax");r.unshift("tax");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const BR=[[36000,.03,0],[144000,.1,2520],[300000,.2,16920],[420000,.25,31920],[660000,.3,52920],[960000,.35,85920],[1/0,.45,181920]],tx=x=>{if(x<=0)return 0;const r=BR.find(b=>x<=b[0]);return x*r[1]-r[2]};
const MB=[[3000,.03,0],[12000,.1,210],[25000,.2,1410],[35000,.25,2660],[55000,.3,4410],[80000,.35,7160],[1/0,.45,15160]],bt=x=>{if(x<=0)return 0;const r=MB.find(q=>x/12<=q[0]);return x*r[1]-r[2]};const m=v=>v.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
const f=()=>{let paid=0,rows=[],net=0;for(let k=1;k<=12;k++){const cum=(s.value-i.value-a.value-5000)*k,t=Math.max(0,tx(cum)-paid);paid+=t;net+=s.value-i.value-t;rows.push([k,m(cum>0?cum:0),m(t),m(s.value-i.value-t)])}
const B=+b.value,sep=bt(B),comb=tx((s.value-i.value-a.value-5000)*12+B)-paid;sm.innerHTML=`<div><b>${m(paid)}</b>全年工资个税</div><div><b>${m(net/12)}</b>平均月到手</div><div><b>${m(paid/12)}</b>平均每月个税</div>`+(B?`<div><b>${m(sep)}</b>年终奖单独计税</div><div><b>${m(comb)}</b>并入综合所得多缴</div><div><b style="color:${sep<=comb?"#4a9a5a":"#c05a4a"}">${sep<=comb?"单独计税":"并入综合"}</b>更划算</div>`:"");
tb.innerHTML="<tr>"+["月份","累计应纳税所得额","当月预扣个税","当月到手"].map(x=>`<th style="background:#e3eee5;padding:6px">${x}</th>`).join("")+"</tr>"+rows.map(r=>"<tr>"+r.map(c=>`<td style="padding:6px;border-bottom:1px solid #eee;text-align:right">${c}</td>`).join("")+"</tr>").join("")};[s,i,a,b].forEach(e=>e.oninput=f);f();window.__tx=tx</script></html>
