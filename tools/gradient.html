<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渐变生成器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>渐变生成器</h1></header><main><div class=panel><div id=pv style="height:220px;border-radius:16px;box-shadow:0 4px 18px #0002"></div><div class=row style="margin-top:12px"><select id=ty><option value=linear>线性</option><option value=radial>径向</option><option value=conic>锥形</option></select><label>角度</label><input type=range id=an min=0 max=360 value=135><span id=av>135°</span><button class=alt id=rd>🎲 随机</button><button class=alt id=ad>+ 颜色</button></div>
<div id=st class=row style="margin-top:8px"></div><div class=row style="margin-top:8px" id=pre></div><div class=out id=css style="margin-top:12px"></div><div class=row><button id=cp>复制 CSS</button><select id=ws><option value="1080x1920">手机壁纸</option><option value="1920x1080">电脑壁纸</option><option value="1080x1080">方形</option></select><button class=alt id=dl>下载图片</button></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="gradient");r.unshift("gradient");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let S=[["#f6d365",0],["#fda085",100]];const PR=[["#a1c4fd","#c2e9fb"],["#fbc2eb","#a6c1ee"],["#84fab0","#8fd3f4"],["#ffecd2","#fcb69f"],["#d4fc79","#96e6a1"],["#667eea","#764ba2"],["#f093fb","#f5576c"],["#e0c3fc","#8ec5fc"]];
pre.innerHTML="<span style='font-size:13px;color:#a99'>预设：</span>"+PR.map((p,i)=>`<button style="width:36px;height:28px;padding:0;background:linear-gradient(135deg,${p[0]},${p[1]})" onclick="S=[['${p[0]}',0],['${p[1]}',100]];f()"></button>`).join("");
const cs=()=>{const s=[...S].sort((a,b)=>a[1]-b[1]).map(([c,p])=>`${c} ${p}%`).join(", ");return ty.value=="linear"?`linear-gradient(${an.value}deg, ${s})`:ty.value=="radial"?`radial-gradient(circle, ${s})`:`conic-gradient(from ${an.value}deg, ${s})`};
const pvw=()=>{av.textContent=an.value+"°";const g=cs();pv.style.background=g;css.textContent=`background: ${g};`};const f=()=>{pvw();st.innerHTML=S.map(([c,p],i)=>`<div class=row style="gap:4px;background:#f7f3ee;padding:4px 8px;border-radius:10px"><input type=color value="${c}" oninput="S[${i}][0]=this.value;pvw()"><input type=number value="${p}" min=0 max=100 style="width:64px" oninput="S[${i}][1]=+this.value;pvw()">%${S.length>2?`<button class=alt style="padding:2px 8px" onclick="S.splice(${i},1);f()">✕</button>`:""}</div>`).join("")};
const rc=()=>"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");rd.onclick=()=>{S=[[rc(),0],[rc(),100]];an.value=Math.random()*360|0;f()};ad.onclick=()=>{S.push([rc(),50]);f()};ty.onchange=an.oninput=pvw;cp.onclick=()=>navigator.clipboard.writeText(css.textContent);
dl.onclick=()=>{const[W,H]=ws.value.split("x").map(Number),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),ss=[...S].sort((a,b)=>a[1]-b[1]);let g;const r=an.value*Math.PI/180;
if(ty.value=="linear"){const L=Math.abs(W*Math.sin(r))+Math.abs(H*Math.cos(r));g=x.createLinearGradient(W/2-Math.sin(r)*L/2,H/2+Math.cos(r)*L/2,W/2+Math.sin(r)*L/2,H/2-Math.cos(r)*L/2)}else if(ty.value=="radial")g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)/2);else g=x.createConicGradient(r-Math.PI/2,W/2,H/2);
ss.forEach(([cc,p])=>g.addColorStop(p/100,cc));x.fillStyle=g;x.fillRect(0,0,W,H);const a=document.createElement("a");a.download="渐变壁纸.png";a.href=c.toDataURL();a.click()};f()</script></html>
