<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汉字描红练习 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>汉字描红练习</h1></header><main><div class=panel><div class=row><input id=ws value="爱神平安喜乐" placeholder="要练的字" style="flex:1;font-size:18px"><select id=ft><option value="'KaiTi','STKaiti',serif">楷体</option><option value="serif">宋体</option><option value="sans-serif">黑体</option></select><label style="margin:0"><input type=checkbox id=gh checked>描红</label></div></div>
<div class=panel style="text-align:center"><div id=py style="font-size:22px;color:#b98a62;min-height:30px"></div><canvas id=cv width=600 height=600 style="width:min(calc(100vw - 72px),340px);touch-action:none;border:2px solid #d66;border-radius:6px;background:#fffdf8"></canvas>
<div class=row style="justify-content:center;margin-top:8px"><button class=alt id=pv>‹ 上一个</button><button class=alt id=cl>🧽 擦掉</button><button id=ck>✔ 打分</button><button class=alt id=nx>下一个 ›</button></div><h2 id=sc style="margin:8px 0"></h2><div id=hist style="font-size:14px;color:#7a706a"></div></div>
<div class=panel><div class=row><b>🖨 拼音生字卡</b><button class=alt id=pr>打印本组生字卡</button></div><div id=cards class=grid style="margin-top:10px"></div></div><style>@media print{header,footer,.panel:not(:last-of-type),.panel .row{display:none!important}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/pinyin-pro.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="stroke");r.unshift("stroke");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let I=0,ink=null,dr=0,last=null,H=JSON.parse(localStorage.stroke||"{}");const x=cv.getContext("2d"),W=600,chars=()=>[...ws.value.replace(/[^\u4e00-\u9fa5]/g,"")];
const glyph=(c,ctx,a)=>{ctx.font=`${W*.78}px ${ft.value}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=a;ctx.fillText(c,W/2,W/2+W*.04)};
const grid=()=>{x.clearRect(0,0,W,W);x.strokeStyle="#f0b0b0";x.setLineDash([10,10]);x.lineWidth=2;x.beginPath();x.moveTo(0,W/2);x.lineTo(W,W/2);x.moveTo(W/2,0);x.lineTo(W/2,W);x.moveTo(0,0);x.lineTo(W,W);x.moveTo(W,0);x.lineTo(0,W);x.stroke();x.setLineDash([]);const c=chars()[I];if(c&&gh.checked)glyph(c,x,"#00000018");x.drawImage(ink,0,0)};
const reset=()=>{ink=document.createElement("canvas");ink.width=ink.height=W;const c=chars()[I]||"";py.textContent=c?pinyinPro.pinyin(c)+"　("+(I+1)+"/"+chars().length+")":"请输入汉字";sc.textContent="";grid();hs()};
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*W/r.height]};
cv.onpointerdown=e=>{dr=1;last=pos(e);cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!dr)return;const p=pos(e),k=ink.getContext("2d");k.strokeStyle="#222";k.lineWidth=34;k.lineCap=k.lineJoin="round";k.beginPath();k.moveTo(...last);k.lineTo(...p);k.stroke();last=p;grid()};cv.onpointerup=cv.onpointercancel=()=>dr=0;
ck.onclick=()=>{const c=chars()[I];if(!c)return;const g=document.createElement("canvas");g.width=g.height=W;const gc=g.getContext("2d");glyph(c,gc,"#000");const a=gc.getImageData(0,0,W,W).data,b=ink.getContext("2d").getImageData(0,0,W,W).data;let G=0,B=0,O=0;
for(let i=3;i<a.length;i+=16){const ga=a[i]>60,ba=b[i]>60;if(ga)G++;if(ba)B++;if(ga&&ba)O++}const cov=G?O/G:0,pre=B?O/B:0,s=Math.round(Math.min(100,(cov*.6+pre*.4)*130));window.__s=s;sc.textContent=B<50?"先写一写吧 ✍️":s>=85?`🌟 ${s} 分 太棒了！`:s>=65?`👍 ${s} 分 不错`:`💪 ${s} 分 再试一次`;
if(B>=50){(H[c]=H[c]||[]).push(s);localStorage.stroke=JSON.stringify(H);hs()}};
const hs=()=>{hist.textContent=chars().map(c=>H[c]?`${c} 最佳 ${Math.max(...H[c])}`:"").filter(Boolean).join(" · ")};
cl.onclick=reset;nx.onclick=()=>{I=(I+1)%Math.max(1,chars().length);reset()};pv.onclick=()=>{I=(I-1+chars().length)%Math.max(1,chars().length);reset()};ws.oninput=()=>{I=0;reset();cd()};ft.onchange=gh.onchange=()=>grid();
const cd=()=>{cards.innerHTML=chars().map(c=>`<div class=card style="text-align:center;padding:10px"><div style="color:#b98a62">${pinyinPro.pinyin(c)}</div><div style="font-size:54px;font-family:KaiTi,STKaiti,serif">${c}</div><div style="font-size:12px;color:#999">${pinyinPro.polyphonic?"":""}</div></div>`).join("")};pr.onclick=()=>print();reset();cd();</script></html>
