<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证件照换底/排版 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>证件照换底/排版</h1></header><main><div class=panel><input type=file id=f accept="image/*"><div class=row style="margin-top:10px">底色<button class=alt data-c="#ffffff" style="background:#fff">白</button><button data-c="#438edb" style="background:#438edb">蓝</button><button data-c="#d9222a" style="background:#d9222a">红</button><input type=color id=bc value="#438edb" style="padding:0;width:44px;height:38px"></div>
<label>抠图容差 <span id=tv>60</span></label><input type=range id=tol min=10 max=160 value=60 style="width:100%"><label>边缘柔化 <span id=fv>2</span></label><input type=range id=fe min=0 max=8 value=2 style="width:100%">
<div class=row><select id=sz><option value="295,413">一寸 25×35mm</option><option value="413,579">二寸 35×49mm</option><option value="390,567">小二寸 33×48mm</option><option value="413,531">护照/签证 35×45mm</option><option value="600,600">美签 51×51mm</option></select><label style="margin:0">缩放</label><input type=range id=zm min=50 max=200 value=100><label style="margin:0">上下</label><input type=range id=oy min=-50 max=50 value=0></div>
<p style="color:#7a706a;font-size:13px">原理：从照片四角取背景色，把相近颜色替换成新底色。纯色背景（白墙/幕布）效果最好。</p></div>
<div class=panel style="text-align:center"><canvas id=out style="border:1px solid #ddd;max-height:360px;border-radius:0"></canvas><div class=row style="justify-content:center;margin-top:10px"><button id=d1>💾 下载单张</button><button id=d2>🖨 6寸排版下载</button></div><canvas id=sh style="margin-top:10px;border:1px solid #ddd;border-radius:0;width:100%;max-width:450px"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="idphoto");r.unshift("idphoto");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let I=null,B="#438edb";const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
f.onchange=()=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{I=i;go()};i.src=r.result};f.files[0]&&r.readAsDataURL(f.files[0])};
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{B=b.dataset.c;bc.value=B;go()});bc.oninput=()=>{B=bc.value;go()};[tol,fe,sz,zm,oy].forEach(x=>x.oninput=go);
function go(){tv.textContent=tol.value;fv.textContent=fe.value;const[W,H]=sz.value.split(",").map(Number);out.width=W;out.height=H;const x=out.getContext("2d");x.fillStyle=B;x.fillRect(0,0,W,H);if(!I){x.fillStyle="#fff8";x.font="28px sans-serif";x.textAlign="center";x.fillText("请选择照片",W/2,H/2);lay();return}
const t=document.createElement("canvas");t.width=W;t.height=H;const c=t.getContext("2d"),s=Math.max(W/I.width,H/I.height)*zm.value/100;c.drawImage(I,(W-I.width*s)/2,(H-I.height*s)/2+oy.value*H/100,I.width*s,I.height*s);
const d=c.getImageData(0,0,W,H),p=d.data,sm=[[2,2],[W-3,2],[2,H/3|0],[W-3,H/3|0]].map(([a,b])=>{const i=(b*W+a)*4;return[p[i],p[i+1],p[i+2]]}),bg=[0,1,2].map(k=>sm.reduce((a,v)=>a+v[k],0)/4),T=+tol.value,FE=+fe.value*10,nb=hx(B);
for(let i=0;i<p.length;i+=4){const dd=Math.hypot(p[i]-bg[0],p[i+1]-bg[1],p[i+2]-bg[2]);let a=dd<T?0:dd<T+FE?(dd-T)/FE:1;if(p[i+3]==0)a=0;for(let k=0;k<3;k++)p[i+k]=p[i+k]*a+nb[k]*(1-a);p[i+3]=255}c.putImageData(d,0,0);x.drawImage(t,0,0);lay()}
function lay(){const[W,H]=sz.value.split(",").map(Number);sh.width=1800;sh.height=1200;const x=sh.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,1800,1200);const g=20,cols=Math.floor((1800-g)/(W+g)),rows=Math.floor((1200-g)/(H+g)),ox=(1800-cols*(W+g)+g)/2,oyy=(1200-rows*(H+g)+g)/2;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){x.drawImage(out,ox+c*(W+g),oyy+r*(H+g));x.strokeStyle="#ccc";x.strokeRect(ox+c*(W+g),oyy+r*(H+g),W,H)}window.__n=rows*cols}
const dl=(c,n)=>{const a=document.createElement("a");a.href=c.toDataURL("image/jpeg",.95);a.download=n;a.click()};d1.onclick=()=>dl(out,"证件照.jpg");d2.onclick=()=>dl(sh,"证件照_6寸排版.jpg");go();</script></html>
