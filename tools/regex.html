<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正则测试 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>正则测试</h1></header><main><div class=panel><div class=row><span style="font-size:22px">/</span><input id=re value="(\d{3})-(\d{4})" style="flex:1;font-family:monospace"><span style="font-size:22px">/</span><input id=fl value="g" style="width:60px;font-family:monospace"></div><p id=er style="color:#c05a4a"></p>
<label>测试文本</label><textarea id=t>电话：555-1234，备用 666-9876，无效 12-34</textarea><label>替换为（可用 $1 $2）</label><input id=rp value="[$2]" style="width:100%;font-family:monospace">
<div class=row style="margin-top:8px"><span style="font-size:13px;color:#a99">常用：</span><button class=alt data-r="1[3-9]\d{9}">手机号</button><button class=alt data-r="[\w.-]+@[\w-]+\.[\w.]+">邮箱</button><button class=alt data-r="[\u4e00-\u9fff]+">汉字</button><button class=alt data-r="https?://\S+">网址</button><button class=alt data-r="\d+(\.\d+)?">数字</button></div></div>
<div class=panel><h3>高亮 <span id=cn style="color:#b98a62"></span></h3><div id=hl class=out></div><h3>分组</h3><div id=gp class=out></div><h3>替换结果</h3><div id=rs class=out></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="regex");r.unshift("regex");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const es=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");const f=()=>{er.textContent="";let R;try{R=new RegExp(re.value,fl.value.includes("g")?fl.value:fl.value+"g")}catch(e){er.textContent="✗ "+e.message;return}
const M=[...t.value.matchAll(R)].filter(m=>m[0]!=="");cn.textContent=`${M.length} 处匹配`;let h="",p=0;M.forEach(m=>{h+=es(t.value.slice(p,m.index))+`<mark style="background:#f6c9b4;border-radius:3px">${es(m[0])}</mark>`;p=m.index+m[0].length});hl.innerHTML=h+es(t.value.slice(p));
gp.textContent=M.map((m,i)=>`#${i+1} "${m[0]}"`+m.slice(1).map((g,j)=>`  $${j+1}="${g??""}"`).join("")).join("\n")||"（无）";try{rs.textContent=t.value.replace(new RegExp(re.value,fl.value),rp.value)}catch(e){}};
[re,fl,t,rp].forEach(e=>e.oninput=f);document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{re.value=b.dataset.r;f()});f()</script></html>
