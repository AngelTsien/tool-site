<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>起名助手 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>起名助手</h1></header><main><div class=panel><div class=row><input id=sn placeholder="姓（如：王 / 欧阳）" style="width:130px" value="林"><select id=gd><option value=b>👦 男孩</option><option value=g>👧 女孩</option><option value=a>不限</option></select><select id=ln><option value=2>双字名</option><option value=1>单字名</option></select></div>
<div class=row style="margin-top:8px">风格：<label style="margin:0"><input type=checkbox class=tg value=信 checked>信仰</label><label style="margin:0"><input type=checkbox class=tg value=德 checked>品德</label><label style="margin:0"><input type=checkbox class=tg value=光 checked>光明</label><label style="margin:0"><input type=checkbox class=tg value=自 checked>自然</label><label style="margin:0"><input type=checkbox class=tg value=智 checked>才智</label></div>
<div class=row style="margin-top:8px"><input id=must placeholder="必须包含的字（可选）" style="width:170px"><input id=avoid placeholder="避开的字" style="width:120px"><button id=go>✨ 生成 12 个</button><button class=alt id=fv>⭐ 收藏夹</button></div><p style="color:#7a706a;font-size:13px;margin-bottom:0">自动避开：三字同声调、名字与姓同韵、拗口叠声。仅供参考 😊</p></div><div class=grid id=out></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="naming");r.unshift("naming");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const C="恩|ēn|信|恩典、感恩|a;慕|mù|信|仰慕、渴慕|a;望|wàng|信|盼望|a;约|yuē|信|约定、立约|b;嘉|jiā|德|美好、嘉许|a;以|yǐ|信|以马内利|b;琳|lín|自|美玉|g;灵|líng|信|灵巧、圣灵|a;诺|nuò|德|诺言、信实|a;安|ān|德|平安|a;宁|níng|德|安宁|a;心|xīn|德|心意|g;怡|yí|德|怡然喜乐|g;悦|yuè|德|喜悦|g;欣|xīn|德|欣喜|g;雅|yǎ|德|文雅|g;婷|tíng|自|亭亭玉立|g;馨|xīn|德|馨香|g;蕙|huì|自|香草，兰心蕙质|g;晴|qíng|自|晴朗|g;雪|xuě|自|洁白如雪|g;妍|yán|自|美丽|g;瑶|yáo|自|美玉|g;薇|wēi|自|蔷薇|g;语|yǔ|智|言语温和|g;诗|shī|智|诗篇|g;歌|gē|信|诗歌赞美|g;颂|sòng|信|颂赞|a;音|yīn|智|佳音|g;霖|lín|自|甘霖|a;泽|zé|德|恩泽|b;涵|hán|德|包涵|a;沐|mù|自|沐浴恩光|a;溪|xī|自|溪水|g;清|qīng|德|清澈|a;澄|chéng|德|澄澈|a;明|míng|光|光明|a;晨|chén|光|清晨|a;曦|xī|光|晨光|a;晖|huī|光|光辉|a;熙|xī|光|光明兴盛|a;昕|xīn|光|黎明|a;耀|yào|光|荣耀|b;辉|huī|光|光辉|b;光|guāng|光|世上的光|a;煦|xù|光|温暖|a;旭|xù|光|旭日|b;阳|yáng|光|阳光|b;朗|lǎng|光|开朗|b;星|xīng|光|星辰|a;宇|yǔ|智|宇宙、气宇|b;轩|xuān|德|气度不凡|b;睿|ruì|智|睿智|b;哲|zhé|智|哲思|b;思|sī|智|思考|a;博|bó|智|博学|b;文|wén|智|文采|a;书|shū|智|书香|a;知|zhī|智|知识|a;谦|qiān|德|谦卑|b;仁|rén|德|仁爱|b;义|yì|德|公义|b;诚|chéng|德|诚实|b;良|liáng|德|善良|b;勇|yǒng|德|勇敢|b;毅|yì|德|坚毅|b;恒|héng|德|恒久忍耐|b;信|xìn|信|信心|a;承|chéng|德|承担|b;铭|míng|德|铭记|b;牧|mù|信|牧者|b;迦|jiā|信|迦南|b;亚|yà|信|亚伯拉罕|b;伯|bó|信|长者|b;约|yuē|信|约书亚|b;拿|ná|信|拿单|b;但|dàn|信|但以理|b;摩|mó|信|摩西|b;彼|bǐ|信|彼得|b;保|bǎo|德|保守|b;山|shān|自|高山|b;峰|fēng|自|山峰|b;岩|yán|自|磐石|b;磊|lěi|德|光明磊落|b;森|sēn|自|森林|b;林|lín|自|树林|a;松|sōng|自|松柏常青|b;柏|bǎi|自|松柏|b;杨|yáng|自|杨树|b;嘉|jiā|德|嘉美|b;乐|lè|德|喜乐|a;怀|huái|德|胸怀|b;远|yuǎn|智|志向远大|b;航|háng|智|远航|b;天|tiān|信|天父|b;佑|yòu|信|保佑|b;恺|kǎi|德|和乐|b;瀚|hàn|自|浩瀚|b;舟|zhōu|自|方舟|b;和|hé|德|和平|a;平|píng|德|平安|a;爱|ài|信|爱|a;慧|huì|智|智慧|g;萱|xuān|自|萱草|g;芊|qiān|自|芊芊绿草|g;苗|miáo|自|幼苗|g;茵|yīn|自|绿茵|g;蓓|bèi|自|花蕾|g;莉|lì|自|茉莉|g;荷|hé|自|荷花|g;依|yī|德|依靠|g;灵|líng|智|灵秀|g;珊|shān|自|珊瑚|g;玥|yuè|自|神珠|g;璐|lù|自|美玉|g;婧|jìng|德|有才德|g;娴|xián|德|娴静|g;淑|shū|德|贤淑|g;柔|róu|德|温柔|g;恬|tián|德|恬静|g;舒|shū|德|舒展|a".split(";").map(s=>{const[c,p,t,m,g]=s.split("|");return{c,p,t,m,g}});
const tone=p=>{const m={"ā":1,"ē":1,"ī":1,"ō":1,"ū":1,"á":2,"é":2,"í":2,"ó":2,"ú":2,"ǎ":3,"ě":3,"ǐ":3,"ǒ":3,"ǔ":3,"à":4,"è":4,"ì":4,"ò":4,"ù":4};for(const c of p)if(m[c])return m[c];return 0},fin=p=>p.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])/,"");
const SN={"王":"wáng","李":"lǐ","张":"zhāng","刘":"liú","陈":"chén","杨":"yáng","黄":"huáng","赵":"zhào","吴":"wú","周":"zhōu","徐":"xú","孙":"sūn","马":"mǎ","朱":"zhū","胡":"hú","郭":"guō","何":"hé","林":"lín","罗":"luó","高":"gāo","郑":"zhèng","梁":"liáng","谢":"xiè","宋":"sòng","唐":"táng","许":"xǔ","韩":"hán","冯":"féng","邓":"dèng","曹":"cáo","彭":"péng","曾":"zēng","萧":"xiāo","田":"tián","董":"dǒng","潘":"pān","袁":"yuán","蔡":"cài","蒋":"jiǎng","余":"yú","于":"yú","杜":"dù","叶":"yè","程":"chéng","魏":"wèi","苏":"sū","吕":"lǚ","丁":"dīng","任":"rén","卢":"lú","姚":"yáo","沈":"shěn","钟":"zhōng","姜":"jiāng","崔":"cuī","谭":"tán","陆":"lù","范":"fàn","汪":"wāng","廖":"liào","石":"shí","金":"jīn","韦":"wéi","贾":"jiǎ","夏":"xià","付":"fù","方":"fāng","邹":"zōu","熊":"xióng","白":"bái","孟":"mèng","秦":"qín","邱":"qiū","侯":"hóu","江":"jiāng","尹":"yǐn","薛":"xuē","闫":"yán","段":"duàn","雷":"léi","龙":"lóng","黎":"lí","史":"shǐ","陶":"táo","贺":"hè","毛":"máo","郝":"hǎo","顾":"gù","龚":"gōng","邵":"shào","万":"wàn","钱":"qián","严":"yán","欧阳":"ōu yáng","司马":"sī mǎ","诸葛":"zhū gě","上官":"shàng guān"};
let FV=JSON.parse(localStorage.namefav||"[]"),SHOWF=0;
const card=(nm,py,ms)=>`<div class=card style="text-align:center"><span class=star data-n="${nm}" style="float:right;cursor:pointer;font-size:22px">${FV.some(f=>f.n==nm)?"★":"☆"}</span><div style="font-size:13px;color:#999">${py}</div><div style="font-size:38px;font-weight:700;letter-spacing:6px;color:#8a5a3a">${nm}</div><p>${ms}</p></div>`;
go.onclick=()=>{SHOWF=0;const s=sn.value.trim()||"林",sp=(SN[s]||"").split(" ").pop(),tg=[...document.querySelectorAll(".tg:checked")].map(x=>x.value),av=avoid.value,mu=[...must.value.trim()];
let pool=C.filter(x=>(gd.value=="a"||x.g=="a"||x.g==gd.value)&&tg.includes(x.t)&&!av.includes(x.c)&&!s.includes(x.c));const seen=new Set(),R=[];let tries=0;
while(R.length<12&&tries++<3000){let a=[];for(let i=0;i<+ln.value;i++)a.push(pool[Math.random()*pool.length|0]);if(mu.length){const m=C.find(x=>x.c==mu[0])||{c:mu[0],p:"",m:"指定用字"};a[Math.random()*a.length|0]=m}
if(a.some(x=>!x)||new Set(a.map(x=>x.c)).size<a.length)continue;const nm=a.map(x=>x.c).join("");if(seen.has(nm))continue;const ts=[sp,...a.map(x=>x.p)].filter(Boolean).map(tone);
if(ts.length==3&&ts[0]==ts[1]&&ts[1]==ts[2])continue;if(sp&&fin(sp)==fin(a[0].p))continue;if(a.length==2&&fin(a[0].p)==fin(a[1].p))continue;seen.add(nm);R.push({n:s+nm,p:[SN[s]||"",...a.map(x=>x.p)].join(" "),m:a.map(x=>`<b>${x.c}</b>：${x.m}`).join("　")})}
out.innerHTML=R.map(r=>card(r.n,r.p,r.m)).join("")||"<p>条件太严格了，换几个风格试试</p>";window.__R=R};
out.onclick=e=>{const s=e.target.closest(".star");if(!s)return;const n=s.dataset.n,c=s.closest(".card");FV=FV.some(f=>f.n==n)?FV.filter(f=>f.n!=n):[...FV,{n,p:c.children[1].textContent,m:c.querySelector("p").innerHTML}];localStorage.namefav=JSON.stringify(FV);s.textContent=FV.some(f=>f.n==n)?"★":"☆";if(SHOWF)fv.onclick()};
fv.onclick=()=>{SHOWF=1;out.innerHTML=FV.map(f=>card(f.n,f.p,f.m)).join("")||"<p>还没有收藏，点 ☆ 收藏喜欢的名字</p>"};go.onclick();</script></html>
