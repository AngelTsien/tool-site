<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密码生成器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>密码生成器</h1></header><main><div class=panel><div class=out id=o style="font-size:22px;text-align:center;word-break:break-all"></div><p class=row style="justify-content:center"><button id=g>🔄 重新生成</button><button class=alt id=cp>复制</button></p>
<label>长度 <span id=lv>16</span></label><input type=range id=L min=6 max=48 value=16 style="width:100%"><div class=row><label><input type=checkbox id=u checked> 大写</label><label><input type=checkbox id=l checked> 小写</label><label><input type=checkbox id=d checked> 数字</label><label><input type=checkbox id=s checked> 符号</label><label><input type=checkbox id=x> 排除易混字符 (0O1lI)</label></div><p id=st></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="password");r.unshift("password");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const g0=()=>{let c=(u.checked?"ABCDEFGHIJKLMNOPQRSTUVWXYZ":"")+(l.checked?"abcdefghijklmnopqrstuvwxyz":"")+(d.checked?"0123456789":"")+(s.checked?"!@#$%^&*-_=+?":"");if(x.checked)c=c.replace(/[0O1lI]/g,"");if(!c)return o.textContent="请至少选一种";
const r=crypto.getRandomValues(new Uint32Array(+L.value));o.textContent=[...r].map(v=>c[v%c.length]).join("");const bits=L.value*Math.log2(c.length);st.innerHTML=`强度：<b style="color:${bits>80?"#4a9a5a":bits>50?"#c09a2a":"#c05a4a"}">${bits>80?"很强":bits>50?"中等":"偏弱"}</b>（约 ${bits|0} 位熵）`};
L.oninput=()=>{lv.textContent=L.value;g0()};[u,l,d,s,x].forEach(e=>e.onchange=g0);g.onclick=g0;cp.onclick=()=>navigator.clipboard.writeText(o.textContent);g0()</script></html>
