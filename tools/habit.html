<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>习惯打卡 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>习惯打卡</h1></header><main><div class=panel><div class=row><input id=hn placeholder="新习惯，如：读经 / 运动 / 早睡" style="flex:1"><select id=he><option>📖</option><option>🙏</option><option>🏃</option><option>💧</option><option>😴</option><option>🥗</option><option>📝</option><option>🎸</option></select><button id=ad>添加</button></div></div><div id=ls></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="habit");r.unshift("habit");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let H=JSON.parse(localStorage.habits||'[{"n":"读经","e":"📖","d":{}},{"n":"祷告","e":"🙏","d":{}},{"n":"运动","e":"🏃","d":{}}]');const k=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),TD=k(new Date());
const stk=h=>{let c=0,d=new Date();if(!h.d[k(d)])d.setDate(d.getDate()-1);while(h.d[k(d)]){c++;d.setDate(d.getDate()-1)}return c};
const rd=()=>{localStorage.habits=JSON.stringify(H);ls.innerHTML=H.map((h,i)=>{const days=Array.from({length:84},(_,j)=>{const d=new Date();d.setDate(d.getDate()-83+j);return k(d)}),n30=days.slice(-30).filter(d=>h.d[d]).length;
return`<div class=panel><div class=row><span style="font-size:30px">${h.e}</span><b style="flex:1;font-size:19px">${h.n}</b><span>🔥 <b>${stk(h)}</b> 天</span><span style="color:#a99">近30天 ${n30}/30</span><button style="min-width:110px;${h.d[TD]?"background:#8fae9a":""}" onclick="tg(${i},'${TD}')">${h.d[TD]?"✓ 今天已完成":"打卡"}</button><button class=alt onclick="confirm('删除这个习惯？')&&(H.splice(${i},1),rd())">✕</button></div>
<div style="display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;margin-top:10px;overflow-x:auto">${days.map(d=>`<div title="${d}" onclick="tg(${i},'${d}')" style="width:14px;height:14px;border-radius:3px;cursor:pointer;background:${h.d[d]?"#6aa57f":"#eee4da"};${d==TD?"outline:2px solid #d9a47c":""}"></div>`).join("")}</div></div>`}).join("")};
window.tg=(i,d)=>{H[i].d[d]?delete H[i].d[d]:H[i].d[d]=1;rd()};ad.onclick=()=>{if(hn.value.trim()){H.push({n:hn.value.trim(),e:he.value,d:{}});hn.value="";rd()}};rd();window.__H=()=>H</script></html>
