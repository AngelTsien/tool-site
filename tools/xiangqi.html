x.font="bold 26px 'Kaiti SC','STKaiti',serif";x.fillStyle="#7a5530";x.textAlign="center";x.fillText(fl.checked?"漢 界　　　　楚 河":"楚 河　　　　漢 界",270,O+4.5*Z+9);
