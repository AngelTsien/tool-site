<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AA 分账 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>AA 分账</h1></header><main><div class=panel><label>参与的人（逗号分隔）</label><input id=pp value="小明,小红,小华,小李" style="width:100%"><h3>支出记录</h3><div id=ex></div><p><button class=alt id=ad>+ 添加一笔</button></p></div><div class=panel><h3>结算</h3><div class=stat id=bl></div><h3>💸 转账方案（最少笔数）</h3><div id=tr style="font-size:18px;line-height:2"></div><button class=alt id=cp>复制结算</button></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="split");r.unshift("split");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let E=[["小明","晚餐",480,""],["小红","打车",60,""],["小华","饮料",36,"小华,小李"]];const P=()=>pp.value.split(/[,，、\s]+/).filter(Boolean);
const ed=()=>{const ps=P();ex.innerHTML=E.map((e,j)=>`<div class=row style="margin:6px 0;padding:8px;background:#f7f3ee;border-radius:10px"><select onchange="E[${j}][0]=this.value;rd()">${ps.map(p=>`<option ${p==e[0]?"selected":""}>${p}</option>`).join("")}</select>付了<input value="${e[1]}" oninput="E[${j}][1]=this.value" style="width:90px"><input type=number value="${e[2]}" oninput="E[${j}][2]=+this.value;rd()" style="width:90px">元<input value="${e[3]}" placeholder="分摊人（空=全部）" oninput="E[${j}][3]=this.value;rd()" style="flex:1"><button class=alt onclick="E.splice(${j},1);ed()">✕</button></div>`).join("");rd()};
const rd=()=>{const ps=P(),B=Object.fromEntries(ps.map(p=>[p,0]));E.forEach(([p,_,a,sh])=>{const who=(sh?sh.split(/[,，、\s]+/).filter(x=>x in B):ps);if(!who.length||!(p in B))return;B[p]+=a;who.forEach(w=>B[w]-=a/who.length)});
bl.innerHTML=ps.map(p=>`<div><b style="color:${B[p]>=0?"#4a9a5a":"#c05a4a"}">${B[p]>=0?"+":""}${B[p].toFixed(2)}</b>${p}</div>`).join("");const cr=ps.filter(p=>B[p]>.005).map(p=>[p,B[p]]),db=ps.filter(p=>B[p]<-.005).map(p=>[p,-B[p]]),T=[];
cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);let i=0,j=0;while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);T.push(`${db[i][0]} → ${cr[j][0]}：<b>¥${x.toFixed(2)}</b>`);db[i][1]-=x;cr[j][1]-=x;if(db[i][1]<.005)i++;if(cr[j][1]<.005)j++}
tr.innerHTML=T.join("<br>")||"已结清 🎉";window.__T=T};pp.onchange=ed;ad.onclick=()=>{E.push([P()[0],"",0,""]);ed()};cp.onclick=()=>navigator.clipboard.writeText(tr.innerText);ed()</script></html>
