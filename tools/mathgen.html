<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口算题生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>口算题生成</h1></header><main><div class=panel><div class=row><label><input type=checkbox class=op value="+" checked> 加</label><label><input type=checkbox class=op value="-" checked> 减</label><label><input type=checkbox class=op value="×"> 乘</label><label><input type=checkbox class=op value="÷"> 除</label><label>范围 ≤</label><input id=mx type=number value=20 style="width:70px"><label>题数</label><input id=n type=number value=40 style="width:70px"><label>列数</label><select id=co><option>2</option><option selected>3</option><option>4</option></select></div>
<div class=row style="margin-top:6px"><label><input type=checkbox id=nn checked> 结果不为负</label><label><input type=checkbox id=cr> 不进位/不退位</label><label><input type=checkbox id=bl> 填空题（□ 在中间）</label><button id=go>🔄 重新生成</button><button class=alt id=sa>显示/隐藏答案</button><button class=alt onclick="print()">🖨 打印</button><button class=alt id=on>✏️ 在线做题</button></div></div>
<div id=sheet style="background:#fff;padding:24px;border-radius:12px;max-width:820px;margin:auto"></div><style>@media print{header,footer,.panel{display:none!important}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="mathgen");r.unshift("mathgen");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let Q=[],showA=false,online=false;const R=n=>Math.floor(Math.random()*(n+1));const gen=()=>{const ops=[...document.querySelectorAll(".op:checked")].map(x=>x.value);if(!ops.length)return;const M=Math.max(2,+mx.value);Q=[];let g=0;
while(Q.length<+n.value&&g++<9999){const o=ops[Math.random()*ops.length|0];let a,b,r;if(o=="+"){a=R(M);b=R(M-a);r=a+b;if(cr.checked&&(a%10+b%10>=10))continue}else if(o=="-"){a=R(M);b=R(nn.checked?a:M);r=a-b;if(cr.checked&&a%10<b%10)continue}else if(o=="×"){const L=Math.min(9,M);a=1+R(L-1);b=1+R(L-1);r=a*b}else{const L=Math.min(9,M);b=1+R(L-1);r=1+R(L-1);a=b*r}
const k=a+o+b;if(Q.some(q=>q.k==k)&&Q.length<M*2)continue;Q.push({a,o,b,r,k,blank:bl.checked&&Math.random()<.5})}rd()};
const rd=()=>{sheet.innerHTML=`<h2 style="text-align:center;margin:0">口算练习</h2><p style="text-align:center;color:#888">姓名：______　用时：______　对了 ____ 题</p><div style="display:grid;grid-template-columns:repeat(${co.value},1fr);gap:14px 20px;font-size:22px;font-family:ui-monospace,monospace;margin-top:16px">${Q.map((q,i)=>{const ans=q.blank?q.b:q.r,box=online?`<input data-i=${i} type=number style="width:70px;font-size:20px;padding:2px 6px">`:showA?`<b style="color:#c05a4a">${ans}</b>`:"____";
return`<div><span style="color:#aaa;font-size:14px">${i+1}.</span> ${q.blank?`${q.a} ${q.o} ${box} = ${q.r}`:`${q.a} ${q.o} ${q.b} = ${box}`}</div>`}).join("")}</div>${online?'<p style="text-align:center"><button id=ck>交卷批改</button></p><p id=res style="text-align:center;font-size:22px"></p>':""}`;
if(online)ck.onclick=()=>{let ok=0;sheet.querySelectorAll("input[data-i]").forEach(x=>{const q=Q[x.dataset.i],g=+x.value===(q.blank?q.b:q.r)&&x.value!=="";ok+=g;x.style.background=g?"#d7ebdc":"#f5c0b8"});res.textContent=`${ok}/${Q.length} 正确`+(ok==Q.length?" 🎉 满分！":"")}};
go.onclick=gen;sa.onclick=()=>{showA=!showA;online=false;rd()};on.onclick=()=>{online=!online;rd()};document.querySelectorAll(".panel input,.panel select").forEach(e=>e.onchange=gen);gen();window.__Q=()=>Q</script></html>
