<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白噪音 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>白噪音</h1></header><main><div class=panel><p style="color:#7a706a">点任意声音开始，可同时开多个混合。</p><div class=grid id=g></div></div><div class=panel><div class=row><label>定时关闭</label><select id=tm><option value=0>不定时</option><option value=15>15 分钟</option><option value=30>30 分钟</option><option value=60>60 分钟</option></select><button class=alt id=st>⏹ 全部停止</button><span id=left style="color:#a99"></span></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="noise");r.unshift("noise");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let A;const S=[["白噪音","⚪","white"],["粉噪音","🌸","pink"],["棕噪音","🟤","brown"],["雨声","🌧️","rain"],["海浪","🌊","wave"],["风声","🍃","wind"]],P={};
const buf=(t)=>{const n=A.sampleRate*4,b=A.createBuffer(2,n,A.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let l=0,b0=0,b1=0,b2=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(t=="white")d[i]=w*.3;else if(t=="pink"||t=="rain"){b0=.997*b0+w*.029;b1=.985*b1+w*.032;b2=.95*b2+w*.048;d[i]=(b0+b1+b2+w*.02)*.9}else{l=(l+.02*w)/1.02;d[i]=l*3}}}return b};
const start=(k)=>{const t=S[k][2],src=A.createBufferSource();src.buffer=buf(t);src.loop=true;const g=A.createGain();g.gain.value=+document.getElementById("v"+k).value;let node=src;
if(t=="rain"){const f=A.createBiquadFilter();f.type="highpass";f.frequency.value=800;node.connect(f);node=f}if(t=="wind"){const f=A.createBiquadFilter();f.type="bandpass";f.frequency.value=400;f.Q.value=.8;const o=A.createOscillator(),og=A.createGain();o.frequency.value=.15;og.gain.value=250;o.connect(og).connect(f.frequency);o.start();node.connect(f);node=f}
if(t=="wave"){const m=A.createGain(),o=A.createOscillator(),og=A.createGain();o.frequency.value=.12;og.gain.value=.5;m.gain.value=.5;o.connect(og).connect(m.gain);o.start();node.connect(m);node=m}node.connect(g).connect(A.destination);src.start();P[k]={src,g}};
S.forEach(([n,i],k)=>g.insertAdjacentHTML("beforeend",`<div class=card id=c${k} style="text-align:center;cursor:pointer"><div class=ic>${i}</div><h3>${n}</h3><input type=range id=v${k} min=0 max=1 step=.05 value=.5 onclick="event.stopPropagation()" oninput="P[${k}]&&(P[${k}].g.gain.value=this.value)"></div>`));
S.forEach((_,k)=>document.getElementById("c"+k).onclick=()=>{A=A||new AudioContext();const c=document.getElementById("c"+k);if(P[k]){P[k].src.stop();delete P[k];c.style.outline=""}else{start(k);c.style.outline="3px solid #8fae9a"}});
const stopAll=()=>Object.keys(P).forEach(k=>document.getElementById("c"+k).click());st.onclick=stopAll;let end=0;tm.onchange=()=>end=+tm.value?Date.now()+tm.value*6e4:0;setInterval(()=>{if(!end)return left.textContent="";const s=(end-Date.now())/1000|0;left.textContent=`剩余 ${s/60|0}:${String(s%60).padStart(2,"0")}`;if(s<=0){stopAll();end=0;tm.value=0}},1000)</script></html>
