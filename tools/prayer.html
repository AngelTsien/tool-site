<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>祷告事项本 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>祷告事项本</h1></header><main><div class=panel><div class=row><input id=t placeholder="代祷事项" style="flex:1"><input id=w placeholder="为谁（可选）" style="width:130px"><select id=c><option>家人</option><option>教会</option><option>朋友</option><option>工作</option><option>自己</option><option>宣教</option></select><button id=ad>添加</button></div></div>
<div class=row style="margin-bottom:10px"><button class=alt data-f=0>🙏 代祷中</button><button class=alt data-f=1>🌟 蒙应允</button><select id=fc><option value="">全部分类</option></select><button class=alt id=ex>导出文本</button></div><div id=ls></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="prayer");r.unshift("prayer");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.prayer||"[]"),F=0;["家人","教会","朋友","工作","自己","宣教"].forEach(x=>fc.add(new Option(x)));const td=()=>new Date().toISOString().slice(0,10);
const rd=()=>{localStorage.prayer=JSON.stringify(L);ls.innerHTML=L.map((x,i)=>[x,i]).filter(([x])=>!!x.a==!!F&&(!fc.value||x.c==fc.value)).map(([x,i])=>`<div class=panel style="border-left:5px solid ${x.a?"#e8c26a":"#c48fa8"}"><div class=row><b style="flex:1">${x.t}</b><span class=tag>${x.c}</span></div><p style="color:#7a706a;margin:4px 0">${x.w?"为 "+x.w+" · ":""}${x.d} 开始 · 已代祷 ${x.n} 次${x.a?" · "+x.ad+" 蒙应允":""}</p>${x.a?`<p>✨ ${x.a}</p>`:""}
<div class=row>${x.a?"":`<button class=alt onclick="L[${i}].n++;rd()">🙏 今天为此祷告</button><button class=alt onclick="const a=prompt('写下神如何应允：');if(a){L[${i}].a=a;L[${i}].ad=td();rd()}">🌟 蒙应允</button>`}<button class=alt onclick="confirm('删除？')&&(L.splice(${i},1),rd())">删除</button></div></div>`).join("")||"<p style='color:#a99;text-align:center'>这里还没有事项</p>"};
ad.onclick=()=>{if(!t.value.trim())return;L.unshift({t:t.value.trim(),w:w.value,c:c.value,d:td(),n:0});t.value=w.value="";rd()};document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F=+b.dataset.f;rd()});fc.onchange=rd;
ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.map(x=>`【${x.c}】${x.t}${x.w?"（"+x.w+"）":""} ${x.d}${x.a?"\n  ✨ 蒙应允 "+x.ad+"："+x.a:""}`).join("\n")]));a.download="祷告事项.txt";a.click()};rd()</script></html>
