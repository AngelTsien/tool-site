const st=()=>{localStorage.bprog=JSON.stringify(R);let o=0,n=0;B.forEach(([b,c],i)=>{const k=(R[b]||[]).length;i<39?o+=k:n+=k});pc.textContent=((o+n)/1189*100).toFixed(1)+"%";ot.textContent=(o/929*100).toFixed(1)+"%";nt.textContent=(n/260*100).toFixed(1)+"%";ch.textContent=o+n;bar.style.width=(o+n)/1189*100+"%"};
const rd=()=>{ls.innerHTML=B.map(([b,c],i)=>{const r=R[b]||[],done=r.length==c;if(q.value&&!b.includes(q.value)||hid.checked&&done)return"";return`${i==0?"<h3>旧约</h3>":i==39?"<h3>新约</h3>":""}<details style="margin:6px 0;padding:8px 12px;background:${done?"#e3f0e6":"#faf6f1"};border-radius:10px"><summary style="cursor:pointer"><b>${b}</b> <span style="color:#a99">${r.length}/${c}</span>${done?" ✅":""}</summary>
<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">${Array.from({length:c},(_,k)=>`<span data-b="${b}" data-c="${k+1}" style="width:34px;padding:5px 0;text-align:center;border-radius:6px;cursor:pointer;font-size:13px;background:${r.includes(k+1)?"#8fae9a;color:#fff":"#eee4da"}">${k+1}</span>`).join("")}<button class=alt style="padding:3px 8px;font-size:13px" data-all="${b}">${done?"全部取消":"全部读完"}</button></div></details>`}).join("");st()};
ls.onclick=e=>{const t=e.target;if(t.dataset.c){const b=t.dataset.b,c=+t.dataset.c,r=R[b]=R[b]||[];const i=r.indexOf(c);i<0?r.push(c):r.splice(i,1);t.style.background=i<0?"#8fae9a":"#eee4da";t.style.color=i<0?"#fff":"";t.closest("details").querySelector("summary span").textContent=`${r.length}/${B.find(x=>x[0]==b)[1]}`;st()}
if(t.dataset.all){const b=t.dataset.all,c=B.find(x=>x[0]==b)[1];R[b]=(R[b]||[]).length==c?[]:Array.from({length:c},(_,k)=>k+1);rd();ls.querySelector(`[data-all="${b}"]`)?.closest("details")?.setAttribute("open","")}};q.oninput=hid.onchange=rd;rs.onclick=()=>{if(confirm("清空所有进度？")){R={};rd()}};rd()</script></html>
