<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经文卡片 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>经文卡片</h1></header><main><div class=panel><label>经文</label><textarea id=v>神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。</textarea>
<label>出处</label><input id=r value="约翰福音 3:16"><label>背景</label><div class=row id=bgs></div>
<label>尺寸</label><select id=sz><option value="1080x1080">方形 1080×1080</option><option value="1080x1920">手机竖屏 1080×1920</option><option value="1920x1080">横屏 1920×1080</option></select>
<p><button id=dl>下载 PNG</button></p></div><div class=panel><canvas id=c></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="verse");r.unshift("verse");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const BG=[["晨光",["#fbe3c8","#f6c9b4"],"#5a3e2e"],["薄荷",["#dff0e3","#b9dcc8"],"#2f4a3a"],["天空",["#dbe8f6","#b8cfe8"],"#2c3e57"],["薰衣草",["#ece2f4","#d2c2e6"],"#463a5a"],["米纸",["#f7f1e6","#e9dcc6"],"#4a3d2e"],["暮色",["#3d4a6b","#7a6a8f"],"#fbf6ee"]];let bi=0;
BG.forEach((b,i)=>{const e=document.createElement("button");e.textContent=b[0];e.style.background=`linear-gradient(135deg,${b[1][0]},${b[1][1]})`;e.style.color=b[2];e.onclick=()=>{bi=i;draw()};bgs.appendChild(e)});
function wrap(x,t,w){const L=[];let l="";for(const ch of t){if(x.measureText(l+ch).width>w&&l){L.push(l);l=ch}else l+=ch}if(l)L.push(l);return L}
function draw(){const[W,H]=sz.value.split("x").map(Number);c.width=W;c.height=H;const x=c.getContext("2d"),b=BG[bi];const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,b[1][0]);g.addColorStop(1,b[1][1]);x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<6;i++){x.fillStyle="rgba(255,255,255,.12)";x.beginPath();x.arc(W*((i*37)%100)/100,H*((i*53)%100)/100,Math.min(W,H)*(.1+.05*i),0,7);x.fill()}
const fs=Math.round(Math.min(W,H)/(v.value.length>60?17:14));x.font=`${fs}px "Songti SC","Noto Serif CJK SC",serif`;x.fillStyle=b[2];x.textAlign="center";const L=wrap(x,v.value,W*.78),lh=fs*1.6,t0=H/2-L.length*lh/2;
L.forEach((l,i)=>x.fillText(l,W/2,t0+i*lh+fs));x.font=`${Math.round(fs*.7)}px "Noto Sans CJK SC",sans-serif`;x.globalAlpha=.8;x.fillText("— "+r.value,W/2,t0+L.length*lh+fs*1.8);x.globalAlpha=1}
[v,r,sz].forEach(e=>e.oninput=draw);draw();dl.onclick=()=>{const a=document.createElement("a");a.download="经文卡片.png";a.href=c.toDataURL();a.click()}</script></html>
