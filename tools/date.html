<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日期计算/农历 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>日期计算/农历</h1></header><main><div class=panel><h3>📏 两个日期相差</h3><div class=row><input type=date id=a><span>到</span><input type=date id=b></div><p id=r1 style="font-size:20px;color:#b98a62"></p></div>
<div class=panel><h3>➕ 日期加减</h3><div class=row><input type=date id=c><span>加</span><input id=n type=number value=100 style="width:100px"><span>天</span></div><p id=r2 style="font-size:20px;color:#b98a62"></p></div>
<div class=panel><h3>🌙 公历 ⇄ 农历</h3><div class=row><input type=date id=s></div><p id=r3 style="line-height:1.8"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/lunar.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="date");r.unshift("date");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const T=new Date(),iso=d=>d.toISOString().slice(0,10);a.value=c.value=s.value=iso(T);b.value=T.getFullYear()+"-12-25";const W="日一二三四五六";
const f=()=>{const d=Math.round((new Date(b.value)-new Date(a.value))/864e5);r1.textContent=`相差 ${d} 天（约 ${(d/7).toFixed(1)} 周）`;const e=new Date(c.value);e.setDate(e.getDate()+ +n.value);r2.textContent=`${iso(e)}  星期${W[e.getDay()]}`;
const [y,m,dd]=s.value.split("-").map(Number),L=Solar.fromYmd(y,m,dd).getLunar();r3.innerHTML=`农历：<b>${L.getYearInGanZhi()}（${L.getYearShengXiao()}）年 ${L.getMonthInChinese()}月${L.getDayInChinese()}</b><br>星期${W[new Date(s.value).getDay()]}　${L.getJieQi()||""}　${(Solar.fromYmd(y,m,dd).getFestivals().concat(L.getFestivals())).join(" ")}`};
[a,b,c,n,s].forEach(e=>e.oninput=f);f()</script></html>
