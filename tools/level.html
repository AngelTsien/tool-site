<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水平仪/尺子 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>水平仪/尺子</h1></header><main><div class=row style="justify-content:center;margin-bottom:10px"><button id=t1>📐 水平仪</button><button class=alt id=t2>📏 屏幕尺子</button></div>
<div id=A class=panel style="text-align:center"><div id=bub style="position:relative;width:min(80vw,300px);aspect-ratio:1;margin:auto;border-radius:50%;background:radial-gradient(circle,#e7f3ea 0 12%,#c9e3cf 12.5% 13%,#f3f8f0 13.5%);border:3px solid #8fae9a"><div id=b style="position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9fd09f);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 2px 6px #0003;transition:left .1s,top .1s"></div></div>
<div id=ang style="font-size:32px;font-weight:700;margin-top:12px">0.0° / 0.0°</div><p id=lm style="color:#7a706a">把手机平放在物体上</p><button id=perm>启用传感器</button><button class=alt id=cal>校准为 0</button></div>
<div id=Bx class=panel style="display:none"><div class=row><label>屏幕校准：把一张银行卡（85.6mm）放在下方横条上，调整到一样长</label><input type=range id=cb min=200 max=600 value=323 style="flex:1"></div><div id=card style="height:40px;background:linear-gradient(135deg,#d9a47c,#c48fa8);border-radius:6px;margin:8px 0"></div><canvas id=rl height=120 style="width:100%;background:#fffbe8;border-radius:8px"></canvas><p style="color:#a99;font-size:13px">校准值会保存，下次直接用</p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="level");r.unshift("level");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>t1.onclick=()=>{A.style.display="";Bx.style.display="none";t1.className="";t2.className="alt"};t2.onclick=()=>{A.style.display="none";Bx.style.display="";t2.className="";t1.className="alt";ruler()};let off=[0,0];
const upd=(bt,gm)=>{bt-=off[0];gm-=off[1];const cl=v=>Math.max(-45,Math.min(45,v));b.style.left=50+cl(gm)/45*45+"%";b.style.top=50+cl(bt)/45*45+"%";ang.textContent=`${bt.toFixed(1)}° / ${gm.toFixed(1)}°`;const ok=Math.abs(bt)<1&&Math.abs(gm)<1;ang.style.color=ok?"#4a9a5a":"#3a3330";lm.textContent=ok?"✅ 水平！":"左右 "+gm.toFixed(1)+"°，前后 "+bt.toFixed(1)+"°"};
let last=[0,0];const on=e=>{if(e.beta==null)return;last=[e.beta,e.gamma];upd(e.beta,e.gamma)};perm.onclick=async()=>{try{if(window.DeviceOrientationEvent?.requestPermission)await DeviceOrientationEvent.requestPermission();addEventListener("deviceorientation",on);lm.textContent="已启用，倾斜手机看看"}catch(e){lm.textContent="无法使用传感器："+e.message}};
if(!window.DeviceOrientationEvent||!("ontouchstart" in window))lm.textContent="此设备可能没有方向传感器（请用手机打开）";cal.onclick=()=>{off=[...last];upd(...last)};addEventListener("deviceorientation",on);
cb.value=localStorage.pxcard||323;const ruler=()=>{card.style.width=cb.value+"px";localStorage.pxcard=cb.value;const pmm=cb.value/85.6,dp=devicePixelRatio,W=rl.clientWidth;rl.width=W*dp;rl.height=120*dp;const x=rl.getContext("2d");x.scale(dp,dp);x.fillStyle="#3a3330";x.font="12px sans-serif";
for(let mm=0;mm*pmm<W;mm++){const X=mm*pmm+.5,h=mm%10==0?40:mm%5==0?26:14;x.fillRect(X,0,1,h);if(mm%10==0)x.fillText(mm/10+"",X+2,54)}x.fillText("cm",W-24,54);const ipx=pmm*25.4;for(let i=0;i*ipx/8<W;i++){const X=i*ipx/8+.5,h=i%8==0?36:i%4==0?24:12;x.fillRect(X,120-h,1,h);if(i%8==0)x.fillText(i/8+"",X+2,120-40)}x.fillText("inch",W-30,78)};cb.oninput=ruler;window.__upd=upd</script></html>
