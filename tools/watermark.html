<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片加水印 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>图片加水印</h1></header><main><div class=panel><input type=file id=f accept="image/*"><div class=row><div><label>水印文字</label><input id=w value="© 恩典教会"></div><div><label>透明度</label><input type=range id=op min=5 max=100 value=35></div><div><label>大小</label><input type=range id=sz min=2 max=12 value=5></div>
<div><label>方式</label><select id=md><option value=tile>平铺</option><option value=br>右下角</option><option value=c>居中</option></select></div><div><label>颜色</label><input type=color id=co value="#ffffff"></div></div><p><button id=dl>下载</button></p></div><div class=panel><canvas id=c></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="watermark");r.unshift("watermark");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let im=new Image();const sample=()=>{const s=document.createElement("canvas");s.width=900;s.height=600;const x=s.getContext("2d"),g=x.createLinearGradient(0,0,900,600);g.addColorStop(0,"#8fae9a");g.addColorStop(1,"#d9a47c");x.fillStyle=g;x.fillRect(0,0,900,600);im.src=s.toDataURL()};
function d(){if(!im.width)return;c.width=im.width;c.height=im.height;const x=c.getContext("2d");x.drawImage(im,0,0);const fs=Math.max(c.width,c.height)*sz.value/100;x.font=`bold ${fs}px sans-serif`;x.fillStyle=co.value;x.globalAlpha=op.value/100;x.shadowColor="#0006";x.shadowBlur=4;
if(md.value=="tile"){x.save();x.rotate(-Math.PI/7);const tw=x.measureText(w.value).width+fs*2;for(let yy=-c.height;yy<c.height*2;yy+=fs*3)for(let xx=-c.width;xx<c.width*2;xx+=tw)x.fillText(w.value,xx,yy);x.restore()}
else{x.textAlign=md.value=="c"?"center":"right";x.fillText(w.value,md.value=="c"?c.width/2:c.width-fs/2,md.value=="c"?c.height/2:c.height-fs/2)}x.globalAlpha=1}
im.onload=d;f.onchange=()=>im.src=URL.createObjectURL(f.files[0]);[w,op,sz,md,co].forEach(e=>e.oninput=d);dl.onclick=()=>{const a=document.createElement("a");a.download="水印图片.png";a.href=c.toDataURL();a.click()};sample()</script></html>
