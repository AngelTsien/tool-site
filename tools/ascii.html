<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片转字符画 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>图片转字符画</h1></header><main><div class=panel><input type=file id=f accept="image/*"><div class=row><label>宽度（字符）</label><input type=range id=w min=30 max=160 value=80><span id=wv>80</span><select id=cs><option value=" .:-=+*#%@">经典</option><option value=" ░▒▓█">方块</option><option value=" .oO@">简单</option><option value=" 一二三丰王国圣">汉字</option></select><label><input type=checkbox id=inv> 反色</label><label><input type=checkbox id=cl> 彩色</label></div>
<div class=row style="margin-top:8px"><button id=cp>复制文本</button><button class=alt id=dt>下载 TXT</button><button class=alt id=dp>下载图片</button></div></div><div class=panel style="overflow:auto;background:#fff"><pre id=o style="font-family:ui-monospace,Menlo,monospace;line-height:1;font-size:8px;margin:0;letter-spacing:0"></pre></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="ascii");r.unshift("ascii");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let im=new Image(),txt="",cols=[];const sm=()=>{const c=document.createElement("canvas");c.width=c.height=300;const x=c.getContext("2d"),g=x.createRadialGradient(150,120,10,150,150,170);g.addColorStop(0,"#fff");g.addColorStop(1,"#333");x.fillStyle=g;x.fillRect(0,0,300,300);x.fillStyle="#000";x.font="bold 200px serif";x.textAlign="center";x.fillText("✝",150,230);im.src=c.toDataURL()};
const d=()=>{wv.textContent=w.value;const W=+w.value,zh=cs.value.includes("一"),H=Math.round(im.height/im.width*W*(zh?1:.5)),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(im,0,0,W,H);const D=x.getImageData(0,0,W,H).data,ch=[...cs.value];let out="",html="";cols=[];
for(let j=0;j<H;j++){for(let i=0;i<W;i++){const k=(j*W+i)*4,l=(.299*D[k]+.587*D[k+1]+.114*D[k+2])/255*(D[k+3]/255)+(1-D[k+3]/255),v=inv.checked?l:1-l,s=ch[Math.min(ch.length-1,Math.floor(v*ch.length))];out+=s;if(cl.checked)html+=`<span style="color:rgb(${D[k]},${D[k+1]},${D[k+2]})">${s==" "?"&nbsp;":s}</span>`}out+="\n";if(cl.checked)html+="\n"}
txt=out;o.style.fontSize=(zh?Math.max(4,640/W):Math.max(4,1100/W/0.6/2))+"px";o.style.letterSpacing=zh?"0":"0";cl.checked?o.innerHTML=html:o.textContent=out};im.onload=d;f.onchange=()=>im.src=URL.createObjectURL(f.files[0]);[w,cs,inv,cl].forEach(e=>e.oninput=d);
cp.onclick=()=>navigator.clipboard.writeText(txt);dt.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt]));a.download="字符画.txt";a.click()};
dp.onclick=()=>{const L=txt.split("\n"),fs=12,cw=fs*(cs.value.includes("一")?1:.6),c=document.createElement("canvas");c.width=Math.ceil(L[0].length*cw)+20;c.height=L.length*fs+20;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";x.font=fs+"px monospace";x.textBaseline="top";L.forEach((l,i)=>[...l].forEach((s,j)=>x.fillText(s,10+j*cw,10+i*fs)));const a=document.createElement("a");a.download="字符画.png";a.href=c.toDataURL();a.click()};sm();window.__t=()=>txt</script></html>
