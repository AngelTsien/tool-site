<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码名片 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>二维码名片</h1></header><main><div class=panel><div class=row><input id=n placeholder="姓名" style="flex:1"><input id=o placeholder="单位/教会" style="flex:1"></div><div class=row style="margin-top:8px"><input id=ti placeholder="职位/事工" style="flex:1"><input id=p placeholder="电话" style="flex:1"></div>
<div class=row style="margin-top:8px"><input id=m placeholder="邮箱" style="flex:1"><input id=u placeholder="网址/微信号" style="flex:1"></div><input id=ad placeholder="地址" style="width:100%;margin-top:8px">
<div class=row style="margin-top:10px"><select id=th><option value=0>☁️ 简约白</option><option value=1>🌿 森林绿</option><option value=2>🌙 深夜蓝</option><option value=3>🍂 暖棕</option></select><button id=dl>💾 下载名片 PNG</button><button class=alt id=vf>📇 下载 .vcf</button></div>
<p style="color:#7a706a;font-size:13px">对方用手机相机扫码即可直接“添加到通讯录”。</p></div><div class=panel style="text-align:center"><canvas id=cv width=1050 height=600 style="width:100%;max-width:525px;box-shadow:0 4px 16px #0002"></canvas></div><div id=qh style="display:none"></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/qrcode.js"></script><script src="../static/vendor/qrcode_UTF8.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="qrcard");r.unshift("qrcard");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const F=["n","o","ti","p","m","u","ad"],S=JSON.parse(localStorage.qrcard||"{}");F.forEach(i=>{const e=document.getElementById(i);e.value=S[i]||"";e.oninput=go});th.value=S.th||0;th.onchange=go;const TH=[["#ffffff","#3a3330","#b98a62"],["#2f5d50","#fff","#cfe8c9"],["#1e2a44","#fff","#8fb3ff"],["#f3e6d6","#4a3428","#a0623a"]];
const vc=()=>["BEGIN:VCARD","VERSION:3.0","N:"+n.value+";;;;","FN:"+n.value,o.value&&"ORG:"+o.value,ti.value&&"TITLE:"+ti.value,p.value&&"TEL;TYPE=CELL:"+p.value,m.value&&"EMAIL:"+m.value,u.value&&"URL:"+u.value,ad.value&&"ADR:;;"+ad.value+";;;;","END:VCARD"].filter(Boolean).join("\n");
function go(){const s={th:th.value};F.forEach(i=>s[i]=document.getElementById(i).value);localStorage.qrcard=JSON.stringify(s);const[bg,fg,ac]=TH[th.value],x=cv.getContext("2d");x.fillStyle=bg;x.fillRect(0,0,1050,600);x.fillStyle=ac;x.fillRect(0,0,18,600);x.globalAlpha=.12;x.beginPath();x.arc(980,40,200,0,7);x.fill();x.globalAlpha=1;
x.fillStyle=fg;x.font="bold 64px sans-serif";x.fillText(n.value||"你的名字",70,140);x.fillStyle=ac;x.font="30px sans-serif";x.fillText([ti.value,o.value].filter(Boolean).join(" · "),70,195);x.fillStyle=fg;x.font="28px sans-serif";[["📞",p.value],["✉️",m.value],["🌐",u.value],["📍",ad.value]].filter(a=>a[1]).forEach((a,i)=>x.fillText(a[0]+"  "+a[1].slice(0,26),70,300+i*58));
try{const q=qrcode(0,"M");q.addData(unescape(encodeURIComponent(vc())));q.make();const N=q.getModuleCount(),cs=Math.floor(300/N),X=1000-N*cs,Y=(600-N*cs)/2;x.fillStyle="#fff";x.fillRect(X-16,Y-16,N*cs+32,N*cs+32);x.fillStyle="#000";for(let r=0;r<N;r++)for(let c=0;c<N;c++)q.isDark(r,c)&&x.fillRect(X+c*cs,Y+r*cs,cs,cs);window.__qr=N}catch(e){console.log(e)}}
const sv=(h,f)=>{const a=document.createElement("a");a.href=h;a.download=f;a.click()};dl.onclick=()=>sv(cv.toDataURL(),"二维码名片.png");vf.onclick=()=>sv(URL.createObjectURL(new Blob([vc()],{type:"text/vcard"})),(n.value||"名片")+".vcf");go();</script></html>
