<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>颜色对比度 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>颜色对比度</h1></header><main><div class=panel><div class=row><div><label>文字颜色</label><input type=color id=fg value="#7a706a"><input id=fgt value="#7a706a" style="width:100px;font-family:monospace"></div><div><label>背景颜色</label><input type=color id=bg value="#f7f3ee"><input id=bgt value="#f7f3ee" style="width:100px;font-family:monospace"></div><button class=alt id=sw>⇄ 交换</button><button class=alt id=fx>🪄 自动调到合格</button></div></div>
<div class=panel id=pv style="border-radius:16px"><h2 style="margin:0">主日崇拜 · 欢迎光临</h2><p>耶和华是我的牧者，我必不致缺乏。小字示例 12px：<span style="font-size:12px">他使我躺卧在青草地上</span></p></div><div class="panel stat" id=rs></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="contrast");r.unshift("contrast");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]},ratio=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const f=()=>{fgt.value=fg.value;bgt.value=bg.value;pv.style.color=fg.value;pv.style.background=bg.value;const r=ratio(fg.value,bg.value),P=(n,t)=>`<div><b style="color:${r>=t?"#4a9a5a":"#c05a4a"}">${r>=t?"✓ 通过":"✗ 不通过"}</b>${n}（≥${t}）</div>`;
rs.innerHTML=`<div><b>${r.toFixed(2)} : 1</b>对比度</div>`+P("AA 正文",4.5)+P("AA 大字",3)+P("AAA 正文",7)+P("AAA 大字",4.5)};[fg,bg].forEach(e=>e.oninput=f);[[fgt,fg],[bgt,bg]].forEach(([t,c])=>t.onchange=()=>{if(/^#[0-9a-f]{6}$/i.test(t.value)){c.value=t.value;f()}});
sw.onclick=()=>{[fg.value,bg.value]=[bg.value,fg.value];f()};fx.onclick=()=>{let c=fg.value,dark=lum(bg.value)>.4;for(let k=0;k<60&&ratio(c,bg.value)<4.5;k++)c="#"+[1,3,5].map(i=>Math.max(0,Math.min(255,parseInt(c.substr(i,2),16)+(dark?-6:6))).toString(16).padStart(2,"0")).join("");fg.value=c;f()};f();window.__r=ratio</script></html>
