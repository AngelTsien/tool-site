<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kahoot 题目表 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>Kahoot 题目表</h1></header><main><div class=panel><p style="font-size:14px;color:#7a706a">每行一题：<code>题目 | 正确答案 | 错误1 | 错误2 | 错误3</code>。判断题写 <code>题目 | v</code>（对）或 <code>题目 | f</code>（错）。正确答案自动放在第 1 项；不足 4 项用“都不是”补齐。</p>
<textarea id=t style="min-height:160px">尼希米是哪位王的酒政？ | 亚达薛西 | 尼布甲尼撒 | 古列 | 大利乌
耶路撒冷城墙用了多少天修完？ | 五十二天 | 四十天 | 七十天
尼希米听见城墙拆毁就坐下哭泣 | v
参巴拉帮助尼希米修城墙 | f</textarea>
<div class=row><label>时间</label><select id=tl><option>5</option><option>10</option><option>20</option><option selected>30</option><option>60</option><option>90</option><option>120</option></select><label>判断题答案写法</label><select id=tf><option value="对,错">对 / 错</option><option value="vvvv,ffff">vvvv / ffff</option><option value="True,False">True / False</option></select></div>
<p class=row><button id=xl>下载 xlsx</button><button class=alt id=cv>下载 CSV</button></p><p id=info></p></div><div class=panel style="overflow:auto"><table id=tb style="border-collapse:collapse;font-size:13px;min-width:600px"></table></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/xlsx.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="kahoot");r.unshift("kahoot");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const H=["Question - max 120 characters","Answer 1 - max 75 characters","Answer 2 - max 75 characters","Answer 3 - max 75 characters","Answer 4 - max 75 characters","Time limit (sec) – 5, 10, 20, 30, 60, 90, 120, or 240 secs","Correct answer(s) - choose at least one"];let R=[];
const f=()=>{const [T,F]=tf.value.split(",");const warn=[];R=t.value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(a=>a[0]).map((a,i)=>{let ans,c=1;if(a.length==2&&/^[vf]$/i.test(a[1])){ans=[T,F,"",""];c=a[1].toLowerCase()=="v"?1:2}else{ans=a.slice(1,5);while(ans.length<4)ans.push("都不是")}
if(a[0].length>120)warn.push(`第${i+1}题题目超过120字`);ans.forEach(x=>x.length>75&&warn.push(`第${i+1}题答案超过75字`));return[a[0],...ans,+tl.value,c]});
tb.innerHTML="<tr>"+["#","题目","答案1","答案2","答案3","答案4","秒","正确"].map(h=>`<th style="background:#f3e6d6;padding:6px;border:1px solid #eee">${h}</th>`).join("")+"</tr>"+R.map((r,i)=>"<tr><td style='border:1px solid #eee;padding:4px'>"+[i+1,...r].join("</td><td style='border:1px solid #eee;padding:4px'>")+"</td></tr>").join("");
info.innerHTML=`共 ${R.length} 题`+(warn.length?"<br><span style=color:#c05a4a>⚠ "+warn.join("；")+"</span>":"")};[t,tl,tf].forEach(e=>e.oninput=f);f();
xl.onclick=()=>{const ws=XLSX.utils.aoa_to_sheet([[],["Quiz template"],[],[],[],[],[],["",...H],...R.map((r,i)=>[i+1,...r])]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sheet1");XLSX.writeFile(wb,"kahoot题目.xlsx")};
cv.onclick=()=>{const q=s=>`"${String(s).replace(/"/g,'""')}"`;const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+[H,...R].map(r=>r.map(q).join(",")).join("\n")]));a.download="kahoot题目.csv";a.click()}</script></html>
