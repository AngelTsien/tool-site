<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调色板/取色 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>调色板/取色</h1></header><main><div class=panel><div class=row><input type=color id=b value="#d9a47c" style="width:70px;height:46px;padding:2px"><select id=sc><option value=an>邻近色</option><option value=co>互补色</option><option value=tr>三角色</option><option value=mo>单色深浅</option></select><button class=alt id=rnd>🎲 随机</button></div><p style="font-size:13px;color:#a99">点任意色块复制色值</p><div id=pal class=row></div></div>
<div class=panel><h3>🖼️ 从图片提取颜色</h3><input type=file id=f accept="image/*"><div id=ex class=row style="margin-top:10px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="color");r.unshift("color");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const h2r=h=>{h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16))},r2h=a=>"#"+a.map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2;let h=0,s=0;if(M!=m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M==r?(g-b)/d+(g<b?6:0):M==g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2rgb(h,s,l){h=((h%360)+360)%360;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0)*255,f(8)*255,f(4)*255]}
const sw=(el,cs)=>{el.innerHTML=cs.map(c=>`<div onclick="navigator.clipboard.writeText('${c}');this.lastChild.textContent='已复制'" style="cursor:pointer;flex:1;min-width:90px;height:110px;border-radius:14px;background:${c};display:flex;align-items:flex-end;justify-content:center;padding:6px;color:#fff;text-shadow:0 1px 3px #0008;font-family:monospace"><span>${c}</span></div>`).join("")};
const f=()=>{const[h,s,l]=rgb2hsl(h2r(b.value)),D={an:[-40,-20,0,20,40].map(d=>[h+d,s,l]),co:[[h,s,l*.7],[h,s,l],[h,s,Math.min(.92,l*1.4)],[h+180,s,l],[h+180,s,l*.7]],tr:[[h,s,l],[h+120,s,l],[h+240,s,l],[h,s*.4,.92],[h,s*.5,.25]],mo:[.2,.35,.5,.68,.85].map(L=>[h,s,L])}[sc.value];sw(pal,D.map(a=>r2h(hsl2rgb(...a))))};
b.oninput=sc.onchange=f;rnd.onclick=()=>{b.value=r2h(hsl2rgb(Math.random()*360,.4+Math.random()*.4,.45+Math.random()*.2));f()};f();
f.onchange=null;document.getElementById("f").onchange=e=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=60;const x=c.getContext("2d");x.drawImage(im,0,0,60,60);const d=x.getImageData(0,0,60,60).data,B={};
for(let i=0;i<d.length;i+=4){const k=[0,1,2].map(j=>d[i+j]>>5<<5|16).join();B[k]=(B[k]||0)+1}sw(ex,Object.entries(B).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k])=>r2h(k.split(",").map(Number))))};im.src=URL.createObjectURL(e.target.files[0])}</script></html>
