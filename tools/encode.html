<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编码转换 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>编码转换</h1></header><main><div class=panel><h3>🔢 进制转换</h3><div class=grid style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"><div><label>十进制</label><input id=b10 value="2026" style="width:100%"></div><div><label>二进制</label><input id=b2 style="width:100%"></div><div><label>八进制</label><input id=b8 style="width:100%"></div><div><label>十六进制</label><input id=b16 style="width:100%"></div></div><p id=be style="color:#c05a4a"></p></div>
<div class=panel><h3>🔐 文本编码</h3><textarea id=t style="min-height:80px">你好，Grace! https://example.com/?q=恩典</textarea><div class=row id=bt style="margin-top:8px"></div><label>结果</label><textarea id=o readonly style="min-height:80px"></textarea><p id=er style="color:#c05a4a"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="encode");r.unshift("encode");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const bs={b10:10,b2:2,b8:8,b16:16},cv=src=>{be.textContent="";const s=document.getElementById(src).value.trim().replace(/^0[xbo]/i,"");if(!s){return}let v;try{v=BigInt((src=="b10"?"":{b2:"0b",b8:"0o",b16:"0x"}[src])+s)}catch(e){be.textContent="✗ 不是有效的"+{b10:"十",b2:"二",b8:"八",b16:"十六"}[src]+"进制数";return}
for(const k in bs)if(k!=src)document.getElementById(k).value=v.toString(bs[k]).toUpperCase()};for(const k in bs)document.getElementById(k).oninput=()=>cv(k);cv("b10");
const u8=s=>new TextEncoder().encode(s),O={"Base64 编码":s=>btoa(String.fromCharCode(...u8(s))),"Base64 解码":s=>new TextDecoder().decode(Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0))),"URL 编码":s=>encodeURIComponent(s),"URL 解码":s=>decodeURIComponent(s),
"Unicode \\u":s=>[...s].map(c=>c.charCodeAt(0)>127?"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"):c).join(""),"\\u 还原":s=>s.replace(/\\u([0-9a-f]{4})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))),"HTML 实体":s=>s.replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`),"UTF-8 十六进制":s=>[...u8(s)].map(b=>b.toString(16).padStart(2,"0")).join(" ")};
Object.keys(O).forEach(k=>{const b=document.createElement("button");b.className="alt";b.textContent=k;b.onclick=()=>{er.textContent="";try{o.value=O[k](t.value)}catch(e){er.textContent="✗ 无法解码："+e.message}};bt.appendChild(b)});
const sw=document.createElement("button");sw.textContent="⇅ 结果放回输入";sw.onclick=()=>t.value=o.value;bt.appendChild(sw);window.__O=O</script></html>
