<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝宝月龄/预产期 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>宝宝月龄/预产期</h1></header><main><div class=row style="justify-content:center;margin-bottom:10px"><button id=m1>🤰 预产期 / 孕周</button><button class=alt id=m2>👶 宝宝月龄</button></div>
<div id=A class=panel><label>末次月经第一天</label><input type=date id=lmp><label>月经周期（天）</label><input id=cy type=number value=28 style="width:80px"><div class="stat" id=ra style="margin-top:14px"></div><div style="height:14px;background:#eee4da;border-radius:7px;margin-top:14px;overflow:hidden"><div id=pb style="height:14px;background:linear-gradient(90deg,#f6c9b4,#c48fa8)"></div></div><div id=ms class=out style="margin-top:12px"></div></div>
<div id=Bx class=panel style="display:none"><label>宝宝生日</label><input type=date id=bd><div class="stat" id=rb style="margin-top:14px"></div><div id=nb class=out style="margin-top:12px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="baby");r.unshift("baby");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const T=new Date();T.setHours(0,0,0,0);const dd=(a,b)=>Math.round((b-a)/864e5),fm=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const l0=add(T,-70);lmp.value=new Date(l0.getTime()-l0.getTimezoneOffset()*6e4).toISOString().slice(0,10);const b0=add(T,-200);bd.value=new Date(b0.getTime()-b0.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fa=()=>{const L=new Date(lmp.value+"T00:00"),adj=(+cy.value||28)-28,due=add(L,280+adj),g=dd(L,T)-adj,w=Math.floor(g/7),dy=g%7,left=dd(T,due),tri=w<14?"孕早期":w<28?"孕中期":"孕晚期";
ra.innerHTML=`<div><b>${fm(due)}</b>预产期</div><div><b>${g>=0?w+"周+"+dy+"天":"–"}</b>当前孕周</div><div><b>${left}</b>距预产期（天）</div><div><b>${tri}</b>阶段</div>`;pb.style.width=Math.max(0,Math.min(100,g/280*100))+"%";
ms.textContent=[[12,"NT 检查 (11–13+6 周)",77],[16,"唐筛 (15–20 周)",105],[22,"大排畸 (20–24 周)",140],[26,"糖耐 (24–28 周)",168],[32,"小排畸 / 胎心监护开始",224],[37,"足月 (37 周)",259]].map(([_,n,d])=>`${fm(add(L,d+adj))}  ${n}${dd(T,add(L,d+adj))<0?"  ✓":""}`).join("\n")};
const fb=()=>{const B=new Date(bd.value+"T00:00"),days=dd(B,T);let m=(T.getFullYear()-B.getFullYear())*12+T.getMonth()-B.getMonth(),dm=T.getDate()-B.getDate();if(dm<0){m--;dm+=new Date(T.getFullYear(),T.getMonth(),0).getDate()}
rb.innerHTML=`<div><b>${m}个月${dm}天</b>月龄</div><div><b>${days}</b>出生天数</div><div><b>${Math.floor(days/7)}周</b>周龄</div><div><b>${m>=12?Math.floor(m/12)+"岁"+(m%12)+"个月":"未满周岁"}</b>年龄</div>`;
nb.textContent=[[100,"百天"],[365,"一周岁"],[730,"两周岁"],[1000,"一千天"]].map(([n,t])=>`${fm(add(B,n))}  ${t}${days>=n?"  ✓ 已过":`  还有 ${n-days} 天`}`).join("\n")+"\n\n疫苗提示：2月/3月/4月/6月/8月/12月/18月 按当地接种本为准"};
m1.onclick=()=>{A.style.display="";Bx.style.display="none";m1.className="";m2.className="alt"};m2.onclick=()=>{A.style.display="none";Bx.style.display="";m2.className="";m1.className="alt"};lmp.oninput=cy.oninput=fa;bd.oninput=fb;fa();fb()</script></html>
