<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程表/周计划 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>课程表/周计划</h1></header><main><div class=panel><div class=row><label>时间段</label><input id=sl value="8:00,9:00,10:00,11:00,14:00,15:00,16:00,19:00" style="flex:1"><label><input type=checkbox id=we checked> 含周末</label></div><div class=row style="margin-top:8px"><label>颜色</label><span id=pal class=row></span><button class=alt id=cl>清空</button><button class=alt onclick="print()">🖨 打印</button><button class=alt id=cv>导出 CSV</button></div><p style="font-size:13px;color:#a99">点格子输入内容；先选颜色再点格子上色；内容会自动保存</p></div>
<div class=panel style="overflow:auto"><table id=tb style="border-collapse:collapse;width:100%;min-width:560px;table-layout:fixed"></table></div><style>@media print{header,footer,.panel:first-child{display:none}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="schedule");r.unshift("schedule");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let D=JSON.parse(localStorage.sched||"{}"),col="";const CL=["","#f6c9b4","#b9dcc8","#d2c2e6","#b8cfe8","#f6d9a8","#f5b5a8"];sl.value=localStorage.schedsl||sl.value;we.checked=localStorage.schedwe!="0";
pal.innerHTML=CL.map((c,i)=>`<button data-c="${c}" style="width:28px;height:28px;padding:0;border-radius:50%;background:${c||"#fff"};border:2px solid ${i?"#fff":"#ccc"}">${i?"":"✕"}</button>`).join("");pal.onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;col=b.dataset.c;[...pal.children].forEach(x=>x.style.outline="");b.style.outline="3px solid #3a3330"};
const DY=()=>["周一","周二","周三","周四","周五",...(we.checked?["周六","周日"]:[])];const rd=()=>{localStorage.sched=JSON.stringify(D);localStorage.schedsl=sl.value;localStorage.schedwe=we.checked?1:0;const S=sl.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),Dd=DY();
tb.innerHTML=`<tr><th style="width:64px"></th>${Dd.map(d=>`<th style="padding:8px;background:#f3e6d6;border-radius:6px">${d}</th>`).join("")}</tr>`+S.map(s=>`<tr><td style="color:#7a706a;font-size:13px;text-align:center">${s}</td>${Dd.map(d=>{const k=d+"|"+s,v=D[k]||{};return`<td data-k="${k}" style="border:2px solid #fff;background:${v.c||"#faf6f1"};padding:0;height:46px;border-radius:8px"><input value="${(v.t||"").replace(/"/g,"&quot;")}" style="width:100%;height:46px;border:none;background:transparent;text-align:center;font-size:13px;padding:2px"></td>`}).join("")}</tr>`).join("")};
tb.oninput=e=>{const td=e.target.closest("[data-k]");if(td){D[td.dataset.k]={...(D[td.dataset.k]||{}),t:e.target.value};localStorage.sched=JSON.stringify(D)}};tb.onclick=e=>{const td=e.target.closest("[data-k]");if(td&&col!==""||td&&col===""&&pal.querySelector('[style*="outline: 3px"]')){D[td.dataset.k]={...(D[td.dataset.k]||{}),c:col};td.style.background=col||"#faf6f1";localStorage.sched=JSON.stringify(D)}};
sl.onchange=we.onchange=rd;cl.onclick=()=>{if(confirm("清空课程表？")){D={};rd()}};cv.onclick=()=>{const S=sl.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),Dd=DY();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff时间,"+Dd.join(",")+"\n"+S.map(s=>[s,...Dd.map(d=>(D[d+"|"+s]||{}).t||"")].join(",")).join("\n")]));a.download="课程表.csv";a.click()};rd();window.__D=()=>D</script></html>
