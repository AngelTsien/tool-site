<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>油费/电费计算 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>油费/电费计算</h1></header><main><div class=row style="justify-content:center;margin-bottom:10px"><button id=m1>⛽ 燃油车</button><button class=alt id=m2>🔌 电动车</button></div><div class=panel><div class=row><div><label>距离（km）</label><input id=d type=number value=350></div><div><label><span id=ul>油耗（L/100km）</span></label><input id=e type=number value=7.5 step=0.1></div><div><label><span id=pl>油价（元/L）</span></label><input id=p type=number value=7.8 step=0.01></div></div>
<div class=row style="margin-top:6px"><div><label>过路费</label><input id=t type=number value=120></div><div><label>停车等其他</label><input id=o type=number value=30></div><div><label>乘车人数</label><input id=n type=number value=4></div><label><input type=checkbox id=rt> 往返</label></div></div><div class="panel stat" id=r></div>
<div class=panel><h3>🧭 加满一箱能跑多远</h3><div class=row><label><span id=tkl>油箱（L）</span></label><input id=tk type=number value=50 style="width:80px"><span id=rg class=res style="font-size:18px;color:#b98a62"></span></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="fuel");r.unshift("fuel");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let ev=false;const sw=x=>{ev=x;m1.className=x?"alt":"";m2.className=x?"":"alt";ul.textContent=x?"电耗（kWh/100km）":"油耗（L/100km）";pl.textContent=x?"电价（元/kWh）":"油价（元/L）";tkl.textContent=x?"电池（kWh）":"油箱（L）";e.value=x?15:7.5;p.value=x?1.2:7.8;tk.value=x?75:50;f()};
const f=()=>{const D=(+d.value)*(rt.checked?2:1),U=D*e.value/100,E=U*p.value,T=E+(+t.value)*(rt.checked?2:1)+(+o.value),N=Math.max(1,+n.value);r.innerHTML=`<div><b>${D}</b>总里程 km</div><div><b>${U.toFixed(1)}</b>${ev?"耗电 kWh":"耗油 L"}</div><div><b>¥${E.toFixed(2)}</b>${ev?"电费":"油费"}</div><div><b>¥${T.toFixed(2)}</b>总费用</div><div><b>¥${(T/N).toFixed(2)}</b>每人分摊</div><div><b>¥${(p.value*e.value/100).toFixed(2)}</b>每公里能源成本×100</div>`;
rg.textContent=`约 ${(tk.value/e.value*100).toFixed(0)} km`};m1.onclick=()=>sw(false);m2.onclick=()=>sw(true);document.querySelectorAll("input").forEach(x=>x.oninput=f);f()</script></html>
