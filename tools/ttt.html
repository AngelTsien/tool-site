<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>井字棋 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>井字棋</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=md><option value=ai>挑战 AI（不会输）</option><option value=easy>简单 AI</option><option value=pvp>双人对战</option></select><label><input type=checkbox id=af> AI 先手</label><button id=ng>新局</button></div><p id=ms style="font-size:22px;min-height:30px"></p>
<div id=bd style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,320px);margin:auto"></div><p style="margin-top:14px">⭕ 胜 <b id=w1>0</b> · ❌ 胜 <b id=w2>0</b> · 平 <b id=w3>0</b></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="ttt");r.unshift("ttt");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let B,turn,over,SC=JSON.parse(localStorage.ttt||'[0,0,0]');const LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=b=>{for(const[a,c,d]of LN)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return[b[a],[a,c,d]];return b.every(Boolean)?["draw"]:null};
const mm=(b,p)=>{const w=win(b);if(w)return w[0]=="O"?{s:-10}:w[0]=="X"?{s:10}:{s:0};let best={s:p=="X"?-99:99};b.forEach((v,i)=>{if(v)return;b[i]=p;const r=mm(b,p=="X"?"O":"X");b[i]="";r.s-=Math.sign(r.s);if(p=="X"?r.s>best.s:r.s<best.s)best={s:r.s,i}});return best};
const rd=(hl=[])=>{bd.innerHTML=B.map((v,i)=>`<div onclick="pl(${i})" style="aspect-ratio:1;border-radius:16px;background:${hl.includes(i)?"#f6d9a8":"#fff"};box-shadow:0 3px 10px #0001;display:flex;align-items:center;justify-content:center;font-size:min(16vw,64px);cursor:pointer;transition:.2s">${v=="O"?"⭕":v=="X"?"❌":""}</div>`).join("");w1.textContent=SC[0];w2.textContent=SC[1];w3.textContent=SC[2]};
const chk=()=>{const w=win(B);if(!w){ms.textContent=(turn=="O"?"⭕":"❌")+" 的回合";return false}over=true;if(w[0]=="draw"){SC[2]++;ms.textContent="🤝 平局"}else{SC[w[0]=="O"?0:1]++;ms.textContent=(w[0]=="O"?"⭕":"❌")+" 获胜！"+(md.value!="pvp"?(w[0]=="O"?" 🎉 你赢了":" AI 赢了"):"")}localStorage.ttt=JSON.stringify(SC);rd(w[1]||[]);return true};
const ai=()=>{const e=B.map((v,i)=>v?-1:i).filter(i=>i>=0);const i=md.value=="easy"&&Math.random()<.6?e[Math.random()*e.length|0]:mm([...B],"X").i;B[i]="X";turn="O";rd();chk()};
window.pl=i=>{if(over||B[i])return;if(md.value!="pvp"&&turn=="X")return;B[i]=turn;turn=turn=="O"?"X":"O";rd();if(chk())return;if(md.value!="pvp")setTimeout(ai,250)};
ng.onclick=md.onchange=af.onchange=()=>{B=Array(9).fill("");turn="O";over=false;rd();chk();if(af.checked&&md.value!="pvp"){turn="X";ai()}};ng.onclick();window.__B=()=>({B,over,SC})</script></html>
