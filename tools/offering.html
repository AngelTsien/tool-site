<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奉献统计 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>奉献统计</h1></header><main><div class=panel><div class=row><input type=date id=dt><select id=ty><option>主日奉献</option><option>十一奉献</option><option>感恩奉献</option><option>宣教奉献</option><option>建堂奉献</option><option>其他</option></select><input id=nm placeholder="奉献者/编号（可匿名）" style="width:150px"><input id=am type=number placeholder="金额" style="width:100px"><select id=pm><option>现金</option><option>转账</option><option>支票</option></select><button id=ad>登记</button></div></div>
<div class=panel><div class=row><label>统计范围</label><select id=rg><option value=m>本月</option><option value=y>今年</option><option value=a>全部</option></select><select id=cu><option>€</option><option>¥</option><option>$</option></select><button class=alt id=cv>导出 CSV</button><button class=alt onclick="print()">打印</button></div><div class=stat id=sm style="margin-top:10px"></div></div>
<div class=panel><h3>按类别</h3><div id=byT></div><h3>按日期</h3><div id=byD class=out></div></div><div class=panel><h3>明细</h3><div id=ls></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="offering");r.unshift("offering");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.offr||"[]");dt.valueAsDate=new Date();const inR=d=>{const n=new Date().toISOString();return rg.value=="a"||(rg.value=="y"?d.slice(0,4)==n.slice(0,4):d.slice(0,7)==n.slice(0,7))},m=v=>cu.value+v.toFixed(2);
const rd=()=>{localStorage.offr=JSON.stringify(L);const R=L.filter(x=>inR(x.d)),T=R.reduce((s,x)=>s+x.a,0),G={},D={};R.forEach(x=>{G[x.t]=(G[x.t]||0)+x.a;D[x.d]=(D[x.d]||0)+x.a});
sm.innerHTML=`<div><b>${m(T)}</b>合计</div><div><b>${R.length}</b>笔数</div><div><b>${Object.keys(D).length}</b>聚会次数</div><div><b>${m(Object.keys(D).length?T/Object.keys(D).length:0)}</b>平均每次</div>`;
byT.innerHTML=Object.entries(G).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:6px 0">${k} <b>${m(v)}</b> <span style="color:#a99">${(v/T*100).toFixed(1)}%</span><div style="height:10px;border-radius:5px;background:linear-gradient(90deg,#d9a47c,#8fae9a);width:${v/T*100}%"></div></div>`).join("")||"<p style=color:#a99>暂无记录</p>";
byD.textContent=Object.keys(D).sort().reverse().map(d=>`${d}  ${m(D[d])}`).join("\n");ls.innerHTML=R.map(x=>`<div class=row style="padding:5px 0;border-bottom:1px solid #f0e8e0"><span style="color:#a99">${x.d}</span><span>${x.t}</span><span style="flex:1;color:#7a706a">${x.n||"匿名"} · ${x.p}</span><b>${m(x.a)}</b><button class=alt onclick="confirm('删除？')&&(L.splice(${L.indexOf(x)},1),rd())">✕</button></div>`).join("")};
ad.onclick=()=>{const a=+am.value;if(!(a>0))return;L.unshift({d:dt.value,t:ty.value,n:nm.value,a,p:pm.value});am.value=nm.value="";rd()};am.onkeydown=e=>{if(e.key=="Enter")ad.click()};rg.onchange=cu.onchange=rd;
cv.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff日期,类别,奉献者,方式,金额\n"+L.filter(x=>inR(x.d)).map(x=>[x.d,x.t,x.n||"匿名",x.p,x.a].join(",")).join("\n")]));a.download="奉献统计.csv";a.click()};rd()</script></html>
