<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房贷计算器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>房贷计算器</h1></header><main><div class=panel><div class=row><div><label>贷款金额（万元）</label><input id=p type=number value=100></div><div><label>年利率（%）</label><input id=r type=number value=3.1 step=0.05></div><div><label>年限</label><input id=y type=number value=30></div></div></div><div class="panel stat" id=o></div><div class=panel><details><summary>前 12 期明细（等额本金）</summary><div id=tb class=out></div></details></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="loan");r.unshift("loan");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const fm=v=>v.toLocaleString("zh-CN",{maximumFractionDigits:2});const f=()=>{const P=p.value*1e4,i=r.value/1200,n=y.value*12,m=i?P*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):P/n,t1=m*n-P;
const f1=P/n+P*i,t2=(n+1)*P*i/2;o.innerHTML=[["等额本息 月供",fm(m)],["等额本息 总利息",fm(t1)],["等额本金 首月",fm(f1)],["等额本金 每月递减",fm(P/n*i)],["等额本金 总利息",fm(t2)],["本金 少付利息",fm(t1-t2)]].map(([a,b])=>`<div><b style="font-size:18px">${b}</b>${a}</div>`).join("");
tb.textContent=Array.from({length:12},(_,k)=>`第${k+1}期  ${fm(P/n+(P-k*P/n)*i)} 元`).join("\n")};[p,r,y].forEach(e=>e.oninput=f);f()</script></html>
