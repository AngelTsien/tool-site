<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>座位表 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>座位表</h1></header><main><div class=panel><div class=row><label style="margin:0">桌数</label><input id=nt type=number value=4 min=1 style="width:70px"><label style="margin:0">每桌</label><input id=ns type=number value=8 min=2 style="width:70px"><select id=sh><option value=r>⭕ 圆桌</option><option value=l>▭ 长桌</option></select></div>
<label>宾客名单（一行一户/一组，同一行用逗号分开的人会坐在一起；行首写 * 表示主桌）</label><textarea id=gl>*新郎,新娘,王爸爸,王妈妈
张伯伯,张伯母
李弟兄,李姊妹,小明
陈牧师,陈师母
赵,钱,孙,李四
周,吴,郑</textarea><div class=row><button id=au>🪄 自动排座</button><button class=alt onclick="print()">🖨 打印</button><button class=alt id=ex>导出 CSV</button><span style="color:#7a706a;font-size:13px">点一个座位再点另一个可以互换</span></div></div>
<style>.tbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.tb{position:relative;height:250px;background:#fff;border-radius:16px;box-shadow:0 2px 10px #0001}.ce{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#f3d9c4;display:grid;place-items:center;font-weight:700;color:#8a5a3a}
.st{position:absolute;width:62px;height:30px;margin:-15px 0 0 -31px;border-radius:15px;background:#eee4da;font-size:12px;display:grid;place-items:center;cursor:pointer;overflow:hidden;white-space:nowrap}.st.f{background:#b98a62;color:#fff}.st.s{outline:3px solid #e94b3c}@media print{header,footer,.panel{display:none!important}.tb{break-inside:avoid;border:1px solid #ccc}}</style><p id=info style="color:#7a706a"></p><div class=tbs id=tbs></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="seating");r.unshift("seating");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let S=JSON.parse(localStorage.seating||"null"),sel=null;if(S){gl.value=S.g;nt.value=S.t;ns.value=S.n;sh.value=S.h}let A=S?S.a:[];
const draw=()=>{const T=+nt.value||1,N=+ns.value||2;localStorage.seating=JSON.stringify({g:gl.value,t:T,n:N,h:sh.value,a:A});tbs.innerHTML=Array.from({length:T},(_,t)=>{let h="";const r=sh.value=="r";
h+=r?`<div class=ce style="width:110px;height:110px;border-radius:50%">${t?"第 "+(t+1)+" 桌":"⭐ 主桌"}</div>`:`<div class=ce style="width:70px;height:180px;border-radius:10px">${t?(t+1)+" 桌":"⭐ 主桌"}</div>`;
for(let s=0;s<N;s++){let x,y;if(r){const a=s/N*2*Math.PI-Math.PI/2;x=50+40*Math.cos(a);y=50+40*Math.sin(a)}else{const half=Math.ceil(N/2),col=s<half?0:1,k=s<half?s:s-half;x=col?78:22;y=14+k*(72/Math.max(1,half-1||1))}
const v=(A[t]||[])[s]||"";h+=`<div class="st ${v?"f":""} ${sel&&sel[0]==t&&sel[1]==s?"s":""}" data-t=${t} data-s=${s} style="left:${x}%;top:${y}%">${v||"空"}</div>`}return`<div class=tb>${h}</div>`}).join("");
const all=A.flat().filter(Boolean).length;info.textContent=`共 ${T} 桌 × ${N} 座 = ${T*N} 座 · 已安排 ${all} 人`};
au.onclick=()=>{const T=+nt.value||1,N=+ns.value||2;const G=gl.value.split("\n").map(l=>({h:l.trim().startsWith("*"),p:l.replace("*","").split(/[,，、]/).map(x=>x.trim()).filter(Boolean)})).filter(g=>g.p.length);
A=Array.from({length:T},()=>[]);const fits=[];G.filter(g=>g.h).forEach(g=>A[0].push(...g.p));G.filter(g=>!g.h).sort((a,b)=>b.p.length-a.p.length).forEach(g=>{let best=-1;for(let t=0;t<T;t++)if(A[t].length+g.p.length<=N&&(best<0||A[t].length<A[best].length))best=t;
if(best<0){g.p.forEach(p=>{let t=A.findIndex(a=>a.length<N);if(t<0)fits.push(p);else A[t].push(p)})}else A[best].push(...g.p)});A.forEach(a=>a.length=Math.min(a.length,N));draw();if(fits.length)alert("座位不够，未安排："+fits.join("、"))};
tbs.onclick=e=>{const c=e.target.closest(".st");if(!c)return;const p=[+c.dataset.t,+c.dataset.s];if(!sel){sel=p}else{A[sel[0]]=A[sel[0]]||[];A[p[0]]=A[p[0]]||[];const v=A[sel[0]][sel[1]];A[sel[0]][sel[1]]=A[p[0]][p[1]];A[p[0]][p[1]]=v;sel=null}draw()};
[nt,ns,sh].forEach(x=>x.onchange=draw);gl.oninput=()=>localStorage.seating=JSON.stringify({g:gl.value,t:nt.value,n:ns.value,h:sh.value,a:A});
ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff桌号,座位,姓名\n"+A.flatMap((t,i)=>t.map((n,j)=>n?`${i+1},${j+1},${n}`:"").filter(Boolean)).join("\n")]));a.download="座位表.csv";a.click()};if(!A.length)au.onclick();else draw();</script></html>
