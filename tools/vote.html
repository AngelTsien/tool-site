<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投票表决器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>投票表决器</h1></header><main><div class=panel id=setup><label>表决事项</label><input id=qt style="width:100%" placeholder="如：是否同意明年夏令营在山上举办？"><label>选项（每行一个）</label><textarea id=op style="min-height:80px">同意
反对
弃权</textarea><div class=row><label style="margin:0">投票人数</label><input id=nv type=number value=10 min=1 style="width:80px"><label style="margin:0"><input type=checkbox id=mul> 可多选</label><label style="margin:0">通过需</label><select id=th><option value=0.5>过半数</option><option value=0.6667>三分之二</option><option value=0>最高票</option></select><button id=st>🗳 开始投票</button></div></div>
<div class=panel id=vt style="display:none;text-align:center"><p id=pr style="color:#7a706a"></p><h2 id=qq></h2><div id=bs style="display:grid;gap:10px;max-width:420px;margin:auto"></div><button id=ok style="margin-top:14px;font-size:20px;padding:12px 30px">✔ 确认投票</button></div>
<div class=panel id=hide style="display:none;text-align:center;background:#3a3330;color:#fff;min-height:300px;display:none;place-items:center"><div><div style="font-size:60px">🙈</div><h2>已投票，请把手机交给下一位</h2><button id=nx style="font-size:20px">我是下一位 👉</button></div></div>
<div class=panel id=res style="display:none"><h2 id=rq style="margin-top:0"></h2><div id=rb></div><h2 id=vd style="text-align:center"></h2><div class=row style="justify-content:center"><button id=ag>🔄 再来一次</button><button class=alt id=cp>复制结果</button></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="vote");r.unshift("vote");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let O=[],N=0,T=[],cur=new Set();const show=i=>{[setup,vt,hide,res].forEach((e,j)=>e.style.display=j==i?(i==2?"grid":""):"none")};
st.onclick=()=>{O=op.value.split("\n").map(x=>x.trim()).filter(Boolean);if(O.length<2)return alert("至少两个选项");N=Math.max(1,+nv.value||1);T=O.map(()=>0);window.__done=0;vote()};
const vote=()=>{cur=new Set();qq.textContent=qt.value||"请投票";pr.textContent=`第 ${__done+1} / ${N} 位 · ${mul.checked?"可多选":"单选"} · 匿名`;bs.innerHTML=O.map((o,i)=>`<button class=alt data-i=${i} style="font-size:20px;padding:14px">${o}</button>`).join("");show(1)};
bs.onclick=e=>{const b=e.target.closest("[data-i]");if(!b)return;const i=+b.dataset.i;if(!mul.checked)cur.clear();cur.has(i)?cur.delete(i):cur.add(i);bs.querySelectorAll("button").forEach((x,j)=>{x.style.background=cur.has(j)?"#b98a62":"";x.style.color=cur.has(j)?"#fff":""})};
ok.onclick=()=>{if(!cur.size)return;cur.forEach(i=>T[i]++);__done++;if(__done>=N)result();else show(2)};nx.onclick=vote;
const result=()=>{rq.textContent=(qt.value||"表决")+` · ${N} 人投票`;const mx=Math.max(...T);rb.innerHTML=O.map((o,i)=>`<div style="margin:8px 0"><div class=row><b style="flex:1">${o}${T[i]==mx&&mx?" 👑":""}</b>${T[i]} 票 · ${Math.round(T[i]/N*100)}%</div><div style="height:16px;background:#eee4da;border-radius:8px"><div style="height:100%;width:${T[i]/N*100}%;background:hsl(${i*67+20} 50% 60%);border-radius:8px;transition:1s"></div></div></div>`).join("");
const t=+th.value,w=T.indexOf(mx),tie=T.filter(x=>x==mx).length>1;vd.textContent=t==0?(tie?"⚖️ 平票，需再议":`🏆 结果：${O[w]}`):(T[0]/N>t?`✅ 「${O[0]}」${T[0]} 票，超过${t>.6?"三分之二":"半数"}，通过！`:`❌ 「${O[0]}」${T[0]} 票，未达${t>.6?"三分之二":"半数"}，未通过`);show(3)};
ag.onclick=()=>show(0);cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(rq.textContent+"\n"+O.map((o,i)=>`${o}：${T[i]} 票`).join("\n")+"\n"+vd.textContent);cp.textContent="✓ 已复制"};show(0);</script></html>
