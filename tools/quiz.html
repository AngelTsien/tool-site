<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣经问答测验 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>圣经问答测验</h1></header><main><div class=panel><details><summary>📥 题库（每行：题目 | 正确答案 | 错误答案…；可从 Kahoot 题目表格式粘贴）</summary><textarea id=t style="min-height:140px">耶稣在哪里出生？ | 伯利恒 | 拿撒勒 | 耶路撒冷 | 迦百农
圣经共有多少卷？ | 66 | 72 | 39 | 27
谁带领以色列人出埃及？ | 摩西 | 亚伦 | 约书亚 | 约瑟
尼希米修城墙用了几天？ | 52 天 | 40 天 | 70 天
“起初神创造天地”出自哪卷书？ | 创世记 | 约翰福音 | 诗篇</textarea><p class=row><button id=sv>保存题库</button><label><input type=checkbox id=tmr checked> 每题限时 20 秒</label></p></details></div>
<div class=panel style="text-align:center" id=qa><p id=pg style="color:#a99"></p><div style="height:6px;background:#eee4da;border-radius:3px"><div id=bar style="height:6px;border-radius:3px;background:#8fae9a;width:100%"></div></div><h2 id=q style="margin:18px 0"></h2><div id=ops style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"></div><p id=fb style="font-size:18px;min-height:26px"></p><button id=st>开始测验</button></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="quiz");r.unshift("quiz");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>t.value=localStorage.quiz||t.value;let Q=[],i=0,sc=0,tl,lock,wrong=[];const C=["#e07a5f","#3a6ea5","#e8b84a","#4a9a5a"];
const load=()=>Q=t.value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(a=>a.length>=3&&a[0]).sort(()=>Math.random()-.5);
const show=()=>{if(i>=Q.length){q.textContent=`得分 ${sc} / ${Q.length}`;ops.innerHTML=wrong.length?"<div style='text-align:left;grid-column:1/-1'><b>需要复习：</b><br>"+wrong.map(w=>`❌ ${w[0]} → <b>${w[1]}</b>`).join("<br>")+"</div>":"<div style='grid-column:1/-1;font-size:40px'>🏆 全对！</div>";fb.textContent="";pg.textContent="";st.style.display="";st.textContent="再来一次";return}
const [qq,ok,...w]=Q[i],O=[ok,...w].sort(()=>Math.random()-.5);lock=false;pg.textContent=`第 ${i+1} / ${Q.length} 题 · 得分 ${sc}`;q.textContent=qq;fb.textContent="";ops.innerHTML=O.map((o,j)=>`<button style="background:${C[j%4]};font-size:18px;padding:16px" data-o="${o.replace(/"/g,"&quot;")}">${o}</button>`).join("");
ops.querySelectorAll("button").forEach(b=>b.onclick=()=>ans(b.dataset.o));let left=20;bar.style.width="100%";clearInterval(tl);if(tmr.checked)tl=setInterval(()=>{left-=.1;bar.style.width=left*5+"%";if(left<=0)ans(null)},100)};
const ans=a=>{if(lock)return;lock=true;clearInterval(tl);const ok=Q[i][1];ops.querySelectorAll("button").forEach(b=>{b.style.opacity=b.dataset.o==ok?1:.35});if(a==ok){sc++;fb.innerHTML="<span style=color:#4a9a5a>✅ 答对了！</span>"}else{wrong.push([Q[i][0],ok]);fb.innerHTML=`<span style=color:#c05a4a>${a?"❌ 答错了":"⏰ 时间到"}，正确答案：${ok}</span>`}i++;setTimeout(show,1300)};
st.onclick=()=>{load();i=sc=0;wrong=[];st.style.display="none";show()};sv.onclick=()=>{localStorage.quiz=t.value;st.click()};window.__ans=ans;window.__st=()=>({i,sc,Q})</script></html>
