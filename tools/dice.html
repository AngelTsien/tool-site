<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掷骰子 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>掷骰子</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><label>骰子数</label><select id=n><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select><button id=go style="font-size:20px">🎲 掷！</button></div><div id=d style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:24px 0;font-size:90px"></div><p id=s style="font-size:22px"></p><p id=h style="color:#a99"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="dice");r.unshift("dice");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const F="⚀⚁⚂⚃⚄⚅",H=[];const r=()=>{const k=+n.value;let c=0;const iv=setInterval(()=>{d.innerHTML=Array.from({length:k},()=>`<span style="display:inline-block;transform:rotate(${Math.random()*60-30}deg)">${F[Math.random()*6|0]}</span>`).join("");if(++c>10){clearInterval(iv);
const v=Array.from({length:k},()=>1+crypto.getRandomValues(new Uint8Array(1))[0]%6);d.innerHTML=v.map(x=>`<span style="color:#b98a62">${F[x-1]}</span>`).join("");s.textContent=`点数：${v.join(" + ")} = ${v.reduce((a,b)=>a+b)}`;H.unshift(v.reduce((a,b)=>a+b));h.textContent="最近："+H.slice(0,10).join("、")}},70)};go.onclick=r;r()</script></html>
