<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动画贺卡 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>动画贺卡</h1></header><main><div class=panel><div class=row><select id=th><option value=bd>🎂 生日快乐</option><option value=an>💞 结婚纪念</option><option value=bl>✨ 祝福/感恩</option><option value=xm>🎄 圣诞</option></select><input id=to placeholder="送给（如：亲爱的妈妈）" style="flex:1"></div>
<textarea id=msg style="min-height:70px;margin-top:8px" placeholder="祝福语"></textarea><div class=row><input id=fr placeholder="落款" style="flex:1"><button id=fs>⛶ 全屏播放</button><button class=alt id=sh>🔗 复制分享链接</button><button class=alt id=dl>💾 存图</button></div></div>
<div style="text-align:center"><canvas id=cv width=720 height=960 style="width:min(100%,420px);border-radius:18px;box-shadow:0 6px 24px #0003;background:#000"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="card");r.unshift("card");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const D={bd:["#ff9a9e","#fad0c4","🎈🎁🎂🎉","生日快乐","愿你新的一岁平安喜乐，被爱环绕！"],an:["#f6d365","#fda085","💖💕💞🌹","纪念日快乐","感谢一路同行，愿我们的爱如初，更深更真。"],bl:["#a1c4fd","#c2e9fb","✨⭐🕊️🌟","祝福你","愿主赐福给你，保护你，使你平安。"],xm:["#1e3c72","#2a5298","❄️🎄⭐🎁","圣诞快乐","因为今天在大卫的城里，为你们生了救主。"]};
const h=new URLSearchParams(location.hash.slice(1));if(h.get("t")){th.value=h.get("t");to.value=h.get("to")||"";msg.value=h.get("m")||"";fr.value=h.get("f")||""}else msg.value=D.bd[4];th.onchange=()=>{msg.value=D[th.value][4]};
let ps=[],t0=performance.now();const x=cv.getContext("2d"),wrap=(s,w)=>{const o=[];let l="";for(const c of s){if(c=="\n"||x.measureText(l+c).width>w){o.push(l);l=c=="\n"?"":c}else l+=c}o.push(l);return o};
const frame=now=>{const t=(now-t0)/1000,d=D[th.value],g=x.createLinearGradient(0,0,720,960);g.addColorStop(0,d[0]);g.addColorStop(1,d[1]);x.fillStyle=g;x.fillRect(0,0,720,960);
if(ps.length<40&&Math.random()<.3)ps.push({x:Math.random()*720,y:th.value=="xm"?-40:1000,v:1+Math.random()*2,e:[...d[2]][Math.random()*4|0],s:30+Math.random()*30,w:Math.random()*6});
x.textAlign="center";x.textBaseline="middle";ps.forEach(p=>{p.y+=th.value=="xm"?p.v:-p.v;x.font=p.s+"px serif";x.fillText(p.e,p.x+Math.sin(t+p.w)*20,p.y)});ps=ps.filter(p=>p.y>-60&&p.y<1020);
const a=Math.min(1,t/1.2),sc=1+Math.sin(t*2)*.03;x.save();x.globalAlpha=a;x.translate(360,250);x.scale(sc,sc);x.fillStyle="#fff";x.shadowColor="#0004";x.shadowBlur=12;x.font="bold 84px sans-serif";x.fillText(d[3],0,0);x.restore();
x.globalAlpha=Math.min(1,Math.max(0,t-1));x.fillStyle=th.value=="xm"?"#fff":"#4a3030";x.font="bold 40px sans-serif";x.fillText(to.value||"",360,380);x.font="34px sans-serif";const L=wrap(msg.value,580),shown=Math.floor((t-1.5)*18);let c=0;
L.forEach((l,i)=>{const s=[...l].slice(0,Math.max(0,shown-c)).join("");c+=[...l].length;x.fillText(s,360,470+i*54)});x.font="italic 32px serif";x.fillText(fr.value?"—— "+fr.value:"",360,520+L.length*54);x.globalAlpha=1;requestAnimationFrame(frame)};requestAnimationFrame(frame);
[to,msg,fr,th].forEach(e=>e.addEventListener("input",()=>{t0=performance.now()-1600}));
fs.onclick=()=>{t0=performance.now();ps=[];cv.requestFullscreen&&cv.requestFullscreen().catch(()=>{})};
sh.onclick=()=>{const u=location.href.split("#")[0]+"#"+new URLSearchParams({t:th.value,to:to.value,m:msg.value,f:fr.value});navigator.clipboard&&navigator.clipboard.writeText(u);window.__u=u;sh.textContent="✓ 链接已复制，发给对方打开即可"};
dl.onclick=()=>{const a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="贺卡.png";a.click()};</script></html>
