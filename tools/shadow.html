<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS 阴影生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>CSS 阴影生成</h1></header><main><div class=panel style="display:flex;align-items:center;justify-content:center;min-height:260px" id=bgp><div id=bx style="width:180px;height:120px;background:#fff;display:flex;align-items:center;justify-content:center;color:#7a706a">预览</div></div>
<div class=panel><div class=grid style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 16px"><label>水平偏移 <input type=range id=x min=-50 max=50 value=0 style="width:100%"></label><label>垂直偏移 <input type=range id=y min=-50 max=50 value=10 style="width:100%"></label><label>模糊 <input type=range id=bl min=0 max=100 value=30 style="width:100%"></label><label>扩展 <input type=range id=sp min=-30 max=30 value=-5 style="width:100%"></label>
<label>透明度 <input type=range id=op min=0 max=100 value=20 style="width:100%"></label><label>圆角 <input type=range id=rd min=0 max=60 value=16 style="width:100%"></label><label>阴影色 <input type=color id=co value="#000000"></label><label>背景色 <input type=color id=bgc value="#f7f3ee"></label></div>
<div class=row style="margin-top:8px"><label><input type=checkbox id=ins> 内阴影</label><label><input type=checkbox id=lay> 多层柔和阴影</label><span style="font-size:13px;color:#a99">预设：</span><button class=alt data-p="0,2,6,0,12">轻</button><button class=alt data-p="0,10,30,-5,20">卡片</button><button class=alt data-p="0,24,60,-12,30">浮起</button><button class=alt data-p="8,8,0,0,100">硬朗</button></div><div class=out id=cs style="margin-top:10px"></div><button id=cp>复制 CSS</button></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="shadow");r.unshift("shadow");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const h2r=(h,a)=>`rgba(${[1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(", ")}, ${a})`;const f=()=>{const a=op.value/100,c=co.value,i=ins.checked?"inset ":"";let s=lay.checked?[1,2,4,8,16].map(k=>`${i}${x.value*k/16|0}px ${y.value*k/16|0}px ${bl.value*k/16|0}px ${h2r(c,(a/2.5).toFixed(3))}`).join(",\n    "):`${i}${x.value}px ${y.value}px ${bl.value}px ${sp.value}px ${h2r(c,a)}`;
bx.style.boxShadow=s;bx.style.borderRadius=rd.value+"px";bgp.style.background=bgc.value;cs.textContent=`box-shadow: ${s};\nborder-radius: ${rd.value}px;`};document.querySelectorAll("input").forEach(e=>e.oninput=f);
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{[x.value,y.value,bl.value,sp.value,op.value]=b.dataset.p.split(",");f()});cp.onclick=()=>navigator.clipboard.writeText(cs.textContent);f()</script></html>
