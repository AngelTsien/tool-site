<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小组通讯录 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>小组通讯录</h1></header><main><div class=panel><div class=row><input id=n placeholder="姓名" style="flex:1"><input id=p placeholder="电话" style="flex:1"></div><div class=row style="margin-top:8px"><input id=g placeholder="小组/分类（如：青年团契）" list=gl style="flex:1"><datalist id=gl></datalist><input id=m placeholder="邮箱（可选）" style="flex:1"></div><div class=row style="margin-top:8px"><input id=bd type=date title="生日"><input id=nt placeholder="备注（地址/家人/代祷）" style="flex:1"><button id=ad>➕ 添加</button></div>
<details style="margin-top:10px"><summary>📋 批量粘贴（每行：姓名,电话,小组）</summary><textarea id=bulk placeholder="王约翰,13800000000,青年组"></textarea><button id=bi>导入</button></details></div>
<div class=row style="margin-bottom:10px"><input id=q placeholder="🔍 搜索" style="flex:1"><select id=fg><option value="">全部小组</option></select><button id=vc>📇 导出 vCard</button><button class=alt id=cs>CSV</button><button class=alt onclick="print()">🖨 打印卡片</button></div>
<style>.cc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.ct{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #0001;border-top:5px solid var(--c)}@media print{header,footer,.panel,.row{display:none!important}.ct{break-inside:avoid;border:1px solid #ccc}}</style><div class=cc id=ls></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="contacts");r.unshift("contacts");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.contacts||"[]");const cl=s=>`hsl(${[...s].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360} 50% 65%)`,h=s=>(s||"").replace(/[<>&]/g,"");
const rd=()=>{localStorage.contacts=JSON.stringify(L);const G=[...new Set(L.map(x=>x.g).filter(Boolean))];gl.innerHTML=G.map(x=>`<option value="${x}">`).join("");const v=fg.value;fg.innerHTML=`<option value="">全部小组（${L.length}）</option>`+G.map(x=>`<option ${x==v?"selected":""}>${x}</option>`).join("");
ls.innerHTML=V().map(x=>{const i=L.indexOf(x);return`<div class=ct style="--c:${cl(x.g||"无")}"><div class=row><div style="width:42px;height:42px;border-radius:50%;background:${cl(x.n)};color:#fff;display:grid;place-items:center;font-size:20px">${h(x.n[0])}</div><div style="flex:1"><b>${h(x.n)}</b><div style="font-size:13px;color:#888">${h(x.g)}</div></div><button class=alt onclick="L.splice(${i},1);rd()">✕</button></div>
<div style="margin-top:8px">📞 <a href="tel:${h(x.p)}">${h(x.p)}</a>${x.m?`<br>✉️ ${h(x.m)}`:""}${x.b?`<br>🎂 ${x.b.slice(5)}`:""}${x.t?`<br>📝 ${h(x.t)}`:""}</div></div>`}).join("")||"<p style='color:#a99'>还没有联系人</p>"};
const V=()=>L.filter(x=>(!fg.value||x.g==fg.value)&&(!q.value||(x.n+x.p+x.g+x.t).includes(q.value)));
ad.onclick=()=>{if(!n.value.trim())return;L.push({n:n.value.trim(),p:p.value.trim(),g:g.value.trim(),m:m.value.trim(),b:bd.value,t:nt.value.trim()});n.value=p.value=m.value=nt.value=bd.value="";L.sort((a,b)=>a.n.localeCompare(b.n,"zh"));rd()};
bi.onclick=()=>{bulk.value.split("\n").forEach(l=>{const a=l.split(/[,，\t]/).map(x=>x.trim());a[0]&&L.push({n:a[0],p:a[1]||"",g:a[2]||"",m:"",b:"",t:""})});bulk.value="";rd()};q.oninput=fg.onchange=rd;
const sv=(t,n,ty)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
vc.onclick=()=>sv(V().map(x=>["BEGIN:VCARD","VERSION:3.0","FN:"+x.n,"N:"+x.n+";;;;","TEL;TYPE=CELL:"+x.p,x.m&&"EMAIL:"+x.m,x.g&&"CATEGORIES:"+x.g,x.b&&"BDAY:"+x.b,x.t&&"NOTE:"+x.t,"END:VCARD"].filter(Boolean).join("\r\n")).join("\r\n"),"通讯录.vcf","text/vcard");
cs.onclick=()=>sv("\ufeff姓名,电话,小组,邮箱,生日,备注\n"+V().map(x=>[x.n,x.p,x.g,x.m,x.b,x.t].join(",")).join("\n"),"通讯录.csv","text/csv");rd();</script></html>
