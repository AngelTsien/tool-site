<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪卡记忆 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>闪卡记忆</h1></header><main><div class=panel><details><summary>✏️ 编辑卡组（每行：正面 | 背面）</summary><textarea id=t style="min-height:120px">约翰福音 3:16 | 神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。
诗篇 23:1 | 耶和华是我的牧者，我必不致缺乏。
腓立比书 4:13 | 我靠着那加给我力量的，凡事都能做。
grace | 恩典
faith | 信心</textarea><p class=row><button id=sv>保存卡组</button><button class=alt id=sf>🔀 打乱</button><label><input type=checkbox id=rv> 反向（背面先显示）</label></p></details></div>
<div class=panel style="text-align:center;perspective:1000px"><div id=cd style="position:relative;height:240px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer"><div id=fr style="position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;background:linear-gradient(135deg,#f6d1b8,#e8a98a);display:flex;align-items:center;justify-content:center;padding:20px;font-size:26px;font-weight:600"></div><div id=bk style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:16px;background:linear-gradient(135deg,#d7ebdc,#9cc5a8);display:flex;align-items:center;justify-content:center;padding:20px;font-size:20px;line-height:1.6"></div></div>
<p id=pg style="color:#a99"></p><div class=row style="justify-content:center"><button class=alt id=pv>← 上一张</button><button class=alt id=no>😕 不会</button><button id=ye>😊 记住了</button><button class=alt id=nx>下一张 →</button></div><p id=sc></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="flashcard");r.unshift("flashcard");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>t.value=localStorage.fc||t.value;let C=[],i=0,fl=false,K={};const load=()=>{C=t.value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(a=>a[0]&&a[1]);if(rv.checked)C=C.map(([a,b])=>[b,a]);i=0;K={};sh()};
const sh=()=>{if(!C.length)return;fl=false;cd.style.transform="";fr.textContent=C[i][0];bk.textContent=C[i][1];pg.textContent=`${i+1} / ${C.length}`;const y=Object.values(K).filter(Boolean).length;sc.textContent=`记住 ${y}，不会 ${Object.values(K).length-y}`+(y==C.length?" 🎉 全部记住！":"")};
cd.onclick=()=>{fl=!fl;cd.style.transform=fl?"rotateY(180deg)":""};const mv=d=>{i=(i+d+C.length)%C.length;sh()};pv.onclick=()=>mv(-1);nx.onclick=()=>mv(1);ye.onclick=()=>{K[i]=1;mv(1)};no.onclick=()=>{K[i]=0;mv(1)};
sv.onclick=()=>{localStorage.fc=t.value;load()};sf.onclick=()=>{C.sort(()=>Math.random()-.5);i=0;K={};sh()};rv.onchange=load;onkeydown=e=>{if(e.key=="ArrowRight")mv(1);if(e.key=="ArrowLeft")mv(-1);if(e.key==" "){e.preventDefault();cd.click()}};load()</script></html>
