const es=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");const f=()=>{const nz=s=>ws.checked?s.replace(/\s+/g,""):s,R=lcs(a.value.split("\n"),b.value.split("\n"),(x,y)=>nz(x)==nz(y));let h="",ad=0,dl=0,ch=0;

else if(t=="-"){dl++;h+=`<div style="background:#fbe9e5">− ${es(x)}</div>`}else{ad++;h+=`<div style="background:#e7f3ea">+ ${es(y)}</div>`}}o.innerHTML=h;sm.textContent=`新增 ${ad} 行 · 删除 ${dl} 行 · 修改 ${ch} 行`};[a,b,ws].forEach(e=>e.oninput=f);f()</script></html>
