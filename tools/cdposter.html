<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒计时海报 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>倒计时海报</h1></header><main><div class=panel><div class=row><input id=ev value="复活节崇拜" style="flex:1"><input type=date id=dt><input id=sb value="一起来庆祝主复活！" style="flex:1"></div><div class=row style="margin-top:8px"><select id=th></select><select id=sz><option value="1080x1350">竖版 4:5</option><option value="1080x1920">手机全屏</option><option value="1080x1080">方形</option></select><label><input type=checkbox id=ld checked> 显示“距离…还有”</label><button id=dl>下载海报</button></div></div><div class=panel style="text-align:center"><canvas id=c style="max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 6px 24px #0002"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="cdposter");r.unshift("cdposter");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const TH={"🌅 晨曦":["#ffe0c2","#f6a58a","#5a2a1a","#fff"],"🌿 春绿":["#e3f4e0","#8fc79a","#1f4a2a","#fff"],"🌙 夜空":["#1e2a54","#4a3a7a","#fff3d6","#f6d36b"],"🎄 圣诞":["#7a1d1d","#2a5a3a","#fff","#f6d36b"],"🌸 樱粉":["#fde2ec","#e7a3c4","#5a2440","#fff"]};Object.keys(TH).forEach(k=>th.add(new Option(k)));
const d0=new Date();d0.setDate(d0.getDate()+30);dt.valueAsDate=d0;const d=()=>{const[W,H]=sz.value.split("x").map(Number),t=TH[th.value],x=c.getContext("2d");c.width=W;c.height=H;const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,t[0]);g.addColorStop(1,t[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<30;i++){x.fillStyle=t[3]+"33";x.beginPath();x.arc((i*137)%W,(i*251)%H,3+(i%5)*3,0,7);x.fill()}const T=new Date();T.setHours(0,0,0,0);const days=Math.round((new Date(dt.value+"T00:00")-T)/864e5),cy=H/2;x.textAlign="center";x.fillStyle=t[2];
x.font=`600 ${W*.055}px "PingFang SC","Noto Sans CJK SC",sans-serif`;if(ld.checked)x.fillText(days>=0?"距离":"已经过去",W/2,cy-W*.36);x.font=`800 ${W*.09}px "Songti SC","Noto Serif CJK SC",serif`;x.fillText(ev.value,W/2,cy-W*.24);
x.font=`900 ${W*.38}px Georgia,serif`;x.shadowColor="#0003";x.shadowBlur=30;const ng=x.createLinearGradient(0,cy-W*.2,0,cy+W*.1);ng.addColorStop(0,t[3]);ng.addColorStop(1,t[2]);x.fillStyle=ng;x.fillText(Math.abs(days),W/2,cy+W*.12);x.shadowBlur=0;x.fillStyle=t[2];
x.font=`700 ${W*.07}px "PingFang SC","Noto Sans CJK SC",sans-serif`;x.fillText(days==0?"就是今天！":"天",W/2,cy+W*.24);x.font=`400 ${W*.045}px "PingFang SC","Noto Sans CJK SC",sans-serif`;x.globalAlpha=.85;x.fillText(sb.value,W/2,cy+W*.36);x.fillText(new Date(dt.value).toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"}),W/2,H-W*.08);x.globalAlpha=1};
[ev,dt,sb,th,sz,ld].forEach(e=>e.oninput=d);dl.onclick=()=>{const a=document.createElement("a");a.download=ev.value+"倒计时.png";a.href=c.toDataURL();a.click()};d()</script></html>
