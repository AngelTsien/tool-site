<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON 格式化 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>JSON 格式化</h1></header><main><div class=panel><textarea id=t style="min-height:180px;font-family:monospace">{"name":"小工具站","tools":24,"tags":["教会","生活"]}</textarea><p class=row><button id=fm>格式化</button><button class=alt id=mn>压缩</button><button class=alt id=cp>复制</button></p><p id=e></p><div class=out id=o></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="json");r.unshift("json");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const run=s=>{try{o.textContent=JSON.stringify(JSON.parse(t.value),null,s);e.innerHTML="<span style=color:#4a9a5a>✓ JSON 有效</span>"}catch(x){e.innerHTML="<span style=color:#c05a4a>✗ "+x.message+"</span>"}};fm.onclick=()=>run(2);mn.onclick=()=>run(0);cp.onclick=()=>navigator.clipboard.writeText(o.textContent);run(2)</script></html>
