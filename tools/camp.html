<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>营会分房分组 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>营会分房分组</h1></header><main><div class=panel><label>营员名单（每行：姓名,性别(男/女),年龄 —— 可直接从 Excel 粘贴）</label><textarea id=ls style="min-height:140px"></textarea><div class=row><button class=alt id=dm>示例 24 人</button><span id=ct style="color:#7a706a"></span></div>
<div class=row style="margin-top:8px"><b>🛏 分房</b>每间<input id=cap type=number value=4 min=1 style="width:60px">人<label style="margin:0"><input type=checkbox id=ag checked>年龄相近同房</label></div>
<div class=row style="margin-top:8px"><b>👥 分组</b><input id=ng type=number value=4 min=2 style="width:60px">组<label style="margin:0"><input type=checkbox id=sp checked>同房的人尽量分开</label></div><div class=row style="margin-top:10px"><button id=go>🎲 生成分房+分组</button><button class=alt id=sf>重新打乱</button><button class=alt id=ex>导出 CSV</button><button class=alt onclick="print()">🖨</button></div></div>
<div class=panel><h3 style="margin-top:0">🛏 房间</h3><div class=grid id=rm></div></div><div class=panel><h3 style="margin-top:0">👥 小组（性别、年龄均衡）</h3><div class=grid id=gp></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="camp");r.unshift("camp");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let P=[],RM=[],GP=[];ls.value=localStorage.camp||"";const parse=()=>ls.value.split("\n").map(l=>l.split(/[,，\t ]+/).map(x=>x.trim())).filter(a=>a[0]).map(a=>({n:a[0],s:/女|f|F/.test(a[1]||"")?"女":"男",a:+a[2]||0}));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
ls.oninput=()=>{localStorage.camp=ls.value;P=parse();ct.textContent=`共 ${P.length} 人 · 男 ${P.filter(x=>x.s=="男").length} · 女 ${P.filter(x=>x.s=="女").length}`};
dm.onclick=()=>{const F="恩惠,喜乐,雅各,约翰,路加,马可,提摩太,以撒,彼得,安得烈,腓力,多马,马利亚,马大,路得,以斯帖,哈拿,撒拉,利百加,米利暗,百基拉,吕底亚,多加,友妮基".split(",");ls.value=F.map((n,i)=>`${n},${i<12?"男":"女"},${10+(i*7)%9}`).join("\n");ls.oninput()};
const run=()=>{P=parse();const C=Math.max(1,+cap.value||4),G=Math.max(2,+ng.value||4);RM=[];["男","女"].forEach(s=>{let a=shuf(P.filter(x=>x.s==s));if(ag.checked)a.sort((x,y)=>x.a-y.a);const n=Math.ceil(a.length/C);for(let i=0;i<n;i++){const r=a.slice(Math.round(i*a.length/n),Math.round((i+1)*a.length/n));r.forEach(p=>p.r=RM.length+1);RM.push({s,p:r})}});
GP=Array.from({length:G},()=>[]);const cost=(g,p)=>g.length*100+g.filter(x=>x.s==p.s).length*30+(sp.checked?g.filter(x=>x.r==p.r).length*50:0)+g.reduce((a,x)=>a+(Math.abs(x.a-p.a)<1?3:0),0);
["男","女"].forEach(s=>shuf(P.filter(x=>x.s==s)).sort((a,b)=>b.a-a.a).forEach(p=>{let b=0;GP.forEach((g,i)=>{if(cost(g,p)<cost(GP[b],p))b=i});GP[b].push(p)}));
const chip=p=>`<span class=tag style="background:${p.s=="男"?"#dbe8f7":"#f9dde6"};color:#444">${p.s=="男"?"👦":"👧"}${p.n}${p.a?" "+p.a:""}</span> `;
rm.innerHTML=RM.map((r,i)=>`<div class=card><h3>${r.s=="男"?"🔵":"🔴"} ${i+1} 号房 <small style="color:#999">${r.s} · ${r.p.length} 人</small></h3>${r.p.map(chip).join("")}</div>`).join("");
gp.innerHTML=GP.map((g,i)=>{const m=g.filter(x=>x.s=="男").length,av=g.length?(g.reduce((a,x)=>a+x.a,0)/g.length).toFixed(1):0;return`<div class=card style="--c:hsl(${i*80} 50% 85%)"><h3>第 ${i+1} 组 <small style="color:#999">${g.length} 人 · 男${m}/女${g.length-m} · 均龄 ${av}</small></h3>${g.map(p=>chip(p)+`<small style="color:#aaa">${p.r}房</small> `).join("")}</div>`}).join("")};
go.onclick=sf.onclick=run;ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff姓名,性别,年龄,房间,小组\n"+P.map(p=>[p.n,p.s,p.a,p.r,GP.findIndex(g=>g.includes(p))+1].join(",")).join("\n")]));a.download="营会分房分组.csv";a.click()};ls.oninput();if(P.length)run();</script></html>
