<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵修日记 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>灵修日记</h1></header><main><style>.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{padding:8px 0;border-radius:8px;cursor:pointer;font-size:14px;position:relative}.cal .h{cursor:default;color:#999;font-size:12px}.cal .has{background:#f3d9c4}.cal .sel{outline:2px solid #b98a62}.cal .td{font-weight:700;color:#b98a62}</style>
<div class=panel><div class=row style="justify-content:space-between"><button class=alt id=pv>‹</button><b id=ym></b><button class=alt id=nx>›</button></div><div class=cal id=cal style="margin-top:8px"></div><p id=st style="color:#7a706a;font-size:13px;margin-bottom:0"></p></div>
<div class=panel><h3 id=dt style="margin-top:0"></h3><div class=row>心情 <span id=md></span></div><label>📖 今日经文</label><input id=sc style="width:100%" placeholder="如：诗篇 23:1"><label>💡 领受 / 默想</label><textarea id=tx></textarea><label>🙏 祷告 / 感恩</label><textarea id=pr style="min-height:70px"></textarea><label>✅ 今日行动</label><input id=ac style="width:100%">
<div class=row style="margin-top:10px"><span id=sv style="color:#8fc79a"></span><span style="flex:1"></span><input id=q placeholder="🔍 搜全部笔记" style="width:150px"><button class=alt id=ex>导出 TXT</button><button class=alt id=ej>备份 JSON</button><label class=alt style="margin:0;padding:9px 12px;background:#eee4da;border-radius:10px;cursor:pointer">恢复<input type=file id=im accept=".json" hidden></label></div><div id=rs></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="journal");r.unshift("journal");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let J=JSON.parse(localStorage.journal||"{}"),V=new Date();const k=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);let SEL=k(new Date());const M=["😀","🙂","😐","😔","😭","🙏"];
const cal=()=>{const y=V.getFullYear(),m=V.getMonth();ym.textContent=`${y}年${m+1}月`;const f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),td=k(new Date());let h="日一二三四五六".split("").map(x=>`<div class=h>${x}</div>`).join("")+"<div></div>".repeat(f);
for(let d=1;d<=n;d++){const kk=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,e=J[kk];h+=`<div data-d=${kk} class="${e?"has":""} ${kk==SEL?"sel":""} ${kk==td?"td":""}">${d}${e&&e.m!=null?`<div style="font-size:11px">${M[e.m]}</div>`:""}</div>`}cal.innerHTML=h;
const ks=Object.keys(J).sort();let s=0;for(let d=new Date();J[k(d)];d.setDate(d.getDate()-1))s++;st.textContent=`共 ${ks.length} 篇灵修笔记 · 连续 ${s} 天 🔥`};
const load=()=>{const e=J[SEL]||{};dt.textContent="📝 "+SEL;sc.value=e.s||"";tx.value=e.t||"";pr.value=e.p||"";ac.value=e.a||"";md.innerHTML=M.map((x,i)=>`<button class=alt data-m=${i} style="${e.m==i?"background:#f3d9c4;":""}font-size:20px;padding:4px 8px">${x}</button>`).join("");cal()};
const save=()=>{const e={...(J[SEL]||{}),s:sc.value,t:tx.value,p:pr.value,a:ac.value};if(!e.s&&!e.t&&!e.p&&!e.a&&e.m==null)delete J[SEL];else J[SEL]=e;localStorage.journal=JSON.stringify(J);sv.textContent="✓ 已自动保存";cal()};
[sc,tx,pr,ac].forEach(x=>x.oninput=save);md.onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;J[SEL]={...(J[SEL]||{}),m:+b.dataset.m};save();load()};
cal.onclick=e=>{const c=e.target.closest("[data-d]");if(c){SEL=c.dataset.d;load()}};pv.onclick=()=>{V.setMonth(V.getMonth()-1);cal()};nx.onclick=()=>{V.setMonth(V.getMonth()+1);cal()};
q.oninput=()=>{const s=q.value.trim();rs.innerHTML=s?Object.entries(J).filter(([d,e])=>JSON.stringify(e).includes(s)).sort().reverse().map(([d,e])=>`<div class=panel style="cursor:pointer;margin:8px 0" onclick="SEL='${d}';V=new Date('${d}');load()"><b>${d}</b> ${e.s||""}<div style="color:#888">${(e.t||e.p||"").slice(0,60)}</div></div>`).join("")||"<p>没有找到</p>":""};
const dl=(t,n)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()};
ex.onclick=()=>dl(Object.keys(J).sort().map(d=>{const e=J[d];return`【${d}】${e.m!=null?M[e.m]:""}\n经文：${e.s||""}\n领受：${e.t||""}\n祷告：${e.p||""}\n行动：${e.a||""}\n`}).join("\n"),"灵修笔记.txt");ej.onclick=()=>dl(JSON.stringify(J),"灵修笔记备份.json");
im.onchange=()=>{const r=new FileReader();r.onload=()=>{try{J={...J,...JSON.parse(r.result)};localStorage.journal=JSON.stringify(J);load()}catch(e){alert("文件格式不对")}};r.readAsText(im.files[0])};load();</script></html>
