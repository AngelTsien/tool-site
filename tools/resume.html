<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>简历生成</h1></header><main><style>#cv{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 10px #0001;line-height:1.6}#cv h1{margin:0}#cv h2{font-size:17px;border-bottom:2px solid var(--a);color:var(--a);padding-bottom:3px;margin:18px 0 8px}.it{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.it b{flex:1}
@media print{header,footer,.np{display:none!important}main{padding:0}#cv{box-shadow:none;padding:0}}</style>
<div class="panel np"><div class=row><input id=n placeholder="姓名" style="flex:1"><input id=t placeholder="求职意向" style="flex:1"></div><div class=row style="margin-top:8px"><input id=c placeholder="电话 · 邮箱 · 城市" style="flex:1"><input id=ph type=file accept="image/*" style="width:200px"></div>
<label>个人简介</label><textarea id=s style="min-height:60px"></textarea>
<label>工作经历（每段一行：时间 | 单位 | 职位 | 描述）</label><textarea id=w style="min-height:80px"></textarea>
<label>教育经历（时间 | 学校 | 专业）</label><textarea id=e style="min-height:50px"></textarea>
<label>技能/证书（用逗号分隔）</label><input id=k style="width:100%"><div class=row style="margin-top:10px">主题色<input type=color id=col value="#8a5a3a" style="padding:0;width:50px;height:38px"><select id=lay><option value=1>经典单栏</option><option value=2>左右双栏</option></select><button onclick="print()">🖨 打印 / 存 PDF</button><button class=alt id=dm>填入示例</button></div></div><div id=cv></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="resume");r.unshift("resume");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const F=["n","t","c","s","w","e","k"],S=JSON.parse(localStorage.resume||"{}");let img=S.img||"";F.forEach(i=>{const x=document.getElementById(i);x.value=S[i]||"";x.oninput=go});col.value=S.col||"#8a5a3a";lay.value=S.lay||"1";col.oninput=lay.onchange=go;
const h=x=>x.replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"})[m]),ln=v=>v.split("\n").filter(x=>x.trim()).map(x=>x.split("|").map(y=>h(y.trim())));
function go(){const o={img,col:col.value,lay:lay.value};F.forEach(i=>o[i]=document.getElementById(i).value);localStorage.resume=JSON.stringify(o);cv.style.setProperty("--a",col.value);
const W=ln(w.value).map(a=>`<div class=it><b>${a[1]||""} · ${a[2]||""}</b><span style="color:#888">${a[0]}</span></div><div style="margin-bottom:8px">${a[3]||""}</div>`).join(""),E=ln(e.value).map(a=>`<div class=it><b>${a[1]||""}　${a[2]||""}</b><span style="color:#888">${a[0]}</span></div>`).join(""),K=k.value.split(/[,，、]/).filter(x=>x.trim()).map(x=>`<span class=tag style="background:${col.value}22;color:${col.value}">${h(x.trim())}</span> `).join("");
const hd=`<div style="display:flex;gap:16px;align-items:center">${img?`<img src="${img}" style="width:90px;height:120px;object-fit:cover;border-radius:6px">`:""}<div><h1 style="color:${col.value}">${h(n.value)||"你的名字"}</h1><div>${h(t.value)}</div><div style="color:#777">${h(c.value)}</div></div></div>`;
cv.innerHTML=lay.value=="1"?hd+(s.value?`<h2>个人简介</h2><p>${h(s.value)}</p>`:"")+(W?"<h2>工作经历</h2>"+W:"")+(E?"<h2>教育经历</h2>"+E:"")+(K?"<h2>技能证书</h2>"+K:""):
`${hd}<div style="display:flex;gap:20px;flex-wrap:wrap"><div style="flex:1;min-width:160px">${s.value?`<h2>简介</h2><p>${h(s.value)}</p>`:""}${K?"<h2>技能</h2>"+K:""}${E?"<h2>教育</h2>"+E:""}</div><div style="flex:2;min-width:220px">${W?"<h2>工作经历</h2>"+W:""}</div></div>`}
ph.onchange=()=>{const f=ph.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=180;c.height=240;const s=Math.max(180/i.width,240/i.height);c.getContext("2d").drawImage(i,(180-i.width*s)/2,(240-i.height*s)/2,i.width*s,i.height*s);img=c.toDataURL("image/jpeg",.85);go()};i.src=r.result};r.readAsDataURL(f)};
dm.onclick=()=>{n.value="张恩典";t.value="行政主管";c.value="138-0000-0000 · grace@example.com · 罗马";s.value="细心负责，擅长统筹活动与团队沟通。";w.value="2020-至今 | 某某公司 | 行政主管 | 负责年度活动策划，带领 5 人团队\n2016-2020 | 某某机构 | 行政助理 | 文件管理与接待";e.value="2012-2016 | 某某大学 | 工商管理";k.value="Office, 意大利语 B2, 驾照";go()};go();</script></html>
