<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消消乐 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>消消乐</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><span>得分 <b id=sc>0</b></span><span>剩余步数 <b id=mv>20</b></span><span>目标 <b>1000</b></span><span>最高 <b id=hi></b></span><button id=ng>新游戏</button></div>
<div id=bd style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:min(calc(100vw - 64px),400px);margin:14px auto;touch-action:none;user-select:none"></div><p id=ms style="font-size:20px;color:#b98a62;min-height:28px"></p><p style="font-size:13px;color:#a99">点一个宝石，再点相邻的交换；或直接滑动</p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="match3");r.unshift("match3");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const N=8,E="💎🍎🍋🍇🌸🍀";let G,S,M,sel=null,busy=false;hi.textContent=localStorage.m3||0;const rnd=()=>Math.random()*6|0;
const find=()=>{const m=new Set;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=G[r*N+c];if(v<0)continue;if(c<N-2&&G[r*N+c+1]==v&&G[r*N+c+2]==v){let k=c;while(k<N&&G[r*N+k]==v)m.add(r*N+k++)}if(r<N-2&&G[(r+1)*N+c]==v&&G[(r+2)*N+c]==v){let k=r;while(k<N&&G[k*N+c]==v)m.add(k++*N+c)}}return m};
const drop=()=>{for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(G[r*N+c]>=0)col.push(G[r*N+c]);for(let r=N-1,k=0;r>=0;r--,k++)G[r*N+c]=k<col.length?col[k]:rnd()}};
const rd=(hl=new Set)=>{bd.innerHTML=G.map((v,i)=>`<div data-i=${i} style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(7vw,30px);border-radius:10px;cursor:pointer;background:${sel==i?"#f6c9b4":hl.has(i)?"#fff6c8":"#faf6f1"};transition:transform .15s;${hl.has(i)?"transform:scale(.6)":""}">${v>=0?E[v]:""}</div>`).join("");sc.textContent=S;mv.textContent=M};
const resolve=async(combo=1)=>{const m=find();if(!m.size)return;rd(m);await new Promise(r=>setTimeout(r,220));S+=m.size*10*combo;m.forEach(i=>G[i]=-1);drop();rd();if(combo>1)ms.textContent=`连击 ×${combo}!`;await new Promise(r=>setTimeout(r,180));await resolve(combo+1)};
const swap=async(a,b)=>{if(busy||M<=0)return;const ra=a/N|0,rb=b/N|0;if(!((ra==rb&&Math.abs(a-b)==1)||Math.abs(a-b)==N))return;busy=true;sel=null;[G[a],G[b]]=[G[b],G[a]];rd();await new Promise(r=>setTimeout(r,150));
if(!find().size){[G[a],G[b]]=[G[b],G[a]];rd();busy=false;return}M--;ms.textContent="";await resolve();busy=false;if(S>=1000&&!ms.textContent.includes("🎉"))ms.textContent="🎉 达成目标！继续冲高分";if(M<=0){ms.textContent=S>=1000?`🎉 过关！得分 ${S}`:`步数用完，得分 ${S}`;if(S>(+localStorage.m3||0))localStorage.m3=S;hi.textContent=localStorage.m3}};
let st=null;bd.onpointerdown=e=>{const t=e.target.closest("[data-i]");if(!t)return;st=[+t.dataset.i,e.clientX,e.clientY]};bd.onpointerup=e=>{if(!st)return;const[i,x0,y0]=st;st=null;const dx=e.clientX-x0,dy=e.clientY-y0;
if(Math.max(Math.abs(dx),Math.abs(dy))>15){const j=Math.abs(dx)>Math.abs(dy)?i+(dx>0?1:-1):i+(dy>0?N:-N);if(j>=0&&j<N*N)swap(i,j);return}if(sel==null){sel=i;rd()}else if(sel==i){sel=null;rd()}else{const s=sel;sel=null;swap(s,i)}};
const ng0=()=>{do{G=Array.from({length:N*N},rnd)}while(find().size);S=0;M=20;sel=null;ms.textContent="";rd()};ng.onclick=ng0;ng0();window.__G=()=>({G,S,M});window.__swap=swap;window.__find=find</script></html>
