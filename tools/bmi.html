<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI 计算 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>BMI 计算</h1></header><main><div class=panel><div class=row><div><label>身高（cm）</label><input id=h type=number value=170></div><div><label>体重（kg）</label><input id=w type=number value=65></div></div></div><div class=panel style="text-align:center"><div id=v style="font-size:64px;font-weight:700"></div><div id=t style="font-size:20px"></div><p id=n style="color:#7a706a"></p>
<div style="height:14px;border-radius:7px;background:linear-gradient(90deg,#8fb8de 0 25%,#8fc79a 25% 50%,#e8c26a 50% 72%,#e08a7a 72%);position:relative"><div id=k style="position:absolute;top:-6px;width:4px;height:26px;background:#3a3330;transition:.3s"></div></div><p style="font-size:12px;color:#a99">中国成人标准：&lt;18.5 偏瘦｜18.5–23.9 正常｜24–27.9 超重｜≥28 肥胖</p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="bmi");r.unshift("bmi");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const f=()=>{const m=h.value/100,b=w.value/m/m,c=b<18.5?["偏瘦","#5a8fc0"]:b<24?["正常","#4a9a5a"]:b<28?["超重","#c09a2a"]:["肥胖","#c05a4a"];v.textContent=b.toFixed(1);v.style.color=t.style.color=c[1];t.textContent=c[0];
n.textContent=`正常体重范围：${(18.5*m*m).toFixed(1)} – ${(23.9*m*m).toFixed(1)} kg`;k.style.left=Math.min(98,Math.max(0,(b-14)/(36-14)*100))+"%"};h.oninput=w.oninput=f;f()</script></html>
