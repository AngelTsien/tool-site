<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节日倒数日历 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>节日倒数日历</h1></header><main><div class=panel><div class=row><label><input type=checkbox id=f1 checked> 教会节期</label><label><input type=checkbox id=f2 checked> 中国传统</label><label><input type=checkbox id=f3 checked> 公众节日</label><label><input type=checkbox id=f4 checked> 意大利</label></div></div><div id=hero class=panel style="text-align:center;background:linear-gradient(135deg,#fde8d8,#e6f0e2)"></div><div id=ls class=grid></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/lunar.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="festivals");r.unshift("festivals");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const easter=y=>{const a=y%19,b=y/100|0,c=y%100,d=b/4|0,e=b%4,f=(b+8)/25|0,g=(b-f+1)/3|0,h=(19*a+b-d-g+15)%30,i=c/4|0,k=c%4,l=(32+2*e+2*i-h-k)%7,m=(a+11*h+22*l)/451|0,mo=(h+l-7*m+114)/31|0,da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},lun=(y,m,d)=>{try{const s=Lunar.fromYmd(y,m,d).getSolar();return new Date(s.getYear(),s.getMonth()-1,s.getDay())}catch(e){return null}};
const adv=y=>{const c=new Date(y,11,25);return add(c,-((c.getDay()||7))-21)};const list=y=>{const E=easter(y);return[[1,"🕯️ 将临期第一主日",adv(y)],[1,"🎄 圣诞节",new Date(y,11,25)],[1,"⭐ 主显节",new Date(y,0,6)],[1,"✝️ 圣灰日（大斋期开始）",add(E,-46)],[1,"🌿 棕枝主日",add(E,-7)],[1,"🍞 濯足节",add(E,-3)],[1,"✝️ 受难日",add(E,-2)],[1,"🌅 复活节",E],[1,"☁️ 耶稣升天节",add(E,39)],[1,"🔥 五旬节/圣灵降临",add(E,49)],[1,"🍂 宗教改革纪念日",new Date(y,9,31)],
[2,"🧧 春节",lun(y,1,1)],[2,"🏮 元宵节",lun(y,1,15)],[2,"🌿 清明节",(()=>{try{const s=Solar.fromYmd(y,4,10).getLunar().getJieQiTable()["清明"];return new Date(s.getYear(),s.getMonth()-1,s.getDay())}catch(e){return new Date(y,3,5)}})()],[2,"🐉 端午节",lun(y,5,5)],[2,"💞 七夕",lun(y,7,7)],[2,"🥮 中秋节",lun(y,8,15)],[2,"🌼 重阳节",lun(y,9,9)],
[3,"🎉 元旦",new Date(y,0,1)],[3,"💝 情人节",new Date(y,1,14)],[3,"👩 母亲节",(()=>{const d=new Date(y,4,1);return add(d,(7-d.getDay())%7+7)})()],[3,"👨 父亲节",(()=>{const d=new Date(y,5,1);return add(d,(7-d.getDay())%7+14)})()],[3,"🧒 儿童节",new Date(y,5,1)],[3,"🦃 感恩节(美)",(()=>{const d=new Date(y,10,1);return add(d,(4-d.getDay()+7)%7+21)})()],[3,"🇨🇳 国庆节",new Date(y,9,1)],
[4,"🇮🇹 解放日",new Date(y,3,25)],[4,"🇮🇹 共和国日",new Date(y,5,2)],[4,"☀️ 八月节 Ferragosto",new Date(y,7,15)],[4,"🕯️ 诸圣节",new Date(y,10,1)],[4,"🎁 主显节 Befana",new Date(y,0,6)]].filter(x=>x[2])};
const rd=()=>{const T=new Date();T.setHours(0,0,0,0);const on=[f1,f2,f3,f4].map(x=>x.checked);let A=[...list(T.getFullYear()),...list(T.getFullYear()+1)].filter(x=>on[x[0]-1]).map(x=>[...x,Math.round((x[2]-T)/864e5)]).filter(x=>x[3]>=0).sort((a,b)=>a[3]-b[3]);const seen=new Set;A=A.filter(x=>!seen.has(x[1])&&seen.add(x[1]));
const W="日一二三四五六",h=A[0];hero.innerHTML=h?`<p>下一个节日</p><h2 style="margin:4px">${h[1]}</h2><div style="font-size:64px;font-weight:800;color:#b98a62">${h[3]||"今天"}</div><p>${h[3]?"天后 · ":""}${h[2].toLocaleDateString("zh-CN")} 周${W[h[2].getDay()]}</p>`:"";
ls.innerHTML=A.slice(1,30).map(x=>`<div class=card style="--c:${["","#f6c9b4","#f6d9a8","#b8cfe8","#b9dcc8"][x[0]]}"><h3 style="margin:0">${x[1]}</h3><p>${x[2].getMonth()+1}月${x[2].getDate()}日 周${W[x[2].getDay()]}</p><div style="font-size:26px;font-weight:700;color:#b98a62">${x[3]} 天</div></div>`).join("")};[f1,f2,f3,f4].forEach(e=>e.onchange=rd);rd();window.__e=easter</script></html>
