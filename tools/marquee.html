<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机举牌字幕 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>手机举牌字幕</h1></header><main><div class=panel id=ctl><input id=tx value="欢迎来到主日崇拜 🙏 Welcome!" style="width:100%;font-size:20px"><div class=row style="margin-top:8px">
<select id=pr><option value="">快捷文字…</option><option>🎉 生日快乐！</option><option>接机：王弟兄</option><option>请保持安静 🤫</option><option>以马内利 ✝️</option><option>加油！你最棒！💪</option></select>
<label style="margin:0">字色</label><input type=color id=fg value="#ffe066" style="padding:0;width:44px;height:38px"><label style="margin:0">背景</label><input type=color id=bg value="#000000" style="padding:0;width:44px;height:38px"></div>
<div class=row style="margin-top:8px"><label style="margin:0">速度</label><input type=range id=sp min=0 max=20 value=6><label style="margin:0">大小</label><input type=range id=sz min=20 max=90 value=60><select id=fx><option value="">无特效</option><option value=bl>闪烁</option><option value=rb>彩虹</option><option value=gl>霓虹发光</option></select><select id=dr><option value=1>← 向左</option><option value=-1>→ 向右</option></select></div>
<div class=row style="margin-top:10px"><button id=go style="font-size:20px">▶ 全屏举牌</button><span style="color:#7a706a;font-size:13px">横屏效果最好，点击屏幕退出</span></div></div>
<div id=st style="height:180px;border-radius:16px;overflow:hidden;position:relative;background:#000;cursor:pointer"><div id=mv style="position:absolute;white-space:nowrap;top:50%;font-weight:900;will-change:transform"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="marquee");r.unshift("marquee");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let X=0,full=0,h=0;const S=JSON.parse(localStorage.marquee||"{}");Object.entries(S).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v});
const sv=()=>localStorage.marquee=JSON.stringify({tx:tx.value,fg:fg.value,bg:bg.value,sp:sp.value,sz:sz.value,fx:fx.value,dr:dr.value});
const ap=()=>{sv();st.style.background=bg.value;mv.textContent=tx.value;const H=st.clientHeight;mv.style.fontSize=H*sz.value/100+"px";mv.style.color=fg.value;mv.style.textShadow=fx.value=="gl"?`0 0 10px ${fg.value},0 0 30px ${fg.value}`:"";mv.style.transform=`translate(${X}px,-50%)`};
[tx,fg,bg,sp,sz,fx,dr].forEach(e=>e.oninput=e.onchange=ap);pr.onchange=()=>{if(pr.value){tx.value=pr.value;ap()}};
const loop=t=>{const W=st.clientWidth,w=mv.offsetWidth,d=+dr.value,v=+sp.value;if(v==0)X=(W-w)/2;else{X-=d*v*W/600;if(d>0&&X<-w)X=W;if(d<0&&X>W)X=-w}mv.style.transform=`translate(${X}px,-50%)`;
if(fx.value=="bl")mv.style.opacity=Math.sin(t/150)>0?1:.15;else mv.style.opacity=1;if(fx.value=="rb")mv.style.color=`hsl(${t/8%360} 90% 60%)`;requestAnimationFrame(loop)};requestAnimationFrame(loop);
const fs=on=>{full=on;Object.assign(st.style,on?{position:"fixed",inset:0,height:"100vh",width:"100vw",zIndex:99,borderRadius:0}:{position:"relative",inset:"",height:"180px",width:"",zIndex:"",borderRadius:"16px"});if(on){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})}else document.fullscreenElement&&document.exitFullscreen();setTimeout(ap,100)};
go.onclick=()=>fs(1);st.onclick=()=>full&&fs(0);document.onfullscreenchange=()=>{if(!document.fullscreenElement&&full)fs(0)};addEventListener("resize",ap);ap();</script></html>
