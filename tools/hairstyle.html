<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发型试换 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>发型试换</h1></header><main><div class=panel><p>上传一张自拍，选一个发型。<span class=tag>需要 API 密钥</span>（未配置时为演示模式，返回原图）</p>
<input type=file id=photo accept="image/*"><div class=row id=chips style="margin:10px 0"></div>
<label>或自己描述</label><input id=custom placeholder="例如：齐肩锁骨发，微卷" style="width:100%"><label>发色（可选）</label><input id=color placeholder="例如：栗棕色">
<p><button id=go>开始换发型</button> <span id=msg></span></p></div>
<div class="panel row"><div style="flex:1;min-width:240px"><h3>原图</h3><img id=before></div><div style="flex:1;min-width:240px"><h3>效果</h3><img id=after></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="hairstyle");r.unshift("hairstyle");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let style="";["短发","波波头","长卷发","大背头","寸头","刘海"].forEach(s=>{const b=document.createElement("button");b.className="alt";b.textContent=s;b.onclick=()=>{style=s;[...chips.children].forEach(x=>x.className="alt");b.className=""};chips.appendChild(b)});
photo.onchange=()=>before.src=URL.createObjectURL(photo.files[0]);
go.onclick=async()=>{if(!photo.files[0])return msg.textContent="请先上传照片";const fd=new FormData();fd.append("photo",photo.files[0]);fd.append("style",style);fd.append("custom",custom.value);fd.append("color",color.value);
msg.textContent="生成中…";const j=await(await fetch("/api/edit",{method:"POST",body:fd})).json();if(j.error)return msg.textContent=j.error;after.src=j.image;msg.textContent=j.backend=="mock"?"演示模式：未配置 API 密钥，返回原图":"完成";}</script></html>
