<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钢琴键盘/简谱 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>钢琴键盘/简谱</h1></header><main><div class=panel><div class=row><label>音色</label><select id=wv><option value=piano>钢琴</option><option value=sine>柔和</option><option value=square>8-bit</option></select><label>音量</label><input type=range id=vol min=0 max=1 step=.05 value=.5><label><input type=checkbox id=lb checked> 显示简谱/音名</label></div>
<div id=kb style="position:relative;height:200px;margin-top:14px;user-select:none;touch-action:none;overflow-x:auto"></div><p style="font-size:13px;color:#a99">电脑键盘：A S D F G H J K = 1 2 3 4 5 6 7 i（W E T Y U 为黑键）</p></div>
<div class=panel><h3>🎼 简谱播放</h3><p style="font-size:13px;color:#a99">数字 1–7，高音加 '（如 1'），低音加 ,（如 5,），- 延长一拍，_ 结尾表示半拍，空格分隔</p><textarea id=sc style="min-height:80px;font-family:monospace">1 1 5 5 6 6 5 - 4 4 3 3 2 2 1 - 5 5 4 4 3 3 2 - 5 5 4 4 3 3 2 - 1 1 5 5 6 6 5 - 4 4 3 3 2 2 1 -</textarea>
<div class=row><label>调</label><select id=ky></select><label>速度</label><input id=bpm type=number value=100 style="width:70px"><button id=pl>▶ 播放</button><button class=alt id=stp>⏹ 停止</button><select id=sg><option value="">示例曲目</option><option value="1 1 5 5 6 6 5 - 4 4 3 3 2 2 1 -">小星星</option><option value="5, 1 3 3 3 - 2 1 2 3 1 - 1 3 5 5 5 - 6 5 3 1 2 -">奇异恩典</option><option value="3 3 4 5 5 4 3 2 1 1 2 3 3 - 2_ 2 -">欢乐颂</option></select></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="piano");r.unshift("piano");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let A;const ac=()=>A=A||new AudioContext();const KEYS=["C","D","E","F","G","A","B"],JP="1234567";let held={};
const play=(f,dur=1.2)=>{const a=ac(),t=a.currentTime,g=a.createGain();g.connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(+vol.value,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
const types=wv.value=="piano"?[["triangle",1,1],["sine",2,.3],["sine",3,.1]]:[[wv.value,1,1]];types.forEach(([ty,m,v])=>{const o=a.createOscillator(),og=a.createGain();o.type=ty;o.frequency.value=f*m;og.gain.value=v*(wv.value=="square"?.3:1);o.connect(og).connect(g);o.start(t);o.stop(t+dur)})};
const freq=midi=>440*Math.pow(2,(midi-69)/12);const W=[0,2,4,5,7,9,11];let kmap={};const build=()=>{const oct=[3,4,5],ww=100/(oct.length*7);let h="";oct.forEach((o,oi)=>W.forEach((s,i)=>{const m=12*(o+1)+s,ix=oi*7+i;h+=`<div data-m=${m} style="position:absolute;left:${ix*ww}%;width:${ww}%;height:100%;background:linear-gradient(#fff,#f3efe9);border:1px solid #ccc;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:12px;color:#888;box-sizing:border-box">${lb.checked?`${JP[i]}${o==3?"̣":o==5?"̇":""}<br>${KEYS[i]}${o}`:""}</div>`;
if([0,1,3,4,5].includes(i))h+=`<div data-m=${m+1} style="position:absolute;left:${(ix+.68)*ww}%;width:${ww*.64}%;height:60%;background:linear-gradient(#333,#111);border-radius:0 0 5px 5px;z-index:2"></div>`}));kb.innerHTML=h};
const hit=m=>{play(freq(m));const k=kb.querySelector(`[data-m="${m}"]`);if(k){k.style.filter="brightness(.85)";k.style.transform="translateY(2px)";setTimeout(()=>{k.style.filter="";k.style.transform=""},180)}};
kb.onpointerdown=e=>{const k=e.target.closest("[data-m]");if(k)hit(+k.dataset.m)};const KM={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72};onkeydown=e=>{if(e.target.tagName=="TEXTAREA"||e.target.tagName=="INPUT"||e.repeat)return;const m=KM[e.key.toLowerCase()];if(m)hit(m)};
const KY=["C","D","E","F","G","A","B♭"],KO=[0,2,4,5,7,9,10];ky.innerHTML=KY.map((k,i)=>`<option value=${KO[i]}>1 = ${k}</option>`).join("");let tm=[];
const parse=s=>s.trim().split(/\s+/).map(t=>{if(t=="-")return{ext:1};const m=t.match(/^([0-7])([',]*)(_?)$/);if(!m)return null;const n=+m[1],oc=(m[2].match(/'/g)||[]).length-(m[2].match(/,/g)||[]).length;return{n,oc,b:m[3]?.5:1}}).filter(Boolean);
pl.onclick=()=>{stp.click();const N=parse(sc.value),beat=60/(+bpm.value||100);let t=0;const ev=[];N.forEach(x=>{if(x.ext){if(ev.length)ev[ev.length-1].d+=beat;t+=beat;return}ev.push({x,t,d:beat*x.b});t+=beat*x.b});
ev.forEach(({x,t,d})=>{if(!x.n)return;const m=60+ +ky.value+W[x.n-1]+12*x.oc;tm.push(setTimeout(()=>{play(freq(m),Math.max(.3,d*1.1));const k=kb.querySelector(`[data-m="${m}"]`);if(k){k.style.background="#f6c9b4";setTimeout(()=>k.style.background="",d*900)}},t*1000))});window.__ev=ev.length};
stp.onclick=()=>{tm.forEach(clearTimeout);tm=[]};sg.onchange=()=>{if(sg.value)sc.value=sg.value};lb.onchange=build;build();window.__parse=parse</script></html>
