<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事奉排班表 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>事奉排班表</h1></header><main><div class=panel><label>岗位（逗号分隔）</label><input id=ro value="敬拜带领,司琴,音控,招待,儿童主日学" style="width:100%"><label>同工名单（逗号或换行）</label><textarea id=pp style="min-height:70px">小明,小红,小华,小李,小张,小王,小陈,小刘</textarea>
<div class=row><div><label>第一次日期</label><input type=date id=st></div><div><label>间隔（天）</label><input id=iv type=number value=7 style="width:80px"></div><div><label>次数</label><input id=n type=number value=8 style="width:80px"></div><div><label>不可服事（姓名:日期,…）</label><input id=ex placeholder="小明:2026-11-08"></div></div>
<p class=row><button id=go>生成排班</button><button class=alt id=sf>🔀 打乱顺序</button><button class=alt onclick="print()">打印</button><button class=alt id=cv>下载 CSV</button></p></div><div class=panel style="overflow:auto"><table id=tb style="border-collapse:collapse;width:100%;font-size:14px"></table><div id=cnt style="margin-top:10px;color:#7a706a;font-size:13px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="rota");r.unshift("rota");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let ord=null,G=[];const d0=new Date();d0.setDate(d0.getDate()+(7-d0.getDay())%7);st.valueAsDate=d0;const sp=s=>s.split(/[,，、\n]+/).map(x=>x.trim()).filter(Boolean);
const run=()=>{const R=sp(ro.value),P=ord||sp(pp.value),X=new Set(sp(ex.value)),C=Object.fromEntries(P.map(p=>[p,0]));let k=0;G=[];
for(let i=0;i<+n.value;i++){const d=new Date(st.value);d.setDate(d.getDate()+i*iv.value);const ds=d.toISOString().slice(0,10),used=new Set(),row=[ds];
R.forEach(()=>{const cand=P.filter(p=>!used.has(p)&&!X.has(p+":"+ds)).sort((a,b)=>C[a]-C[b]||((P.indexOf(a)-k+P.length)%P.length)-((P.indexOf(b)-k+P.length)%P.length));const p=cand[0]||"（缺人）";if(cand[0]){used.add(p);C[p]++}row.push(p)});k=(k+R.length)%Math.max(1,P.length);G.push(row)}
tb.innerHTML="<tr>"+["日期",...R].map(h=>`<th style="background:#e3eee5;padding:8px;border:1px solid #eee">${h}</th>`).join("")+"</tr>"+G.map(r=>"<tr>"+r.map(c=>`<td style="padding:8px;border:1px solid #eee;text-align:center">${c}</td>`).join("")+"</tr>").join("");cnt.textContent="服事次数："+Object.entries(C).map(([a,b])=>a+" "+b).join("，")};
go.onclick=()=>{ord=null;run()};sf.onclick=()=>{ord=sp(pp.value).sort(()=>Math.random()-.5);run()};[ro,pp,st,iv,n,ex].forEach(e=>e.onchange=run);
cv.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+["日期",...sp(ro.value)].join(",")+"\n"+G.map(r=>r.join(",")).join("\n")]));a.download="排班表.csv";a.click()};run()</script></html>
