<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸运大转盘 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>幸运大转盘</h1></header><main><div class=panel><label>选项（每行一个）</label><textarea id=t style="min-height:90px">一等奖

小礼物</textarea></div><div class=panel style="text-align:center"><div style="position:relative;width:min(86vw,380px);margin:auto"><canvas id=c width=760 height=760 style="width:100%;transition:transform 4s cubic-bezier(.17,.67,.2,1)"></canvas><div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:34px">🔻</div></div><p><button id=go style="font-size:20px;padding:12px 40px">开始转动</button></p><p id=res style="font-size:26px;color:#b98a62;min-height:34px"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="wheel");r.unshift("wheel");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const CL=["#f6c9b4","#b9dcc8","#d2c2e6","#b8cfe8","#f3d9c4","#e9dcc6","#f2b179","#9cc5a8"];let rot=0,I=[];const dw=()=>{I=t.value.split("\n").map(s=>s.trim()).filter(Boolean);const x=c.getContext("2d"),n=I.length,a=2*Math.PI/n;x.clearRect(0,0,760,760);
I.forEach((s,i)=>{x.beginPath();x.moveTo(380,380);x.arc(380,380,370,i*a-Math.PI/2,(i+1)*a-Math.PI/2);x.fillStyle=CL[i%CL.length];x.fill();x.strokeStyle="#fff";x.lineWidth=4;x.stroke();x.save();x.translate(380,380);x.rotate((i+.5)*a-Math.PI/2);x.fillStyle="#4a3a30";x.font="bold 34px sans-serif";x.textAlign="right";x.fillText(s.slice(0,8),340,12);x.restore()});
x.beginPath();x.arc(380,380,40,0,7);x.fillStyle="#fff";x.fill()};t.oninput=dw;dw();
go.onclick=()=>{const n=I.length,w=Math.random()*n|0;rot+=360*6+(360-(w+.5)*360/n-rot%360);c.style.transform=`rotate(${rot}deg)`;res.textContent="";go.disabled=true;setTimeout(()=>{res.textContent="🎉 "+I[w];go.disabled=false},4100)}</script></html>
