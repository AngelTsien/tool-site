<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节拍器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>节拍器</h1></header><main><div class=panel style="text-align:center"><div id=bpm style="font-size:72px;font-weight:700;color:#b98a62">90</div><div>BPM <span id=nm style="color:#a99"></span></div><input type=range id=r min=30 max=240 value=90 style="width:100%;margin:14px 0">
<div class=row style="justify-content:center"><button class=alt id=m5>−5</button><button class=alt id=m1>−1</button><button id=go style="font-size:20px;padding:12px 34px">▶ 开始</button><button class=alt id=p1>+1</button><button class=alt id=p5>+5</button></div>
<div class=row style="justify-content:center;margin-top:12px"><label>拍号</label><select id=bt><option>2</option><option>3</option><option selected>4</option><option>6</option></select><button class=alt id=tap>👆 点击测速</button></div><div id=dots class=row style="justify-content:center;margin-top:18px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="metronome");r.unshift("metronome");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let A,on=false,nx=0,b=0,tm,taps=[];const N=v=>v<60?"慢板 Largo":v<76?"柔板 Adagio":v<108?"行板 Andante":v<120?"中板 Moderato":v<168?"快板 Allegro":"急板 Presto";
const set=v=>{r.value=Math.max(30,Math.min(240,v));bpm.textContent=r.value;nm.textContent=N(+r.value)};const dd=()=>{dots.innerHTML=Array.from({length:+bt.value},(_,i)=>`<div style="width:28px;height:28px;border-radius:50%;background:#eee4da;transition:.08s" id=d${i}></div>`).join("")};
const click=(t,acc)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);o.connect(g).connect(A.destination);o.start(t);o.stop(t+.06)};
const sch=()=>{while(nx<A.currentTime+.1){const i=b%+bt.value;click(nx,i==0);setTimeout(()=>{dots.querySelectorAll("div").forEach((d,j)=>d.style.background=j==i?(i?"#8fae9a":"#e07a5f"):"#eee4da")},(nx-A.currentTime)*1000);b++;nx+=60/r.value}};
go.onclick=()=>{A=A||new AudioContext();on=!on;if(on){b=0;nx=A.currentTime+.05;tm=setInterval(sch,25);go.textContent="⏸ 停止"}else{clearInterval(tm);go.textContent="▶ 开始"}};
r.oninput=()=>set(+r.value);m5.onclick=()=>set(+r.value-5);m1.onclick=()=>set(+r.value-1);p1.onclick=()=>set(+r.value+1);p5.onclick=()=>set(+r.value+5);bt.onchange=dd;
tap.onclick=()=>{const t=Date.now();taps=taps.filter(x=>t-x<3000);taps.push(t);if(taps.length>1)set(Math.round(60000/((t-taps[0])/(taps.length-1))))};onkeydown=e=>{if(e.code=="Space"){e.preventDefault();go.click()}};set(90);dd()</script></html>
