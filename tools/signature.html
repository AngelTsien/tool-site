<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电子签名 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>电子签名</h1></header><main><div class=panel><div class=row><span id=pal class=row></span><label>粗细</label><input type=range id=w min=1 max=10 value=3><button class=alt id=un>↶ 撤销</button><button class=alt id=cl>清空</button><label><input type=checkbox id=bgw> 白底</label><button id=dl>下载 PNG</button></div>
<canvas id=c style="width:100%;height:240px;background:repeating-conic-gradient(#f3f3f3 0 25%,#fff 0 50%) 0 0/20px 20px;border-radius:12px;touch-action:none;margin-top:10px;border:2px dashed #d9c3a8;cursor:crosshair"></canvas><p style="text-align:center;color:#a99;font-size:13px">在虚线框内签名 · 导出时自动裁掉空白</p></div><div class=panel style="text-align:center"><img id=pv style="max-width:100%;max-height:120px"></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="signature");r.unshift("signature");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const x=c.getContext("2d");let S=[],cur=null,col="#1a1a2e";const fit=()=>{const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;dr()};
pal.innerHTML=["#1a1a2e","#1e40af","#b91c1c"].map(k=>`<button style="width:28px;height:28px;padding:0;border-radius:50%;background:${k}" data-c="${k}"></button>`).join("");pal.onclick=e=>{if(e.target.dataset.c)col=e.target.dataset.c};
const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*devicePixelRatio,(e.clientY-r.top)*devicePixelRatio,e.pressure||.5]};
const stroke=(cx,s,k=1,ox=0,oy=0)=>{cx.strokeStyle=s.c;cx.lineCap=cx.lineJoin="round";for(let i=1;i<s.p.length;i++){const[a,b]=[s.p[i-1],s.p[i]],sp=Math.hypot(b[0]-a[0],b[1]-a[1]);cx.lineWidth=Math.max(.6,s.w*devicePixelRatio*(1.4-Math.min(.8,sp/40)))*k;cx.beginPath();cx.moveTo((a[0]-ox)*k,(a[1]-oy)*k);cx.quadraticCurveTo((a[0]-ox)*k,(a[1]-oy)*k,(b[0]-ox)*k,(b[1]-oy)*k);cx.stroke()}};
const dr=()=>{x.clearRect(0,0,c.width,c.height);S.forEach(s=>stroke(x,s));pv.src=S.length?out().toDataURL():""};
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);cur={c:col,w:+w.value,p:[P(e)]};S.push(cur)};c.onpointermove=e=>{if(cur){cur.p.push(P(e));x.clearRect(0,0,c.width,c.height);S.forEach(s=>stroke(x,s))}};c.onpointerup=()=>{cur=null;dr()};
const out=()=>{const all=S.flatMap(s=>s.p);if(!all.length)return c;const pad=20,X0=Math.min(...all.map(p=>p[0]))-pad,Y0=Math.min(...all.map(p=>p[1]))-pad,X1=Math.max(...all.map(p=>p[0]))+pad,Y1=Math.max(...all.map(p=>p[1]))+pad,o=document.createElement("canvas");o.width=X1-X0;o.height=Y1-Y0;const ox=o.getContext("2d");if(bgw.checked){ox.fillStyle="#fff";ox.fillRect(0,0,o.width,o.height)}S.forEach(s=>stroke(ox,s,1,X0,Y0));return o};
un.onclick=()=>{S.pop();dr()};cl.onclick=()=>{S=[];dr()};bgw.onchange=dr;dl.onclick=()=>{if(!S.length)return;const a=document.createElement("a");a.download="签名.png";a.href=out().toDataURL();a.click()};addEventListener("resize",fit);fit();window.__S=()=>S</script></html>
