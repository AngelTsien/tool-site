<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五子棋 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>五子棋</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=lv><option value=1>简单</option><option value=2 selected>普通</option></select><label><input type=checkbox id=af> 电脑先手</label><button id=ng>新局</button><button class=alt id=ud>悔棋</button></div><p id=ms style="font-size:20px;min-height:28px">你执黑 ⚫</p>
<canvas id=c width=600 height=600 style="width:min(92vw,480px);background:#e8c98f;border-radius:10px;touch-action:manipulation;box-shadow:0 4px 14px #0002"></canvas><p style="color:#a99">战绩：<span id=sc></span></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="gomoku");r.unshift("gomoku");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const N=15,Z=40;let B,H,over,me=1;const x=c.getContext("2d");const W=JSON.parse(localStorage.gmk||'{"w":0,"l":0}');
const dr=()=>{x.clearRect(0,0,600,600);x.strokeStyle="#7a5a30";for(let i=0;i<N;i++){x.beginPath();x.moveTo(20,20+i*Z);x.lineTo(580,20+i*Z);x.stroke();x.beginPath();x.moveTo(20+i*Z,20);x.lineTo(20+i*Z,580);x.stroke()}
[[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([a,b])=>{x.beginPath();x.arc(20+a*Z,20+b*Z,4,0,7);x.fillStyle="#7a5a30";x.fill()});B.forEach((r,i)=>r.forEach((v,j)=>{if(!v)return;const g=x.createRadialGradient(14+i*Z,14+j*Z,2,20+i*Z,20+j*Z,17);g.addColorStop(0,v==1?"#666":"#fff");g.addColorStop(1,v==1?"#000":"#ccc");x.beginPath();x.arc(20+i*Z,20+j*Z,17,0,7);x.fillStyle=g;x.fill()}));
const l=H[H.length-1];if(l){x.beginPath();x.arc(20+l[0]*Z,20+l[1]*Z,4,0,7);x.fillStyle="#e07a5f";x.fill()}sc.textContent=`胜 ${W.w} · 负 ${W.l}`};
const D=[[1,0],[0,1],[1,1],[1,-1]],line=(i,j,p,dx,dy)=>{let n=1,o=0;for(const s of[1,-1]){let k=1;while(true){const a=i+dx*k*s,b=j+dy*k*s;if(a<0||b<0||a>=N||b>=N){break}if(B[a][b]==p){n++;k++}else{if(!B[a][b])o++;break}}}return[n,o]};
const win=(i,j,p)=>D.some(([dx,dy])=>line(i,j,p,dx,dy)[0]>=5);const sv=(i,j,p)=>{let s=0;D.forEach(([dx,dy])=>{const[n,o]=line(i,j,p,dx,dy);s+=n>=5?1e6:n==4?(o==2?5e4:o?5e3:0):n==3?(o==2?3e3:o?300:0):n==2?(o==2?100:o?20:0):o});return s};
const ai=()=>{let best=-1,mv=[7,7];for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(B[i][j])continue;let near=false;for(let a=-2;a<=2&&!near;a++)for(let b=-2;b<=2;b++)if(B[i+a]?.[j+b]){near=true;break}if(!near&&H.length)continue;
B[i][j]=3-me;const at=sv(i,j,3-me);B[i][j]=me;const df=sv(i,j,me);B[i][j]=0;const s=at*(lv.value==2?1.1:1)+df*(lv.value==2?1:.5)+Math.random()*(lv.value==2?5:400)-Math.abs(i-7)-Math.abs(j-7);if(s>best){best=s;mv=[i,j]}}return mv};
const put=(i,j,p)=>{B[i][j]=p;H.push([i,j]);dr();if(win(i,j,p)){over=true;ms.textContent=p==me?"🎉 你赢了！":"😅 电脑赢了";p==me?W.w++:W.l++;localStorage.gmk=JSON.stringify(W);dr();return true}if(H.length==N*N){over=true;ms.textContent="平局"}return false};
c.onclick=e=>{if(over)return;const r=c.getBoundingClientRect(),i=Math.round(((e.clientX-r.left)*600/r.width-20)/Z),j=Math.round(((e.clientY-r.top)*600/r.height-20)/Z);if(i<0||j<0||i>=N||j>=N||B[i][j])return;
if(put(i,j,me))return;ms.textContent="电脑思考中…";setTimeout(()=>{const[a,b]=ai();if(!put(a,b,3-me))ms.textContent="轮到你"},120)};
ng.onclick=af.onchange=()=>{B=Array.from({length:N},()=>Array(N).fill(0));H=[];over=false;ms.textContent="你执黑 ⚫";dr();if(af.checked)put(7,7,2)};ud.onclick=()=>{if(over)return;for(let k=0;k<2&&H.length;k++){const[i,j]=H.pop();B[i][j]=0}dr()};ng.onclick();window.__g=()=>({B,H,over})</script></html>
