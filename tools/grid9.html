<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九宫格切图 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>九宫格切图</h1></header><main><div class=panel><input type=file id=f accept="image/*"><div class=row><select id=g><option value="3,3">3×3 九宫格</option><option value="2,2">2×2 四宫格</option><option value="1,3">1×3 横切三张</option><option value="3,1">3×1 竖切三张</option></select><label>间隙预览</label><input type=range id=gp min=0 max=12 value=4><button id=dl>下载全部（按顺序）</button></div><p style="font-size:13px;color:#a99">非方形图片会自动居中裁成合适比例；文件名按发布顺序编号</p></div>
<div class=panel><div id=o style="display:grid;max-width:480px;margin:auto"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="grid9");r.unshift("grid9");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let im=new Image(),P=[];const sm=()=>{const c=document.createElement("canvas");c.width=c.height=900;const x=c.getContext("2d"),gr=x.createLinearGradient(0,0,900,900);gr.addColorStop(0,"#f6c9b4");gr.addColorStop(1,"#8fae9a");x.fillStyle=gr;x.fillRect(0,0,900,900);x.font="420px serif";x.textAlign="center";x.fillText("✝",450,600);im.src=c.toDataURL()};
const d=()=>{const[r,cn]=g.value.split(",").map(Number),T=Math.min(im.width/cn,im.height/r),sx=(im.width-T*cn)/2,sy=(im.height-T*r)/2;P=[];o.style.gridTemplateColumns=`repeat(${cn},1fr)`;o.style.gap=gp.value+"px";o.innerHTML="";
for(let i=0;i<r;i++)for(let j=0;j<cn;j++){const c=document.createElement("canvas");c.width=c.height=Math.min(1080,T|0);c.getContext("2d").drawImage(im,sx+j*T,sy+i*T,T,T,0,0,c.width,c.height);c.style.width="100%";c.style.borderRadius="4px";o.appendChild(c);P.push(c)}};
im.onload=d;f.onchange=()=>im.src=URL.createObjectURL(f.files[0]);g.onchange=gp.oninput=d;dl.onclick=async()=>{for(let k=0;k<P.length;k++){const a=document.createElement("a");a.download=`宫格_${k+1}.jpg`;a.href=P[k].toDataURL("image/jpeg",.92);a.click();await new Promise(r=>setTimeout(r,250))}};sm()</script></html>
