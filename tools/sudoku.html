<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数独 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>数独</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=lv><option value=36>简单</option><option value=46 selected>中等</option><option value=54>困难</option></select><button id=ng>新题</button><button class=alt id=hn>💡 提示</button><button class=alt id=ck>✔ 检查</button><span>⏱ <b id=tm>0:00</b></span></div>
<div id=bd style="display:grid;grid-template-columns:repeat(9,1fr);width:min(calc(100vw - 64px),450px);margin:14px auto;border:3px solid #5a4a40;border-radius:8px;overflow:hidden"></div><div id=pad class=row style="justify-content:center"></div><p id=ms style="font-size:20px;color:#b98a62;min-height:28px"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="sudoku");r.unshift("sudoku");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let S,Pz,U,sel=-1,t0,iv;const ok=(g,i,v)=>{const r=i/9|0,c=i%9;for(let k=0;k<9;k++){if(g[r*9+k]==v||g[k*9+c]==v)return false}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)if(g[(br+a)*9+bc+b]==v)return false;return true};
const fill=g=>{const i=g.indexOf(0);if(i<0)return true;for(const v of[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5))if(ok(g,i,v)){g[i]=v;if(fill(g))return true;g[i]=0}return false};
const cnt=(g,lim=2)=>{const i=g.indexOf(0);if(i<0)return 1;let n=0;for(let v=1;v<=9&&n<lim;v++)if(ok(g,i,v)){g[i]=v;n+=cnt(g,lim-n);g[i]=0}return n};
const gen=()=>{S=Array(81).fill(0);fill(S);Pz=[...S];let rm=0;for(const i of[...Array(81).keys()].sort(()=>Math.random()-.5)){if(rm>=+lv.value)break;const k=Pz[i];Pz[i]=0;if(cnt([...Pz])!=1)Pz[i]=k;else rm++}U=[...Pz];sel=-1;ms.textContent="";clearInterval(iv);t0=Date.now();iv=setInterval(()=>{const s=(Date.now()-t0)/1000|0;tm.textContent=`${s/60|0}:${String(s%60).padStart(2,"0")}`},1000);dr()};
const dr=()=>{bd.innerHTML=U.map((v,i)=>{const r=i/9|0,c=i%9,fx=Pz[i],sv=sel>=0&&(U[sel]&&U[sel]==v),rel=sel>=0&&((sel/9|0)==r||sel%9==c);return`<div onclick="sel=${i};dr()" style="aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(5.5vw,26px);cursor:pointer;border-right:${c%3==2&&c<8?"2px solid #5a4a40":"1px solid #e0d6cc"};border-bottom:${r%3==2&&r<8?"2px solid #5a4a40":"1px solid #e0d6cc"};background:${i==sel?"#f6c9b4":sv&&v?"#f3e0cf":rel?"#f7f0e8":"#fff"};font-weight:${fx?700:400};color:${fx?"#3a3330":"#3a6ea5"}">${v||""}</div>`}).join("");
if(U.every((v,i)=>v==S[i])){clearInterval(iv);ms.textContent=`🎉 完成！用时 ${tm.textContent}`}};const set=v=>{if(sel<0||Pz[sel])return;U[sel]=v;dr()};
pad.innerHTML=[1,2,3,4,5,6,7,8,9,"⌫"].map(v=>`<button class=alt style="width:42px;font-size:20px" onclick="set(${v=="⌫"?0:v})">${v}</button>`).join("");window.set=set;
onkeydown=e=>{if(/^[1-9]$/.test(e.key))set(+e.key);if(e.key=="Backspace"||e.key=="0")set(0);const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];if(m&&sel>=0){sel=(sel+m+81)%81;dr()}};
hn.onclick=()=>{const e=U.map((v,i)=>i).filter(i=>U[i]!=S[i]);if(!e.length)return;const i=sel>=0&&U[sel]!=S[sel]?sel:e[Math.random()*e.length|0];U[i]=S[i];sel=i;dr()};
ck.onclick=()=>{const w=U.filter((v,i)=>v&&v!=S[i]).length;ms.textContent=w?`有 ${w} 个格子填错了`:"目前都正确 👍";bd.querySelectorAll("div").forEach((d,i)=>{if(U[i]&&U[i]!=S[i])d.style.background="#f5c0b8"})};ng.onclick=lv.onchange=gen;gen();window.__s=()=>({S,Pz,U})</script></html>
