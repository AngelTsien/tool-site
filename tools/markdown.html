`代码`，[链接](https://example.com)</textarea><div id=o style="flex:1;min-width:260px;background:#fffdf9;border-radius:12px;padding:12px;border:1px solid #f0e8e0"></div></div><p><button class=alt id=cp>复制 HTML</button></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="markdown");r.unshift("markdown");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const es=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;"),il=s=>es(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`(.+?)`/g,"<code style='background:#f3ece2;padding:1px 4px;border-radius:4px'>$1</code>").replace(/\[(.+?)\]\((https?:[^)]+)\)/g,"<a href='$2' target=_blank>$1</a>");
const md=s=>{let h="",l=null;const cl=()=>{if(l){h+=`</${l}>`;l=null}};s.split("\n").forEach(x=>{let m;if(m=x.match(/^(#{1,6})\s+(.*)/)){cl();h+=`<h${m[1].length}>${il(m[2])}</h${m[1].length}>`}else if(m=x.match(/^\s*[-*]\s+(.*)/)){if(l!="ul"){cl();h+="<ul>";l="ul"}h+=`<li>${il(m[1])}</li>`}
else if(m=x.match(/^\s*\d+\.\s+(.*)/)){if(l!="ol"){cl();h+="<ol>";l="ol"}h+=`<li>${il(m[1])}</li>`}else if(m=x.match(/^>\s?(.*)/)){cl();h+=`<blockquote style="border-left:4px solid #d9a47c;margin:6px 0;padding:4px 12px;color:#6a5e56">${il(m[1])}</blockquote>`}else if(/^---+$/.test(x)){cl();h+="<hr>"}else if(x.trim()){cl();h+=`<p>${il(x)}</p>`}else cl()});cl();return h};
const f=()=>o.innerHTML=md(t.value);t.oninput=f;cp.onclick=()=>navigator.clipboard.writeText(o.innerHTML);f()</script></html>
