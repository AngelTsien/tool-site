<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白板画板 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>白板画板</h1></header><main><div class=panel><div class=row><input type=color id=co value="#3a3330"><span id=pl class=row></span><label>粗细</label><input type=range id=sz min=1 max=40 value=4><button class=alt id=er>🧽 橡皮</button><button class=alt id=un>↶ 撤销</button><button class=alt id=cl>🗑 清空</button><button id=dl>下载</button></div>
<canvas id=c style="width:100%;height:60vh;background:#fff;border-radius:12px;touch-action:none;margin-top:10px;cursor:crosshair;box-shadow:inset 0 0 0 1px #eee"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="board");r.unshift("board");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const x=c.getContext("2d");let dw=false,ers=false,H=[];const fit=()=>{const r=c.getBoundingClientRect(),im=c.width?c.toDataURL():null;c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);if(im){const i=new Image();i.onload=()=>x.drawImage(i,0,0);i.src=im}};fit();
["#3a3330","#e07a5f","#3d8b5f","#3a6ea5","#e8b84a","#9b6bb5"].forEach(cl=>{const b=document.createElement("button");b.style.cssText=`background:${cl};width:28px;height:28px;padding:0;border-radius:50%`;b.onclick=()=>{co.value=cl;ers=false;er.className="alt"};pl.appendChild(b)});
const P=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*devicePixelRatio,(e.clientY-r.top)*devicePixelRatio]};
c.onpointerdown=e=>{H.push(c.toDataURL());if(H.length>30)H.shift();dw=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...P(e));x.lineCap=x.lineJoin="round";x.lineWidth=sz.value*devicePixelRatio*(ers?3:1);x.strokeStyle=ers?"#fff":co.value;x.lineTo(...P(e));x.stroke()};
c.onpointermove=e=>{if(dw){x.lineTo(...P(e));x.stroke()}};c.onpointerup=()=>dw=false;er.onclick=()=>{ers=!ers;er.className=ers?"":"alt"};co.oninput=()=>{ers=false;er.className="alt"};
un.onclick=()=>{const s=H.pop();if(s){const i=new Image();i.onload=()=>x.drawImage(i,0,0);i.src=s}};cl.onclick=()=>{H.push(c.toDataURL());x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)};dl.onclick=()=>{const a=document.createElement("a");a.download="白板.png";a.href=c.toDataURL();a.click()}</script></html>
