<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽奖号码球 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>抽奖号码球</h1></header><main><div class=panel><div class=row><label>号码从</label><input id=lo type=number value=1 style="width:70px"><label>到</label><input id=hi type=number value=100 style="width:80px"><label>每次抽</label><input id=n type=number value=1 style="width:60px"><label>个</label><label><input type=checkbox id=nr checked> 不重复</label><input id=ex placeholder="排除号码，如 4,13" style="width:140px"></div></div>
<div class=panel style="text-align:center"><div id=mc style="position:relative;width:220px;height:220px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffffcc,#d9eaf7 40%,#9cc0dc);box-shadow:inset 0 -10px 30px #0002,0 10px 30px #0002;overflow:hidden"></div><p><button id=go style="font-size:22px;padding:14px 40px">🎰 开始抽奖</button></p><div id=res class=row style="justify-content:center;min-height:80px"></div><p id=lf style="color:#a99"></p></div>
<div class=panel><h3>🏆 已抽出 <button class=alt id=rs style="float:right">重置</button></h3><div id=hs class=row></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="lottery");r.unshift("lottery");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let H=[],bl=[];const CL=["#e07a5f","#f2b179","#e8c26a","#8fc79a","#5a9fd0","#9b7ac0","#e38aae"];const ball=(v,s=64)=>`<div style="width:${s}px;height:${s}px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 12%,${CL[v%7]} 40%,${CL[v%7]}cc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${s*.36}px;color:#fff;text-shadow:0 1px 2px #0005;box-shadow:0 3px 8px #0003">${v}</div>`;
const pool=()=>{const X=new Set(ex.value.split(/[,，\s]+/).map(Number));const a=[];for(let i=+lo.value;i<=+hi.value&&a.length<1e5;i++)if(!X.has(i)&&!(nr.checked&&H.includes(i)))a.push(i);return a};
const mix=()=>{mc.innerHTML=Array.from({length:14},(_,i)=>`<div style="position:absolute;left:${10+Math.random()*60}%;top:${10+Math.random()*60}%;transition:all .25s">${ball(+lo.value+(Math.random()*(hi.value-lo.value+1)|0),34)}</div>`).join("")};mix();
const rd=()=>{hs.innerHTML=H.map(v=>ball(v,40)).join("");lf.textContent=`剩余可抽 ${pool().length} 个`};
go.onclick=()=>{const P=pool(),k=Math.min(+n.value,P.length);if(!k){res.innerHTML="<p>没有可抽的号码了</p>";return}go.disabled=true;let c=0;const iv=setInterval(()=>{mc.querySelectorAll(":scope>div").forEach(d=>{d.style.left=5+Math.random()*70+"%";d.style.top=5+Math.random()*70+"%"});if(++c>14){clearInterval(iv);
const R=[];for(let i=0;i<k;i++){const j=crypto.getRandomValues(new Uint32Array(1))[0]%P.length;R.push(P[j]);if(nr.checked)P.splice(j,1)}H.push(...R);res.innerHTML=R.map((v,i)=>`<div style="animation:up .5s ${i*.15}s both">${ball(v,80)}</div>`).join("");go.disabled=false;rd()}},120)};
rs.onclick=()=>{H=[];res.innerHTML="";rd()};[lo,hi,ex,nr].forEach(e=>e.oninput=()=>{mix();rd()});rd();window.__H=()=>H</script></html>
