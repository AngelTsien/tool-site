<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机分组/抽签 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>随机分组/抽签</h1></header><main><div class=panel><label>名单（每行一个，或用逗号/空格分隔）</label><textarea id=n>小明 小红 小华 小李 小张 小王 小陈 小刘 小赵 小周</textarea>
<div class=row><label>分成</label><input id=k type=number value=3 style="width:80px"><label>组</label><button id=g>随机分组</button><button id=p class=alt>抽一个</button></div></div><div class=panel id=out></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="group");r.unshift("group");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const names=()=>n.value.split(/[\s,，、]+/).filter(Boolean),sh=a=>{for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
g.onclick=()=>{const a=sh(names()),K=Math.max(1,+k.value),G=Array.from({length:K},()=>[]);a.forEach((x,i)=>G[i%K].push(x));out.innerHTML='<div class=stat>'+G.map((x,i)=>`<div><b>第 ${i+1} 组</b>${x.join("、")}</div>`).join("")+"</div>"};
p.onclick=()=>{const a=names();let c=0;const iv=setInterval(()=>{out.innerHTML=`<div style="text-align:center;font-size:56px;color:#b98a62">${a[Math.random()*a.length|0]}</div>`;if(++c>15){clearInterval(iv);out.innerHTML=`<div style="text-align:center;font-size:56px;color:#b98a62">🎉 ${sh(a)[0]}</div>`}},80)};g.onclick()</script></html>
