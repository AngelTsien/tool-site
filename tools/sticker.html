<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贴纸奖励表 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>贴纸奖励表</h1></header><main><div class=panel><div class=row><input id=nm placeholder="小朋友名字" style="flex:1"><button id=ad>添加</button><select id=ic><option>⭐</option><option>🌟</option><option>❤️</option><option>🐑</option><option>🌈</option><option>🍎</option></select><button class=alt id=rs>新一期清零</button></div><p style="font-size:13px;color:#a99">点名字旁的按钮贴一个贴纸；满 10 个会有庆祝 🎉</p></div><div id=ls></div><div class=panel><h3>🏆 排行榜</h3><div id=rk></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="sticker");r.unshift("sticker");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let K=JSON.parse(localStorage.stk||'[{"n":"小羊","s":3},{"n":"小鸽","s":7},{"n":"小鱼","s":1}]');
const rd=()=>{localStorage.stk=JSON.stringify(K);ls.innerHTML=K.map((k,i)=>`<div class=panel><div class=row><b style="flex:1;font-size:20px">${k.n}</b><span style="color:#b98a62;font-weight:700">${k.s}</span><button onclick="up(${i},1)">+ ${ic.value}</button><button class=alt onclick="up(${i},-1)">−</button><button class=alt onclick="confirm('删除 ${k.n}？')&&(K.splice(${i},1),rd())">✕</button></div><div style="font-size:26px;letter-spacing:2px;margin-top:6px;word-break:break-all">${(k.e||ic.value).repeat(Math.min(k.s,50))}${k.s>50?"…":""}</div></div>`).join("");
rk.innerHTML=[...K].sort((a,b)=>b.s-a.s).map((k,i)=>`<p style="font-size:18px;margin:6px 0">${["🥇","🥈","🥉"][i]||(i+1)+"."} ${k.n} — ${k.s}</p>`).join("")};
window.up=(i,d)=>{K[i].s=Math.max(0,K[i].s+d);if(d>0)K[i].e=ic.value;rd();if(d>0&&K[i].s%10==0){const c=document.createElement("div");c.textContent="🎉 "+K[i].n+" 集满 "+K[i].s+" 个！";c.style.cssText="position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:32px;background:#fff;padding:20px 30px;border-radius:20px;box-shadow:0 10px 40px #0003;z-index:9";document.body.appendChild(c);c.animate([{transform:"translate(-50%,-50%) scale(.3)"},{transform:"translate(-50%,-50%) scale(1.1)"},{transform:"translate(-50%,-50%) scale(1)"}],400);setTimeout(()=>c.remove(),1800)}};
ad.onclick=()=>{if(nm.value.trim()){K.push({n:nm.value.trim(),s:0});nm.value="";rd()}};nm.onkeydown=e=>{if(e.key=="Enter")ad.click()};ic.onchange=rd;rs.onclick=()=>{if(confirm("所有人清零？")){K.forEach(k=>k.s=0);rd()}};rd()</script></html>
