<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二十四点 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>二十四点</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=lv><option value=0>1–10</option><option value=1>1–13（扑克）</option></select><button id=ng>换一题</button><span>答对 <b id=sc>0</b></span><span>⏱ <b id=tm>0</b>s</span></div>
<div id=cards class=row style="justify-content:center;margin:18px 0"></div><div class=row style="justify-content:center" id=ops></div><p id=ex style="font-size:24px;min-height:34px;font-family:monospace"></p>
<div class=row style="justify-content:center"><button class=alt id=un>↶ 撤销</button><button class=alt id=hn>💡 提示</button><button class=alt id=an>📖 看答案</button></div><p id=ms style="font-size:20px"></p>
<div style="margin-top:16px"><label>自己出题：</label><input id=cu placeholder="如 3 3 8 8" style="width:120px"><button class=alt id=sv>求解</button><p id=so class=out style="text-align:left"></p></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="game24");r.unshift("game24");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const solve=(ns)=>{const R=new Set;const go=(a)=>{if(a.length==1){if(Math.abs(a[0].v-24)<1e-6)R.add(a[0].e);return}for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++){if(i==j)continue;const r=a.filter((_,k)=>k!=i&&k!=j),x=a[i],y=a[j];const c=[{v:x.v+y.v,e:`(${x.e}+${y.e})`},{v:x.v-y.v,e:`(${x.e}-${y.e})`},{v:x.v*y.v,e:`(${x.e}×${y.e})`}];if(Math.abs(y.v)>1e-9)c.push({v:x.v/y.v,e:`(${x.e}÷${y.e})`});
for(const z of c){if(i<j||!["+","×"].includes(z.e[x.e.length+1]))go([...r,z])}if(R.size>30)return}};go(ns.map(n=>({v:n,e:""+n})));return[...R].map(s=>s.slice(1,-1))};
let N,cur,st=[],score=0,t0,iv;const SU="♠♥♣♦",fc=n=>({1:"A",11:"J",12:"Q",13:"K"}[n]||n);const ng0=()=>{do{N=Array.from({length:4},()=>1+Math.random()*(lv.value==1?13:10)|0)}while(!solve(N).length);reset();clearInterval(iv);t0=Date.now();iv=setInterval(()=>tm.textContent=(Date.now()-t0)/1000|0,500);ms.textContent=""};
const reset=()=>{cur=N.map((v,i)=>({v,e:""+v,id:i}));st=[];sel=null;op=null;rd()};let sel=null,op=null;
const rd=()=>{cards.innerHTML=cur.map((c,i)=>`<div onclick="pk(${i})" style="width:76px;height:106px;border-radius:12px;background:${sel==i?"#f6c9b4":"#fff"};box-shadow:0 3px 10px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:${c.e.length>4?18:34}px;font-weight:700;color:${c.id%2?"#c05a4a":"#3a3330"};transition:.15s;${sel==i?"transform:translateY(-6px)":""}">${c.e.length>4?(+c.v.toFixed(3)):fc(c.v)}<span style="font-size:18px">${c.e.length>4?"":SU[c.id]}</span></div>`).join("");
ops.innerHTML=["+","−","×","÷"].map(o=>`<button class="${op==o?"":"alt"}" style="font-size:24px;width:56px" onclick="po('${o}')">${o}</button>`).join("");ex.textContent=cur.length==1?cur[0].e.replace(/^\((.*)\)$/,"$1")+" = "+(+cur[0].v.toFixed(4)):""};
window.pk=i=>{if(sel==null||op==null||sel==i){sel=sel==i?null:i;rd();return}const a=cur[sel],b=cur[i];if(op=="÷"&&Math.abs(b.v)<1e-9){ms.textContent="不能除以 0";return}const v={"+":a.v+b.v,"−":a.v-b.v,"×":a.v*b.v,"÷":a.v/b.v}[op];st.push(cur);cur=cur.filter((_,k)=>k!=sel&&k!=i);cur.push({v,e:`(${a.e}${op.replace("−","-")}${b.e})`,id:a.id});sel=cur.length-1;op=null;
if(cur.length==1){if(Math.abs(v-24)<1e-6){score++;sc.textContent=score;ms.innerHTML="🎉 <b style=color:#4a9a5a>24 点！</b>";clearInterval(iv);setTimeout(ng0,1800)}else ms.textContent=`结果是 ${+v.toFixed(3)}，不是 24，撤销再试`}rd()};
window.po=o=>{op=o;rd()};un.onclick=()=>{if(st.length){cur=st.pop();sel=null;op=null;ms.textContent="";rd()}};hn.onclick=()=>{const s=solve(N)[0];ms.textContent="💡 可以先算："+(s.match(/\(([^()]+)\)/)||[,s])[1]};an.onclick=()=>{ms.textContent="📖 "+solve(N).slice(0,3).join("　或　")};
sv.onclick=()=>{const n=cu.value.trim().split(/[\s,，]+/).map(Number).filter(x=>!isNaN(x));if(n.length!=4){so.textContent="请输入 4 个数";return}const r=solve(n);so.textContent=r.length?`共 ${r.length} 种写法（部分）：\n`+r.slice(0,10).join("\n"):"无解 😅"};ng.onclick=lv.onchange=ng0;ng0();window.__N=()=>N;window.__solve=solve</script></html>
