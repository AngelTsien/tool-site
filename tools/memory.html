<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>记忆翻牌</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=lv><option value=6>简单 12 张</option><option value=8 selected>普通 16 张</option><option value=10>困难 20 张</option></select><button id=ng>新游戏</button><span>步数 <b id=st>0</b></span><span>⏱ <b id=tm>0</b>s</span></div><div id=bd style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:16px auto"></div><p id=ms style="font-size:22px;color:#b98a62"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="memory");r.unshift("memory");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const E="🍎🐑🕊️🌿⭐🐟🍞🍇🌈🔥🦁⛵".match(/\p{Extended_Pictographic}\uFE0F?/gu);let O=[],S=0,M=0,lock=0,t0,iv;
const ng0=()=>{const k=+lv.value,c=E.slice(0,k);const D=[...c,...c].sort(()=>Math.random()-.5);S=M=0;O=[];st.textContent=0;ms.textContent="";clearInterval(iv);t0=0;tm.textContent=0;bd.style.gridTemplateColumns=`repeat(${k==10?5:4},1fr)`;
bd.innerHTML=D.map(e=>`<div class=mc data-e="${e}" style="aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#d9a47c,#c48fa8);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;transition:.3s;user-select:none"></div>`).join("");
bd.querySelectorAll(".mc").forEach(c=>c.onclick=()=>{if(lock||c.textContent||O.includes(c))return;if(!t0){t0=Date.now();iv=setInterval(()=>tm.textContent=(Date.now()-t0)/1000|0,500)}c.textContent=c.dataset.e;c.style.background="#fff";O.push(c);
if(O.length==2){st.textContent=++S;const[a,b]=O;O=[];if(a.dataset.e==b.dataset.e){M++;a.style.background=b.style.background="#d7ebdc";if(M==k){clearInterval(iv);ms.textContent=`🎉 完成！${S} 步，${tm.textContent} 秒`}}else{lock=1;setTimeout(()=>{[a,b].forEach(x=>{x.textContent="";x.style.background="linear-gradient(135deg,#d9a47c,#c48fa8)"});lock=0},700)}}})};ng.onclick=lv.onchange=ng0;ng0()</script></html>
