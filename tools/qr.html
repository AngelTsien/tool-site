<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二维码生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>二维码生成</h1></header><main><div class=panel><label>网址或文字</label><textarea id=t style="min-height:70px">https://www.example.com</textarea><div class=row><label>颜色</label><input type=color id=fg value="#3a3330"><button id=go>生成</button><button class=alt id=dl>下载 PNG</button></div></div><div class=panel style="text-align:center"><canvas id=c style="width:280px"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/qrcode.js"></script><script src="../static/vendor/qrcode_UTF8.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="qr");r.unshift("qr");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>function go(){const q=qrcode(0,"M");q.addData(t.value||" ");q.make();const n=q.getModuleCount(),s=10,b=2,x=c.getContext("2d");c.width=c.height=(n+b*2)*s;x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle=fg.value;
for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+b)*s,(r+b)*s,s,s)}t.oninput=fg.oninput=go;document.getElementById("go").onclick=go;dl.onclick=()=>{const a=document.createElement("a");a.download="二维码.png";a.href=c.toDataURL();a.click()};go()</script></html>
