<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打字练习 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>打字练习</h1></header><main><div class=panel><select id=src><option value=zh>中文经文</option><option value=en>English</option></select><div id=tg style="font-size:22px;line-height:1.8;margin:14px 0;padding:12px;background:#f7f3ee;border-radius:12px"></div><textarea id=in placeholder="在这里开始输入，计时自动开始…" style="min-height:90px"></textarea>
<div class="stat"><div><b id=sp>0</b>字/分钟</div><div><b id=ac>100%</b>正确率</div><div><b id=tm>0</b>秒</div></div><p><button class=alt id=nx>换一段</button></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="typing");r.unshift("typing");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const D={zh:["你们要先求他的国和他的义，这些东西都要加给你们了。","爱是恒久忍耐，又有恩慈；爱是不嫉妒，爱是不自夸，不张狂。","我靠着那加给我力量的，凡事都能做。","你要专心仰赖耶和华，不可倚靠自己的聪明。"],en:["The Lord is my shepherd; I shall not want.","Be strong and courageous. Do not be afraid.","For God so loved the world that he gave his one and only Son."]};let T="",t0=0,iv;
const nw=()=>{const a=D[src.value];T=a[Math.random()*a.length|0];in_.value="";t0=0;clearInterval(iv);sp.textContent=tm.textContent=0;ac.textContent="100%";rd()};const in_=document.getElementById("in");
const rd=()=>{const v=in_.value;tg.innerHTML=[...T].map((c,i)=>`<span style="color:${i>=v.length?"#9a8f88":v[i]==c?"#4a9a5a":"#fff;background:#e08a7a;border-radius:3px"}">${c}</span>`).join("");let ok=0;[...v].forEach((c,i)=>ok+=c==T[i]);ac.textContent=v.length?Math.round(ok/v.length*100)+"%":"100%";
const s=t0?(Date.now()-t0)/1000:0;if(s>0)sp.textContent=Math.round((src.value=="en"?ok/5:ok)/s*60);if(v.length>=T.length&&t0){clearInterval(iv);tg.innerHTML+=" <b style='color:#b98a62'>✓ 完成！</b>"}};
in_.oninput=()=>{if(!t0){t0=Date.now();iv=setInterval(()=>{tm.textContent=((Date.now()-t0)/1000|0)},500)}rd()};src.onchange=nx.onclick=nw;nw()</script></html>
