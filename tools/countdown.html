<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒数日 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>倒数日</h1></header><main><div class=panel><div class=row><input id=n placeholder="事件，例如：圣诞节" style="flex:1"><input type=date id=d><button id=ad>添加</button></div></div><div id=ls class=grid></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="countdown");r.unshift("countdown");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.cd||"null")||[{n:"圣诞节",d:new Date().getFullYear()+"-12-25"},{n:"新年",d:(new Date().getFullYear()+1)+"-01-01"}];
const rd=()=>{localStorage.cd=JSON.stringify(L);const t=new Date();t.setHours(0,0,0,0);ls.innerHTML=L.map((x,i)=>{const k=Math.round((new Date(x.d+"T00:00")-t)/864e5);return`<div class=card style="--c:${k>=0?"#f6c9b4":"#b9dcc8"};text-align:center"><p>${x.n}${k>=0?" 还有":" 已经"}</p><div style="font-size:52px;font-weight:700;color:#b98a62">${Math.abs(k)}</div><p>天 · ${x.d}</p><button class=alt onclick="L.splice(${i},1);rd()">删除</button></div>`}).join("")};
ad.onclick=()=>{if(n.value&&d.value){L.push({n:n.value,d:d.value});n.value="";rd()}};rd()</script></html>
