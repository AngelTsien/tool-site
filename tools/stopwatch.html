<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秒表计次 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>秒表计次</h1></header><main><div class=panel style="text-align:center"><div id=d style="font-size:min(16vw,84px);font-weight:700;font-variant-numeric:tabular-nums;color:#3a3330">00:00.00</div><div class=row style="justify-content:center;margin:14px 0"><button id=ss style="font-size:20px;padding:14px 40px;background:#4a9a5a">开始</button><button class=alt id=lp style="font-size:20px;padding:14px 30px">计次</button><button class=alt id=rs style="font-size:20px;padding:14px 30px">重置</button></div><p style="font-size:13px;color:#a99">空格 开始/暂停 · L 计次 · R 重置</p></div>
<div class=panel><table style="width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums" id=tb></table><p><button class=alt id=cp>复制成绩</button></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="stopwatch");r.unshift("stopwatch");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let st=0,acc=0,run=false,L=[],raf;const now=()=>acc+(run?performance.now()-st:0),fm=ms=>{const m=ms/6e4|0,s=(ms/1000|0)%60,c=(ms/10|0)%100;return(m>=60?(m/60|0)+":"+String(m%60).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s).padStart(2,"0")+"."+String(c).padStart(2,"0")};
const tick=()=>{d.textContent=fm(now());if(run)raf=requestAnimationFrame(tick)};const rl=()=>{const sp=L.map((t,i)=>t-(L[i-1]||0)),mn=Math.min(...sp),mx=Math.max(...sp);tb.innerHTML=L.map((t,i)=>[i,t,sp[i]]).reverse().map(([i,t,s])=>`<tr style="border-bottom:1px solid #f0e8e0;color:${L.length>2&&s==mn?"#4a9a5a":L.length>2&&s==mx?"#c05a4a":""}"><td style="padding:8px">第 ${i+1} 圈</td><td>${fm(s)}</td><td style="text-align:right">${fm(t)}</td></tr>`).join("")};
ss.onclick=()=>{if(run){acc+=performance.now()-st;run=false;ss.textContent="继续";ss.style.background="#4a9a5a";lp.textContent="计次"}else{st=performance.now();run=true;ss.textContent="暂停";ss.style.background="#c05a4a";tick()}};
lp.onclick=()=>{if(run){L.push(now());rl()}};rs.onclick=()=>{if(run)return;acc=0;L=[];rl();d.textContent=fm(0);ss.textContent="开始"};onkeydown=e=>{if(e.code=="Space"){e.preventDefault();ss.click()}if(e.key=="l"||e.key=="L")lp.click();if(e.key=="r"||e.key=="R")rs.click()};
cp.onclick=()=>navigator.clipboard.writeText(L.map((t,i)=>`第${i+1}圈 ${fm(t-(L[i-1]||0))} 累计 ${fm(t)}`).join("\n"));window.__fm=fm</script></html>
