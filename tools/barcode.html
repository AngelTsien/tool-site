<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>条形码生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>条形码生成</h1></header><main><div class=panel><div class=row><input id=v value="GRACE-2026" style="flex:1"><select id=fm><option>CODE128</option><option>EAN13</option><option>EAN8</option><option>UPC</option><option>CODE39</option><option>ITF14</option></select></div>
<div class=row><label>条宽</label><input type=range id=w min=1 max=4 value=2><label>高度</label><input type=range id=h min=40 max=200 value=100><label><input type=checkbox id=tx checked> 显示文字</label><input type=color id=co value="#000000"><button id=dl>下载 PNG</button></div><p id=er style="color:#c05a4a"></p></div><div class=panel style="text-align:center;overflow:auto"><canvas id=c></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/jsbarcode.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="barcode");r.unshift("barcode");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const ex={CODE128:"GRACE-2026",EAN13:"690123456789",EAN8:"9638507",UPC:"03600029145",CODE39:"ABC-123",ITF14:"1540014128876"};let ok=true;
const f=()=>{er.textContent="";ok=true;try{JsBarcode(c,v.value,{format:fm.value,width:+w.value,height:+h.value,displayValue:tx.checked,lineColor:co.value,margin:14,valid:x=>{if(!x){er.textContent="✗ 内容不符合 "+fm.value+" 格式";ok=false}}})}catch(e){er.textContent="✗ "+e;ok=false}};
fm.onchange=()=>{v.value=ex[fm.value];f()};[v,w,h,tx,co].forEach(e=>e.oninput=f);dl.onclick=()=>{if(!ok)return;const a=document.createElement("a");a.download="条形码.png";a.href=c.toDataURL();a.click()};f()</script></html>
