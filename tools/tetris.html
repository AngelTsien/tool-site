<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯方块 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>俄罗斯方块</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><div class=stat style="width:300px"><div><b id=sc>0</b>分数</div><div><b id=ln>0</b>行</div><div><b id=lv>1</b>等级</div></div></div>
<div class=row style="justify-content:center;align-items:flex-start;margin-top:10px"><canvas id=c width=300 height=600 style="width:min(60vw,260px);background:#2d3555;border-radius:10px"></canvas><div><p>下一个</p><canvas id=nx width=100 height=100 style="background:#f3ece2;border-radius:8px"></canvas><p><button id=go>开始</button></p><p style="font-size:12px;color:#a99">←→ 移动<br>↑ 旋转<br>↓ 加速<br>空格 落下<br>P 暂停</p><p>最高 <b id=hi></b></p></div></div>
<div class=row style="justify-content:center;margin-top:8px" id=pad><button class=alt data-k=ArrowLeft style="font-size:22px">◀</button><button class=alt data-k=ArrowUp style="font-size:22px">⟳</button><button class=alt data-k=ArrowDown style="font-size:22px">▼</button><button class=alt data-k=Space style="font-size:22px">⤓</button><button class=alt data-k=ArrowRight style="font-size:22px">▶</button></div><p id=ms style="font-size:20px;color:#b98a62"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="tetris");r.unshift("tetris");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const W=10,H=20,S=30,x=c.getContext("2d"),nxx=nx.getContext("2d"),SH={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},CO={I:"#7ec8e3",O:"#f2d16b",T:"#c48fa8",S:"#8fc79a",Z:"#e08a7a",J:"#7a9fd6",L:"#f2a65a"};
let G,cur,nxt,score,lines,tm,drop,run=false,pause=false;hi.textContent=localStorage.tetris||0;const rnd=()=>{const k="IOTSZJL"[Math.random()*7|0];return{k,m:SH[k].map(r=>[...r]),x:3,y:0}};
const hit=(m,px,py)=>m.some((r,i)=>r.some((v,j)=>v&&(px+j<0||px+j>=W||py+i>=H||(py+i>=0&&G[py+i][px+j]))));const rot=m=>m[0].map((_,j)=>m.map(r=>r[j]).reverse());
const cell=(cx,X,Y,col,s)=>{cx.fillStyle=col;cx.fillRect(X*s+1,Y*s+1,s-2,s-2);cx.fillStyle="#ffffff40";cx.fillRect(X*s+1,Y*s+1,s-2,4)};
const draw=()=>{x.fillStyle="#2d3555";x.fillRect(0,0,300,600);G.forEach((r,i)=>r.forEach((v,j)=>v&&cell(x,j,i,v,S)));if(cur){let gy=cur.y;while(!hit(cur.m,cur.x,gy+1))gy++;cur.m.forEach((r,i)=>r.forEach((v,j)=>{if(v){x.fillStyle="#ffffff22";x.fillRect((cur.x+j)*S+1,(gy+i)*S+1,S-2,S-2);cell(x,cur.x+j,cur.y+i,CO[cur.k],S)}}))}
nxx.clearRect(0,0,100,100);nxt.m.forEach((r,i)=>r.forEach((v,j)=>v&&cell(nxx,j+.5,i+1,CO[nxt.k],22)));sc.textContent=score;ln.textContent=lines;lv.textContent=1+(lines/10|0)};
const lock=()=>{cur.m.forEach((r,i)=>r.forEach((v,j)=>{if(v&&cur.y+i>=0)G[cur.y+i][cur.x+j]=CO[cur.k]}));let n=0;for(let i=H-1;i>=0;i--)if(G[i].every(Boolean)){G.splice(i,1);G.unshift(Array(W).fill(0));n++;i++}lines+=n;score+=[0,100,300,500,800][n]*(1+(lines/10|0));
cur=nxt;nxt=rnd();if(hit(cur.m,cur.x,cur.y)){run=false;clearInterval(tm);ms.textContent="游戏结束";if(score>(+localStorage.tetris||0))localStorage.tetris=score;hi.textContent=localStorage.tetris;go.textContent="再来一局"}};
const step=()=>{if(pause||!run)return;if(!hit(cur.m,cur.x,cur.y+1))cur.y++;else lock();draw()};const speed=()=>{clearInterval(tm);tm=setInterval(()=>{step();const sp=Math.max(80,600-(lines/10|0)*60);if(sp!=drop){drop=sp;speed()}},drop)};
const key=k=>{if(!run)return;if(k=="KeyP"){pause=!pause;ms.textContent=pause?"已暂停":"";return}if(pause)return;if(k=="ArrowLeft"&&!hit(cur.m,cur.x-1,cur.y))cur.x--;if(k=="ArrowRight"&&!hit(cur.m,cur.x+1,cur.y))cur.x++;if(k=="ArrowDown"){if(!hit(cur.m,cur.x,cur.y+1)){cur.y++;score+=1}}
if(k=="ArrowUp"){const m=rot(cur.m);for(const o of[0,-1,1,-2,2])if(!hit(m,cur.x+o,cur.y)){cur.m=m;cur.x+=o;break}}if(k=="Space"){while(!hit(cur.m,cur.x,cur.y+1)){cur.y++;score+=2}lock()}draw()};
onkeydown=e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();key(e.code)};pad.querySelectorAll("button").forEach(b=>b.onclick=()=>key(b.dataset.k));
go.onclick=()=>{G=Array.from({length:H},()=>Array(W).fill(0));score=lines=0;cur=rnd();nxt=rnd();run=true;pause=false;ms.textContent="";drop=600;speed();draw();go.blur()};G=Array.from({length:H},()=>Array(W).fill(0));nxt=rnd();draw();window.__t=()=>({G,cur,score,lines,run})</script></html>
