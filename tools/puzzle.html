<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼图游戏 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>拼图游戏</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><input type=file id=f accept="image/*" style="max-width:200px"><select id=n><option value=3>3×3</option><option value=4 selected>4×4</option><option value=5>5×5</option></select><button id=sh>🔀 打乱</button><label><input type=checkbox id=num checked> 显示数字</label></div>
<div id=bd style="position:relative;width:min(88vw,400px);aspect-ratio:1;margin:16px auto;background:#e9dcc6;border-radius:12px;overflow:hidden;touch-action:none"></div><p>步数 <b id=st>0</b>　<span id=ms style="color:#b98a62;font-size:20px"></span></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="puzzle");r.unshift("puzzle");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let N=4,T=[],src="",mv=0;const mk=()=>{const c=document.createElement("canvas");c.width=c.height=600;const x=c.getContext("2d"),g=x.createLinearGradient(0,0,600,600);g.addColorStop(0,"#f6c9b4");g.addColorStop(.5,"#c48fa8");g.addColorStop(1,"#8fae9a");x.fillStyle=g;x.fillRect(0,0,600,600);x.font="260px serif";x.textAlign="center";x.fillText("🕊️",300,390);src=c.toDataURL()};
const dr=()=>{const s=100/N;bd.innerHTML=T.map((v,i)=>v==N*N-1?"":`<div onclick="tap(${i})" style="position:absolute;left:${i%N*s}%;top:${(i/N|0)*s}%;width:${s}%;height:${s}%;background:url(${src}) ${v%N*100/(N-1)}% ${(v/N|0)*100/(N-1)}%/${N*100}% ${N*100}%;box-shadow:inset 0 0 0 1px #fff8;transition:.15s;cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px;font-size:12px;color:#fff;text-shadow:0 1px 2px #000">${num.checked?v+1:""}</div>`).join("");st.textContent=mv;
if(mv&&T.every((v,i)=>v==i))ms.textContent="🎉 完成！"};const nb=i=>{const e=T.indexOf(N*N-1);return(Math.abs(e-i)==N||(Math.abs(e-i)==1&&(e/N|0)==(i/N|0)))?e:-1};
window.tap=i=>{const e=nb(i);if(e<0)return;[T[i],T[e]]=[T[e],T[i]];mv++;dr()};const shuf=()=>{N=+n.value;T=[...Array(N*N).keys()];for(let k=0;k<N*N*40;k++){const e=T.indexOf(N*N-1),c=[e-N,e+N,e%N?e-1:-1,e%N<N-1?e+1:-1].filter(j=>j>=0&&j<N*N);const j=c[Math.random()*c.length|0];[T[e],T[j]]=[T[j],T[e]]}mv=0;ms.textContent="";dr()};
f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(im.width,im.height);c.width=c.height=600;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,600,600);src=c.toDataURL("image/jpeg",.85);shuf()};im.src=r.result};r.readAsDataURL(f.files[0])};
sh.onclick=n.onchange=shuf;num.onchange=dr;mk();shuf()</script></html>
