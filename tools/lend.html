<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物品借还登记 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>物品借还登记</h1></header><main><div class=panel><div class=row><input id=it placeholder="物品（如：投影仪 / 《标杆人生》）" style="flex:1" list=itl><datalist id=itl></datalist><input id=who placeholder="借用人" style="width:110px"><input id=ph placeholder="电话（可选）" style="width:120px"><label>借</label><input id=dy type=number value=14 style="width:60px"><label>天</label><button id=ad>登记借出</button></div></div>
<div class=row style="margin-bottom:10px"><button class=alt data-f=out>📤 借出中</button><button class=alt data-f=late>⏰ 已逾期</button><button class=alt data-f=back>✅ 已归还</button><input id=q placeholder="🔍 搜索" style="width:140px"><button class=alt id=ex>导出 CSV</button></div><div class="stat panel" id=sm></div><div id=ls></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="lend");r.unshift("lend");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.lend||"[]"),F="out";const td=()=>new Date().toISOString().slice(0,10),late=x=>!x.r&&x.due<td(),dl=x=>Math.round((new Date(x.due)-new Date(td()))/864e5);
const rd=()=>{localStorage.lend=JSON.stringify(L);itl.innerHTML=[...new Set(L.map(x=>x.i))].map(i=>`<option value="${i}">`).join("");const o=L.filter(x=>!x.r),lt=L.filter(late);sm.innerHTML=`<div><b>${o.length}</b>借出中</div><div><b style="color:#c05a4a">${lt.length}</b>已逾期</div><div><b>${L.length-o.length}</b>已归还</div>`;
const R=L.map((x,i)=>[x,i]).filter(([x])=>(F=="out"?!x.r:F=="late"?late(x):!!x.r)&&(!q.value||(x.i+x.w).includes(q.value)));ls.innerHTML=R.map(([x,i])=>`<div class=panel style="border-left:6px solid ${x.r?"#8fc79a":late(x)?"#e08a7a":"#e8c26a"}"><div class=row><b style="flex:1;font-size:18px">${x.i}</b><span>${x.w}${x.p?" · "+x.p:""}</span></div>
<p style="color:#7a706a;margin:4px 0">借出 ${x.d} · 应还 ${x.due}${x.r?` · ✅ ${x.r} 归还`:late(x)?` · <b style=color:#c05a4a>逾期 ${-dl(x)} 天</b>`:` · 还剩 ${dl(x)} 天`}</p><div class=row>${x.r?"":`<button onclick="L[${i}].r=td();rd()">✅ 已归还</button><button class=alt onclick="const d=new Date(L[${i}].due);d.setDate(d.getDate()+7);L[${i}].due=d.toISOString().slice(0,10);rd()">续借 7 天</button>`}<button class=alt onclick="confirm('删除记录？')&&(L.splice(${i},1),rd())">删除</button></div></div>`).join("")||"<p style='text-align:center;color:#a99'>没有记录</p>"};
ad.onclick=()=>{if(!it.value.trim()||!who.value.trim())return;const d=new Date();d.setDate(d.getDate()+ +dy.value);L.unshift({i:it.value.trim(),w:who.value.trim(),p:ph.value,d:td(),due:d.toISOString().slice(0,10),r:""});it.value=who.value=ph.value="";F="out";rd()};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F=b.dataset.f;rd()});q.oninput=rd;ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff物品,借用人,电话,借出,应还,归还\n"+L.map(x=>[x.i,x.w,x.p,x.d,x.due,x.r].join(",")).join("\n")]));a.download="借还登记.csv";a.click()};rd();window.__L=()=>L</script></html>
