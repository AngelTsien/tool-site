<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收据生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>收据生成</h1></header><main><div class=panel id=fm><div class=row><div style="flex:1"><label>机构/抬头</label><input id=org value="恩典教会" style="width:100%"></div><div><label>编号</label><input id=no></div><div><label>日期</label><input type=date id=dt></div></div><label>付款人 / 收款事由</label><div class=row><input id=py placeholder="付款人" value="张弟兄"><input id=fo placeholder="事由" value="营会报名费" style="flex:1"></div>
<label>项目</label><div id=its></div><p class=row><button class=alt id=ad>+ 添加项目</button><label>货币</label><select id=cu><option>¥</option><option>€</option><option>$</option></select><button onclick="print()">🖨 打印 / 存 PDF</button></p></div>
<div class=panel id=rc style="font-family:'Songti SC','Noto Serif CJK SC',serif;max-width:640px;margin:auto;border:2px solid #d9c3a8"></div><style>@media print{header,footer,#fm{display:none}.panel{box-shadow:none}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="receipt");r.unshift("receipt");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const D=new Date();dt.valueAsDate=D;no.value="R"+D.toISOString().slice(0,10).replace(/-/g,"")+"-01";let I=[["报名费",2,300],["T恤",2,45]];const big=n=>{const d="零壹贰叁肆伍陆柒捌玖",u=["","拾","佰","仟"],U=["","万","亿"];let [z,x]=n.toFixed(2).split(".");let s="";
const g=z.replace(/^0+/,"").split("").reverse();for(let i=0;i<g.length;i++){const k=+g[i];if(i%4==0)s=U[i/4]+s;s=(k?d[k]+u[i%4]:(s&&s[0]!="零"&&i%4?"零":""))+s}s=(s.replace(/零+(万|亿)/g,"$1").replace(/零+$/,"")||"零")+"元";if(!+z&&+x)s="";return s+(+x[0]?d[x[0]]+"角":"")+(+x[1]?d[x[1]]+"分":"")+(+x?"":"整")};
const ed=()=>{its.innerHTML=I.map((r,j)=>`<div class=row style="margin:4px 0"><input value="${r[0]}" oninput="I[${j}][0]=this.value;rd()" style="flex:1"><input type=number value="${r[1]}" oninput="I[${j}][1]=+this.value;rd()" style="width:70px"><input type=number value="${r[2]}" oninput="I[${j}][2]=+this.value;rd()" style="width:100px"><button class=alt onclick="I.splice(${j},1);ed()">✕</button></div>`).join("");rd()};
const rd=()=>{const T=I.reduce((s,r)=>s+r[1]*r[2],0),c=cu.value,td="style='padding:6px;border-bottom:1px solid #eee'";rc.innerHTML=`<h2 style="text-align:center;letter-spacing:8px;margin:4px">收 据</h2><p style="text-align:center;color:#8a7a6a">${org.value}</p><div class=row style="justify-content:space-between;font-size:14px"><span>No. ${no.value}</span><span>${dt.value}</span></div>
<p>今收到 <u>&nbsp;${py.value}&nbsp;</u> 交来 <u>&nbsp;${fo.value}&nbsp;</u></p><table style="width:100%;border-collapse:collapse"><tr style="background:#f7efe5"><th ${td}>项目</th><th ${td}>数量</th><th ${td}>单价</th><th ${td}>金额</th></tr>${I.map(r=>`<tr><td ${td}>${r[0]}</td><td ${td} align=center>${r[1]}</td><td ${td} align=right>${c}${(+r[2]).toFixed(2)}</td><td ${td} align=right>${c}${(r[1]*r[2]).toFixed(2)}</td></tr>`).join("")}</table>
<p style="font-size:18px">合计：<b>${c}${T.toFixed(2)}</b>${c=="¥"?`　（大写：${big(T)}）`:""}</p><div class=row style="justify-content:space-between;margin-top:30px"><span>收款人：________</span><span>经手人：________</span></div>`};
ad.onclick=()=>{I.push(["",1,0]);ed()};[org,no,dt,py,fo,cu].forEach(e=>e.oninput=rd);ed();window.__big=big</script></html>
