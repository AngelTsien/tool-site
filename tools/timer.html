<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讲道计时器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>讲道计时器</h1></header><main><div class=panel><div class=row><label>分钟</label><input id=m type=number value=30 style="width:90px"><button id=st>开始</button><button class=alt id=pa>暂停</button><button class=alt id=rs>重置</button><button class=alt id=fs>全屏</button></div>
<div id=box style="margin-top:14px;border-radius:16px;background:#2f3a2f;color:#fff;text-align:center;padding:30px 10px"><div id=d style="font-size:min(26vw,180px);font-variant-numeric:tabular-nums;font-weight:600">30:00</div><div id=h>准备开始</div></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="timer");r.unshift("timer");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let left=1800,t=null;const show=()=>{const a=Math.abs(left),s=(left<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");d.textContent=s;
box.style.background=left<0?"#8a2f2f":left<=120?"#b5742a":left<=300?"#8a7a2f":"#2f3a2f";h.textContent=left<0?"已超时":left<=120?"还剩 2 分钟内，准备收尾":left<=300?"还剩 5 分钟":"进行中"};
st.onclick=()=>{if(!t){if(d.textContent=="00:00"||!t&&h.textContent=="准备开始")left=m.value*60;t=setInterval(()=>{left--;show()},1000)}};pa.onclick=()=>{clearInterval(t);t=null;h.textContent="已暂停"};
rs.onclick=()=>{clearInterval(t);t=null;left=m.value*60;show();h.textContent="准备开始"};m.oninput=()=>{if(!t){left=m.value*60;show();h.textContent="准备开始"}};fs.onclick=()=>box.requestFullscreen();show();h.textContent="准备开始"</script></html>
