<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合租分摊 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>合租分摊</h1></header><main><div class=panel><h3>👥 室友</h3><div id=ps></div><button class=alt id=ap>+ 添加室友</button></div><div class=panel><h3>💶 费用</h3><div class=row><label>房租</label><input id=rt type=number value=1800 style="width:90px"><select id=rm><option value=area>按面积</option><option value=eq>平均</option></select><label>水电燃气网</label><input id=ut type=number value=240 style="width:90px"><select id=um><option value=days>按入住天数</option><option value=eq>平均</option></select><label>本期天数</label><input id=dd type=number value=30 style="width:60px"><select id=cu><option>€</option><option>¥</option></select></div></div>
<div class=panel><table id=tb style="width:100%;border-collapse:collapse"></table><p><button class=alt id=cp>复制分摊结果</button></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="rent");r.unshift("rent");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let P=JSON.parse(localStorage.rentp||'[{"n":"Angel","a":16,"d":30},{"n":"小李","a":12,"d":30},{"n":"小王","a":12,"d":20}]');
const ed=()=>{ps.innerHTML=P.map((p,i)=>`<div class=row style="margin:4px 0"><input value="${p.n}" oninput="P[${i}].n=this.value;rd()" style="width:110px"><label>房间 m²</label><input type=number value="${p.a}" oninput="P[${i}].a=+this.value;rd()" style="width:70px"><label>住了</label><input type=number value="${p.d}" oninput="P[${i}].d=+this.value;rd()" style="width:60px"><label>天</label><button class=alt onclick="P.splice(${i},1);ed()">✕</button></div>`).join("");rd()};
const rd=()=>{localStorage.rentp=JSON.stringify(P);const c=cu.value,A=P.reduce((s,p)=>s+p.a,0),D=P.reduce((s,p)=>s+Math.min(p.d,+dd.value),0),n=P.length||1;const R=P.map(p=>{const r=rm.value=="area"&&A?rt.value*p.a/A:rt.value/n,u=um.value=="days"&&D?ut.value*Math.min(p.d,+dd.value)/D:ut.value/n;return[p.n,r,u,r+u]});
const td="style='padding:8px;border-bottom:1px solid #f0e8e0;text-align:right'";tb.innerHTML=`<tr style="background:#f3e6d6"><th style="padding:8px;text-align:left">室友</th><th ${td}>房租</th><th ${td}>水电等</th><th ${td}>合计</th></tr>`+R.map(r=>`<tr><td style="padding:8px">${r[0]}</td><td ${td}>${c}${r[1].toFixed(2)}</td><td ${td}>${c}${r[2].toFixed(2)}</td><td ${td}><b>${c}${r[3].toFixed(2)}</b></td></tr>`).join("")+`<tr><td style="padding:8px"><b>总计</b></td><td ${td}>${c}${(+rt.value).toFixed(2)}</td><td ${td}>${c}${(+ut.value).toFixed(2)}</td><td ${td}><b>${c}${(+rt.value+ +ut.value).toFixed(2)}</b></td></tr>`;window.__R=R};
ap.onclick=()=>{P.push({n:"室友"+(P.length+1),a:10,d:+dd.value});ed()};[rt,rm,ut,um,dd,cu].forEach(e=>e.oninput=rd);cp.onclick=()=>navigator.clipboard.writeText(__R.map(r=>`${r[0]}：${cu.value}${r[3].toFixed(2)}（房租 ${r[1].toFixed(2)} + 水电 ${r[2].toFixed(2)}）`).join("\n"));ed()</script></html>
