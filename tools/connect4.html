<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四子棋 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>四子棋</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=md><option value=ai>🤖 人机对战</option><option value=2p>👥 双人对战</option></select><select id=lv><option value=2>简单</option><option value=4 selected>普通</option><option value=6>困难</option></select><button id=nw>🔄 新局</button><button class=alt id=un>↶ 悔棋</button></div>
<h3 id=st></h3><div id=bd style="display:inline-grid;grid-template-columns:repeat(7,1fr);gap:min(1.4vw,6px);background:#3d6fb6;padding:min(2vw,10px);border-radius:14px;width:min(calc(100vw - 64px),460px)"></div><p id=sc style="color:#7a706a"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="connect4");r.unshift("connect4");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const R=6,C=7;let B,H,turn,over,W=JSON.parse(localStorage.c4||'{"r":0,"y":0,"d":0}');const cl=["","#e94b3c","#f5c542"];
const drop=(b,c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][c]){b[r][c]=p;return r}return-1};
const win=(b,p)=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=0,L=[];for(;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C||b[rr][cc]!=p)break;L.push(rr*C+cc)}if(k==4)return L}return null};
const sc4=(b,p)=>{let s=0;const o=3-p;for(let r=0;r<R;r++)s+=b[r][3]==p?3:0;for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let m=0,n=0,ok=1;for(let k=0;k<4;k++){const rr=r+dr*k,cc=c+dc*k;if(rr<0||rr>=R||cc<0||cc>=C){ok=0;break}if(b[rr][cc]==p)m++;else if(b[rr][cc]==o)n++}if(!ok)continue;if(m&&!n)s+=m==3?5:m==2?2:0;if(n&&!m)s-=n==3?8:0}return s};
const ord=[3,2,4,1,5,0,6],mm=(b,d,a,be,mx)=>{if(win(b,2))return 1e5+d;if(win(b,1))return-1e5-d;const mv=ord.filter(c=>!b[0][c]);if(!d||!mv.length)return sc4(b,2);let v=mx?-1e9:1e9;for(const c of mv){const r=drop(b,c,mx?2:1),s=mm(b,d-1,a,be,!mx);b[r][c]=0;if(mx){v=Math.max(v,s);a=Math.max(a,v)}else{v=Math.min(v,s);be=Math.min(be,v)}if(a>=be)break}return v};
const ai=()=>{let bs=-1e9,bc=3;for(const c of ord){if(B[0][c])continue;const r=drop(B,c,2),s=mm(B,+lv.value,-1e9,1e9,false);B[r][c]=0;if(s>bs){bs=s;bc=c}}play(bc)};
const play=c=>{if(over||B[0][c])return;const r=drop(B,c,turn);H.push([r,c]);const w=win(B,turn);if(w){over=w;W[turn==1?"r":"y"]++}else if(H.length==R*C){over=[];W.d++}else turn=3-turn;localStorage.c4=JSON.stringify(W);draw();if(!over&&md.value=="ai"&&turn==2)setTimeout(ai,250)};
const draw=()=>{bd.innerHTML=B.flatMap((row,r)=>row.map((v,c)=>`<div data-c=${c} style="aspect-ratio:1;border-radius:50%;background:${v?cl[v]:"#f7f3ee"};cursor:pointer;${over&&over.includes(r*C+c)?"box-shadow:0 0 0 4px #fff inset;":""}${H.length&&H.at(-1)[0]==r&&H.at(-1)[1]==c?"animation:dp .3s":""}"></div>`)).join("");
st.textContent=over?(over.length?(turn==1?"🔴 红方":"🟡 黄方")+(md.value=="ai"&&turn==2?"（电脑）":"")+" 获胜！🎉":"🤝 平局"):(turn==1?"🔴 红方":"🟡 黄方")+" 落子";sc.textContent=`战绩：红 ${W.r} · 黄 ${W.y} · 平 ${W.d}`};
bd.onclick=e=>{const d=e.target.closest("[data-c]");if(!d||(md.value=="ai"&&turn==2))return;play(+d.dataset.c)};
un.onclick=()=>{if(over)return;const n=md.value=="ai"?2:1;for(let i=0;i<n&&H.length;i++){const[r,c]=H.pop();B[r][c]=0;turn=3-turn}if(md.value=="ai")turn=1;draw()};
nw.onclick=md.onchange=()=>{B=Array.from({length:R},()=>Array(C).fill(0));H=[];turn=1;over=null;draw()};document.head.insertAdjacentHTML("beforeend","<style>@keyframes dp{from{transform:translateY(-200%)}}</style>");nw.onclick();</script></html>
