<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今天吃什么 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>今天吃什么</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center" id=cs></div><div id=sh style="font-size:min(14vw,64px);font-weight:800;margin:26px 0;min-height:80px;background:linear-gradient(90deg,#e07a5f,#c48fa8);-webkit-background-clip:text;color:transparent">？？？</div><button id=go style="font-size:22px;padding:14px 46px">🎲 帮我决定</button><p id=hs style="color:#a99"></p></div>
<div class=panel><details><summary>✏️ 编辑菜单（每行一个）</summary><textarea id=t style="min-height:150px"></textarea><button id=sv>保存</button></details></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="eat");r.unshift("eat");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const M0={"🍚 中餐":"番茄炒蛋\n宫保鸡丁\n麻婆豆腐\n红烧肉\n兰州拉面\n饺子\n黄焖鸡米饭\n酸菜鱼\n火锅\n炒饭","🍝 西餐":"披萨\n意面\n汉堡\n牛排\n沙拉\n三明治\n烩饭\n千层面","🥡 外卖":"麦当劳\n寿司\n麻辣烫\n炸鸡\n螺蛳粉\n烤肉饭\n越南粉\n咖喱饭","🥗 轻食":"燕麦粥\n鸡胸沙拉\n蔬菜汤\n全麦三明治\n水果酸奶碗"};let M=JSON.parse(localStorage.eatm||"null")||M0,cat=Object.keys(M)[0],H=[];
const tabs=()=>{cs.innerHTML=Object.keys(M).map(k=>`<button class="${k==cat?"":"alt"}" onclick="cat='${k}';tabs()">${k}</button>`).join("");t.value=M[cat]};
go.onclick=()=>{const L=M[cat].split("\n").filter(Boolean);if(!L.length)return;go.disabled=true;let n=0,d=50;const spin=()=>{sh.textContent=L[Math.random()*L.length|0];if(++n<18){d*=1.12;setTimeout(spin,d)}else{const r=L[crypto.getRandomValues(new Uint32Array(1))[0]%L.length];sh.textContent=r;sh.animate([{transform:"scale(1.4)"},{transform:"scale(1)"}],400);H.unshift(r);hs.textContent="刚才抽到："+H.slice(0,5).join("、");go.disabled=false}};spin()};
sv.onclick=()=>{M[cat]=t.value.trim();localStorage.eatm=JSON.stringify(M)};tabs()</script></html>
