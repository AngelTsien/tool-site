<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>讲道提词器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>讲道提词器</h1></header><main><div class=panel id=cfg><textarea id=t style="min-height:140px">各位弟兄姊妹平安！今天我们一起来看尼希米记。
尼希米身在波斯王宫，生活安逸，但当他听见耶路撒冷城墙拆毁、城门被火焚烧，他就坐下哭泣，悲哀几日，在天上的神面前禁食祈祷。
我们今天的主题是：堵住破口。</textarea>
<div class=row><label>字号</label><input type=range id=fs min=24 max=96 value=48><label>速度</label><input type=range id=sp min=5 max=200 value=40><label><input type=checkbox id=mi> 镜像</label><button id=go>▶ 开始提词</button></div><p style="font-size:13px;color:#a99">提词时：空格 暂停/继续，↑↓ 调速，Esc 退出；手机可点屏幕暂停</p></div>
<div id=st style="display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:9;overflow:hidden"><div style="position:absolute;top:45%;left:0;right:0;height:3px;background:#e07a5f88;z-index:2"></div><div id=tx style="padding:50vh 8vw;line-height:1.6;white-space:pre-wrap"></div><div id=hud style="position:fixed;bottom:10px;right:14px;color:#888;font-size:14px;z-index:3"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="prompter");r.unshift("prompter");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let y=0,run=false,last=0,on=false;const hd=()=>hud.textContent=`速度 ${sp.value}　${run?"▶":"⏸"}　${Math.min(100,Math.round(y/Math.max(1,tx.scrollHeight-innerHeight)*100))}%`;
const loop=t=>{if(!on)return;if(run&&last)y+=sp.value*(t-last)/1000;last=t;tx.style.transform=`translateY(${-y}px)`+(mi.checked?" scaleX(-1)":"");hd();requestAnimationFrame(loop)};
go.onclick=()=>{tx.textContent=t.value;tx.style.fontSize=fs.value+"px";y=0;st.style.display="";on=run=true;last=0;st.requestFullscreen?.().catch(()=>{});requestAnimationFrame(loop)};
const ex=()=>{on=false;st.style.display="none";document.fullscreenElement&&document.exitFullscreen()};st.onclick=()=>{run=!run;last=0};
onkeydown=e=>{if(!on)return;if(e.code=="Space"){e.preventDefault();run=!run;last=0}if(e.key=="ArrowUp")sp.value=+sp.value+10;if(e.key=="ArrowDown")sp.value=Math.max(5,sp.value-10);if(e.key=="Escape")ex()};window.__y=()=>y</script></html>
