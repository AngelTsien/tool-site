<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飞行棋 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>飞行棋</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><select id=np><option value=2>2 人</option><option value=3>3 人</option><option value=4 selected>4 人</option></select><select id=ai><option value=0>全部真人</option><option value=1 selected>我 vs 电脑</option></select><button id=nw>🔄 新游戏</button></div>
<canvas id=cv width=660 height=660 style="width:min(calc(100vw - 64px),460px);margin-top:10px;border-radius:14px"></canvas><h3 id=st style="margin:8px 0"></h3><div class=row style="justify-content:center"><button id=rl style="font-size:22px;padding:12px 26px">🎲 掷骰子</button><span id=dv style="font-size:46px;width:60px"></span></div><p id=lg style="color:#7a706a;font-size:14px;min-height:40px"></p>
<p style="color:#999;font-size:12px">规则：掷到 6 才能起飞，6 可再掷一次；踩到别人的飞机送它回家；走完一圈进入自己颜色的跑道，正好到终点为胜，超出会弹回。四架都到达者获胜。</p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="ludo");r.unshift("ludo");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const N=11,Z=60,COL=["#e94b3c","#3d8bd9","#f2b632","#3fae5a"],NM=["红","蓝","黄","绿"],LOOP=[];for(let c=0;c<N;c++)LOOP.push([0,c]);for(let r=1;r<N;r++)LOOP.push([r,N-1]);for(let c=N-2;c>=0;c--)LOOP.push([N-1,c]);for(let r=N-2;r>0;r--)LOOP.push([r,0]);
const ST=[5,15,25,35],LANE=[[[1,5],[2,5],[3,5],[4,5]],[[5,9],[5,8],[5,7],[5,6]],[[9,5],[8,5],[7,5],[6,5]],[[5,1],[5,2],[5,3],[5,4]]],HG=[[[2,2],[2,3],[3,2],[3,3]],[[2,7],[2,8],[3,7],[3,8]],[[7,7],[7,8],[8,7],[8,8]],[[7,2],[7,3],[8,2],[8,3]]];
let PL,pcs,cur,die,moved,over,wait;const x=cv.getContext("2d");
const cell=(c,p,i)=>p<0?HG[c][i]:p<40?LOOP[(ST[c]+p)%40]:p<44?LANE[c][p-40]:[5,5];
const draw=()=>{x.fillStyle="#fbf7f0";x.fillRect(0,0,660,660);LOOP.forEach(([r,c],i)=>{const o=ST.indexOf(i);x.fillStyle=o>=0&&o<PL?COL[o]+"aa":i%2?"#fff":"#f1e8dc";x.fillRect(c*Z+2,r*Z+2,Z-4,Z-4)});
for(let c=0;c<4;c++){if(c>=PL)continue;LANE[c].forEach(([r,cc])=>{x.fillStyle=COL[c]+"55";x.fillRect(cc*Z+2,r*Z+2,Z-4,Z-4)});x.fillStyle=COL[c]+"22";const[a,b]=HG[c][0];x.fillRect(b*Z-10,a*Z-10,2*Z+20,2*Z+20)}
x.fillStyle="#fff3c4";x.beginPath();x.arc(5.5*Z,5.5*Z,Z*.48,0,7);x.fill();x.font="30px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🏁",5.5*Z,5.5*Z);
const cnt={};pcs.forEach((a,c)=>a.forEach((p,i)=>{if(p>=44)return;const[r,cc]=cell(c,p,i),k=r+","+cc,n=cnt[k]=(cnt[k]||0)+1,mv=wait&&c==cur&&canMove(c,i);x.fillStyle=COL[c];x.beginPath();x.arc(cc*Z+Z/2+(n-1)*6,r*Z+Z/2-(n-1)*6,Z*.34,0,7);x.fill();x.lineWidth=mv?5:2;x.strokeStyle=mv?"#222":"#fff";x.stroke();x.fillStyle="#fff";x.font="bold 20px sans-serif";x.fillText("✈",cc*Z+Z/2+(n-1)*6,r*Z+Z/2-(n-1)*6)}));
pcs.forEach((a,c)=>{const f=a.filter(p=>p>=44).length;if(f){x.fillStyle=COL[c];x.font="bold 16px sans-serif";x.fillText("✓"+f,(5.5+[0,.7,0,-.7][c])*Z,(5.5+[-.7,0,.7,0][c])*Z)}});
st.textContent=over?`🏆 ${NM[over-1]}方获胜！`:`轮到 ${NM[cur]}方${isAI(cur)?"（电脑）":""} ${wait?"— 请选择要走的飞机":""}`;st.style.color=COL[cur];rl.disabled=wait||over||isAI(cur)};
const isAI=c=>ai.value=="1"&&c>0,canMove=(c,i)=>{const p=pcs[c][i];return p<0?die==6:p<44};
const log=s=>{lg.innerHTML=s+"<br>"+lg.innerHTML.split("<br>").slice(0,2).join("<br>")};
const move=(c,i)=>{let p=pcs[c][i];if(p<0){p=0;log(`${NM[c]}方起飞 ✈`)}else{p+=die;if(p>44)p=88-p}pcs[c][i]=p;if(p<40){const[r,cc]=cell(c,p);pcs.forEach((a,o)=>{if(o!=c)a.forEach((q,j)=>{if(q>=0&&q<40){const[r2,c2]=cell(o,q);if(r2==r&&c2==cc){a[j]=-1;log(`💥 ${NM[c]}方把${NM[o]}方飞机撞回家！`)}}})})}
if(p==44)log(`🎉 ${NM[c]}方一架飞机到达终点`);if(pcs[c].every(q=>q>=44)){over=c+1;wait=0;draw();return}wait=0;if(die!=6)cur=(cur+1)%PL;draw();next()};
const roll=()=>{die=1+Math.random()*6|0;dv.textContent="⚀⚁⚂⚃⚄⚅"[die-1];const ok=pcs[cur].map((_,i)=>i).filter(i=>canMove(cur,i));if(!ok.length){log(`${NM[cur]}方掷出 ${die}，无法移动`);if(die!=6)cur=(cur+1)%PL;draw();next();return}
log(`${NM[cur]}方掷出 ${die}`);if(isAI(cur)){const sc=i=>{const p=pcs[cur][i];if(p<0)return 50;let q=p+die;if(q>44)q=88-q;if(q==44)return 100;let s=q;if(q<40){const[r,cc]=cell(cur,q);pcs.forEach((a,o)=>o!=cur&&a.forEach(z=>{if(z>=0&&z<40){const[r2,c2]=cell(o,z);if(r2==r&&c2==cc)s+=80}}))}return s};setTimeout(()=>move(cur,ok.sort((a,b)=>sc(b)-sc(a))[0]),500)}else if(ok.length==1)setTimeout(()=>move(cur,ok[0]),300);else{wait=1;draw()}};
const next=()=>{if(!over&&isAI(cur))setTimeout(roll,700)};rl.onclick=()=>{if(!wait&&!over&&!isAI(cur))roll()};
cv.onclick=e=>{if(!wait)return;const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)*660/r.width/Z,cy=(e.clientY-r.top)*660/r.height/Z;pcs[cur].forEach((p,i)=>{if(!canMove(cur,i))return;const[rr,cc]=cell(cur,p,i);if(Math.abs(cc+.5-cx)<.6&&Math.abs(rr+.5-cy)<.6&&wait){move(cur,i)}})};
nw.onclick=()=>{PL=+np.value;pcs=Array.from({length:PL},()=>[-1,-1,-1,-1]);cur=0;die=0;over=0;wait=0;lg.innerHTML="";dv.textContent="";draw()};np.onchange=ai.onchange=nw.onclick;nw.onclick();window.__g=()=>({pcs,cur,over,wait});</script></html>
