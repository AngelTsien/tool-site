<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片压缩/转换 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>图片压缩/转换</h1></header><main><div class=panel><input type=file id=f accept="image/*"><div class=row><div><label>格式</label><select id=fmt><option>image/jpeg</option><option>image/webp</option><option>image/png</option></select></div>
<div><label>质量 <span id=qv>80</span>%</label><input type=range id=q min=10 max=100 value=80></div><div><label>最大宽度(px)</label><input id=mw type=number value=1600 style="width:110px"></div></div>
<p><button id=go>压缩/转换</button> <a id=dl style="display:none"><button class=alt>下载</button></a></p><p id=info></p></div><div class=panel><img id=out></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="image");r.unshift("image");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>q.oninput=()=>qv.textContent=q.value;const kb=n=>(n/1024).toFixed(1)+" KB";
go.onclick=()=>{const file=f.files[0];if(!file)return info.textContent="请先选择图片";const im=new Image();im.onload=()=>{const s=Math.min(1,mw.value/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;const x=c.getContext("2d");
if(fmt.value=="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{out.src=dl.href=URL.createObjectURL(b);dl.download=file.name.replace(/\.\w+$/,"")+"."+fmt.value.split("/")[1];dl.style.display="";
info.textContent=`原图 ${kb(file.size)}（${im.width}×${im.height}）→ ${kb(b.size)}（${c.width|0}×${c.height|0}），减少 ${Math.max(0,100-b.size/file.size*100).toFixed(0)}%`+(b.size>=file.size?'（原图已经很小，建议直接用原图或降低质量）':'')},fmt.value,q.value/100)};im.src=URL.createObjectURL(file)}</script></html>
