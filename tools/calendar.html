<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>年历打印 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>年历打印</h1></header><main><div class=panel><div class=row><button class=alt id=pv>◀</button><input id=yr type=number style="width:90px"><select id=mo><option value=0>全年</option>${""}</select><button class=alt id=nx>▶</button><label><input type=checkbox id=ln checked> 农历/节气</label><label><input type=checkbox id=mn checked> 周一开始</label><select id=th><option value="#d9a47c">暖棕</option><option value="#6a9f7f">绿</option><option value="#5a7fb5">蓝</option><option value="#c46a8a">玫瑰</option></select><button onclick="print()">🖨 打印</button></div></div>
<div id=cal style="background:#fff;padding:16px;border-radius:12px"></div><style>@media print{header,footer,.panel{display:none!important}#cal{padding:0}.mon{break-inside:avoid}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/lunar.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="calendar");r.unshift("calendar");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const T=new Date();yr.value=T.getFullYear();mo.innerHTML='<option value=0>全年</option>'+Array.from({length:12},(_,i)=>`<option value=${i+1}>${i+1} 月</option>`).join("");mo.value=T.getMonth()+1;
const month=(y,m,big)=>{const c=th.value,f=new Date(y,m-1,1).getDay(),off=mn.checked?(f+6)%7:f,n=new Date(y,m,0).getDate(),H=mn.checked?"一二三四五六日":"日一二三四五六";let h=`<div class=mon style="padding:${big?0:6}px"><h${big?2:4} style="margin:4px 0;color:${c}">${y} 年 ${m} 月</h${big?2:4}><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:${big?6:1}px;text-align:center;font-size:${big?16:11}px">`+[...H].map((w,i)=>`<b style="color:${(mn.checked?i>=5:i==0||i==6)?c:"#888"}">${w}</b>`).join("")+"<div></div>".repeat(off);
for(let d=1;d<=n;d++){const D=new Date(y,m-1,d),we=D.getDay()==0||D.getDay()==6,td=D.toDateString()==T.toDateString();let sub="";if(ln.checked)try{const L=Solar.fromYmd(y,m,d).getLunar(),fe=[...L.getFestivals(),...Solar.fromYmd(y,m,d).getFestivals()][0];sub=fe||L.getJieQi()||(L.getDay()==1?L.getMonthInChinese()+"月":L.getDayInChinese())}catch(e){}
h+=`<div style="padding:${big?"8px 2px":"2px 0"};border-radius:6px;${td?`background:${c};color:#fff`:we?`color:${c}`:""}"><div style="font-weight:${big?700:500}">${d}</div>${sub&&(big||ln.checked)?`<div style="font-size:${big?11:8}px;opacity:.75;white-space:nowrap;overflow:hidden">${sub}</div>`:""}</div>`}return h+"</div></div>"};
const rd=()=>{const y=+yr.value;cal.innerHTML=+mo.value?month(y,+mo.value,true):`<h1 style="text-align:center;color:${th.value};margin:0 0 10px">${y}</h1><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px">${Array.from({length:12},(_,i)=>month(y,i+1)).join("")}</div>`};
pv.onclick=()=>{if(+mo.value){if(mo.value==1){mo.value=12;yr.value--}else mo.value--}else yr.value--;rd()};nx.onclick=()=>{if(+mo.value){if(mo.value==12){mo.value=1;yr.value++}else mo.value++}else yr.value++;rd()};[yr,mo,ln,mn,th].forEach(e=>e.onchange=rd);rd()</script></html>
