<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字帖生成 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>字帖生成</h1></header><main><div class=panel><label>练习的字（每个字一行或连续写）</label><textarea id=t style="min-height:60px">恩典平安喜乐信望爱</textarea><div class=row><select id=gt><option value=tian>田字格</option><option value=mi>米字格</option><option value=fang>方格</option><option value=hui>回宫格</option></select><label>每字一行，共</label><input id=rp type=number value=8 style="width:60px"><label>格（描红</label><input id=tr type=number value=3 style="width:50px"><label>个）</label>
<select id=ft><option value='"Kaiti SC","STKaiti","AR PL UKai CN","KaiTi",serif'>楷体</option><option value='"Songti SC","Noto Serif CJK SC",serif'>宋体</option><option value='"PingFang SC","Noto Sans CJK SC",sans-serif'>黑体</option></select><select id=cl><option value="#d33">红格</option><option value="#3a7a4a">绿格</option><option value="#555">黑格</option></select><button onclick="print()">🖨 打印</button></div><label><input type=checkbox id=py> 显示拼音（需拼音库）</label></div>
<div id=sheet style="background:#fff;padding:20px;border-radius:12px;max-width:820px;margin:auto"></div><style>@media print{header,footer,.panel{display:none!important}#sheet{padding:0}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="copybook");r.unshift("copybook");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const cell=(ch,mode)=>{const c=cl.value,g=gt.value,b=`<rect x=1 y=1 width=98 height=98 fill=none stroke="${c}" stroke-width=2 />`,d=`stroke="${c}" stroke-width=1 stroke-dasharray="4 4" opacity=.6`;let ln="";if(g=="tian"||g=="mi")ln+=`<line x1=50 y1=0 x2=50 y2=100 ${d}/><line x1=0 y1=50 x2=100 y2=50 ${d}/>`;if(g=="mi")ln+=`<line x1=0 y1=0 x2=100 y2=100 ${d}/><line x1=100 y1=0 x2=0 y2=100 ${d}/>`;if(g=="hui")ln+=`<rect x=22 y=22 width=56 height=56 fill=none ${d}/>`;
return`<svg viewBox="0 0 100 100" style="width:100%;display:block">${b}${ln}${ch?`<text x=50 y=52 text-anchor=middle dominant-baseline=central font-size=78 font-family='${ft.value}' fill="${mode==0?"#222":"#bbb"}" opacity="${mode==2?.35:1}">${ch}</text>`:""}</svg>`};
const f=()=>{const C=[...t.value.replace(/\s/g,"")],N=Math.max(4,Math.min(14,+rp.value)),T=+tr.value;sheet.innerHTML=`<h2 style="text-align:center;font-family:${ft.value};margin:0 0 12px">练 字 帖</h2><p style="text-align:right;color:#888;font-size:13px">姓名：________　日期：________</p>`+C.map(ch=>`<div style="display:grid;grid-template-columns:repeat(${N},1fr);margin-bottom:6px">${Array.from({length:N},(_,i)=>`<div>${cell(i==0?ch:i<=T?ch:"",i==0?0:i==1?1:2)}</div>`).join("")}</div>`).join("")};
[t,gt,rp,tr,ft,cl].forEach(e=>e.oninput=f);f()</script></html>
