<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>计算器 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>计算器</h1></header><main><div class=panel style="max-width:380px;margin:auto"><div id=ex style="text-align:right;color:#a99;min-height:24px;word-break:break-all"></div><div id=sc style="text-align:right;font-size:44px;font-weight:600;word-break:break-all">0</div><div id=k style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="calc");r.unshift("calc");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let e="";const K="C ⌫ % ÷ 7 8 9 × 4 5 6 − 1 2 3 + ± 0 . =".split(" ");K.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.style.cssText="font-size:24px;padding:16px 0";if(!/[\d.]/.test(c))b.className=c=="="?"":"alt";b.onclick=()=>p(c);k.appendChild(b)});
const ev=s=>{s=s.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/%/g,"/100");if(!/^[\d+\-*/.() ]+$/.test(s))throw 0;return +Function("return "+s)().toPrecision(12)};
function p(c){if(c=="C")e="";else if(c=="⌫")e=e.slice(0,-1);else if(c=="="){try{ex.textContent=e+" =";e=String(ev(e))}catch(_){sc.textContent="错误";e="";return}}else if(c=="±")e=e?"-("+e+")":"";else e+=c;sc.textContent=e||"0";if(c!="=")try{ex.textContent=e?"= "+ev(e):""}catch(_){}}
onkeydown=x=>{const m={"*":"×","/":"÷","-":"−",Enter:"=",Backspace:"⌫",Escape:"C"}[x.key]||x.key;if(K.includes(m))p(m)}</script></html>
