const AL={"马利亚(马大的姐妹)":["马利亚","伯大尼的马利亚"]};let Q=[],k=0,n=1,sc0=0,done=false;const sh=()=>{Q=[...P].sort(()=>Math.random()-.5);k=0;sc0=0};
