<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 小游戏 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>2048 小游戏</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><div class=stat style="width:220px"><div><b id=sc>0</b>分数</div><div><b id=be>0</b>最高</div></div><button id=ng>新游戏</button></div>
<div id=bd style="touch-action:none;margin:14px auto;width:min(90vw,360px);aspect-ratio:1;background:#d8cbbd;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div><p style="color:#a99">方向键或在格子上滑动</p><p id=ms style="font-size:20px"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="game2048");r.unshift("game2048");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let G,S;const C={2:"#f3ece2",4:"#efe0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
const add=()=>{const e=[];G.forEach((v,i)=>!v&&e.push(i));if(e.length)G[e[Math.random()*e.length|0]]=Math.random()<.9?2:4};
const dr=()=>{bd.innerHTML=G.map(v=>`<div style="background:${v?C[v]||"#3c3a32":"#eee4da66"};border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${v>=1024?20:v>=128?24:30}px;color:${v>4?"#fff":"#776e65"}">${v||""}</div>`).join("");sc.textContent=S;be.textContent=localStorage.b2048=Math.max(S,+localStorage.b2048||0)};
const ng0=()=>{G=Array(16).fill(0);S=0;ms.textContent="";add();add();dr()};
function mv(d){let ch=0;for(let a=0;a<4;a++){const idx=[0,1,2,3].map(b=>d==0?a*4+b:d==1?a*4+3-b:d==2?b*4+a:(3-b)*4+a);let r=idx.map(i=>G[i]).filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]==r[i+1]){r[i]*=2;S+=r[i];if(r[i]==2048)ms.textContent="🎉 达成 2048！";r.splice(i+1,1)}
while(r.length<4)r.push(0);idx.forEach((i,k)=>{if(G[i]!=r[k])ch=1;G[i]=r[k]})}if(ch){add();dr();if(!G.includes(0)&&![...Array(16).keys()].some(i=>(i%4<3&&G[i]==G[i+1])||(i<12&&G[i]==G[i+4])))ms.textContent="游戏结束，再来一局？"}}
onkeydown=e=>{const k={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(k!=null){e.preventDefault();mv(k)}};let sx,sy;bd.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
bd.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)mv(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3))};ng.onclick=ng0;ng0()</script></html>
