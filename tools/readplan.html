<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>读经计划 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>读经计划</h1></header><main><div class=panel><div class=row><div><label>范围</label><select id=sc><option value=all>全本圣经</option><option value=nt>新约</option><option value=ot>旧约</option><option value=gos>四福音</option><option value=ps>诗篇+箴言</option></select></div>
<div><label>天数</label><input id=d type=number value=365 style="width:100px"></div><div><label>开始日期</label><input id=st type=date></div></div><p class=row><button id=go>生成计划</button><button class=alt onclick="print()">打印</button><button class=alt id=csv>下载 CSV</button></p><p id=info></p></div><div class=panel><div id=out></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="readplan");r.unshift("readplan");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const B="创世记50出埃及记40利未记27民数记36申命记34约书亚记24士师记21路得记4撒母耳记上31撒母耳记下24列王纪上22列王纪下25历代志上29历代志下36以斯拉记10尼希米记13以斯帖记10约伯记42诗篇150箴言31传道书12雅歌8以赛亚书66耶利米书52耶利米哀歌5以西结书48但以理书12何西阿书14约珥书3阿摩司书9俄巴底亚书1约拿书4弥迦书7那鸿书3哈巴谷书3西番雅书3哈该书2撒迦利亚书14玛拉基书4马太福音28马可福音16路加福音24约翰福音21使徒行传28罗马书16哥林多前书16哥林多后书13加拉太书6以弗所书6腓立比书4歌罗西书4帖撒罗尼迦前书5帖撒罗尼迦后书3提摩太前书6提摩太后书4提多书3腓利门书1希伯来书13雅各书5彼得前书5彼得后书3约翰一书5约翰二书1约翰三书1犹大书1启示录22".match(/[^\d]+\d+/g).map(s=>[s.match(/\D+/)[0],+s.match(/\d+/)[0]]);
st.valueAsDate=new Date();let rows=[];
go.onclick=()=>{const r={all:[0,66],ot:[0,39],nt:[39,66],gos:[39,43],ps:[18,20]}[sc.value];const ch=[];B.slice(...r).forEach(([n,c])=>{for(let i=1;i<=c;i++)ch.push([n,i])});const D=Math.max(1,Math.min(+d.value,ch.length));rows=[];
for(let i=0;i<D;i++){const a=ch.slice(Math.floor(i*ch.length/D),Math.floor((i+1)*ch.length/D));const g=[];a.forEach(([n,c])=>{const l=g[g.length-1];if(l&&l[0]==n)l[2]=c;else g.push([n,c,c])});
const dt=new Date(st.value);dt.setDate(dt.getDate()+i);rows.push([i+1,dt.toLocaleDateString("zh-CN"),g.map(([n,a,b])=>a==b?n+" "+a:n+" "+a+"-"+b).join("；")])}
info.textContent=`共 ${ch.length} 章，${D} 天，平均每天 ${(ch.length/D).toFixed(1)} 章`;out.innerHTML="<table style='width:100%;border-collapse:collapse'>"+rows.map(r=>`<tr style="border-bottom:1px solid #eee"><td>☐ 第${r[0]}天</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")+"</table>"};
csv.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff天,日期,经文\n"+rows.map(r=>r.join(",")).join("\n")]));a.download="读经计划.csv";a.click()};go.onclick()</script></html>
