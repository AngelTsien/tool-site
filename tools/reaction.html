<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反应力测试 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>反应力测试</h1></header><main><div class=row style="justify-content:center;margin-bottom:10px"><button id=m1>⚡ 反应速度</button><button class=alt id=m2>🔨 打地鼠</button></div>
<div id=A class=panel style="text-align:center"><div id=pad style="height:280px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;user-select:none;font-size:26px;color:#fff;background:#3a6ea5">点击开始</div><p id=rs></p></div>
<div id=Bm class=panel style="text-align:center;display:none"><div class=row style="justify-content:center"><span>得分 <b id=ws>0</b></span><span>⏱ <b id=wt>30</b>s</span><span>最高 <b id=wh></b></span><button id=wg>开始</button></div><div id=holes style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:360px;margin:16px auto"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="reaction");r.unshift("reaction");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let st="idle",t0,to,R=[];m1.onclick=()=>{A.style.display="";Bm.style.display="none";m1.className="";m2.className="alt"};m2.onclick=()=>{A.style.display="none";Bm.style.display="";m2.className="";m1.className="alt"};
const set=(bg,h)=>{pad.style.background=bg;pad.innerHTML=h};pad.onpointerdown=()=>{if(st=="idle"||st=="done"){st="wait";set("#c05a4a","等变绿…");to=setTimeout(()=>{st="go";t0=performance.now();set("#4a9a5a","点！")},1500+Math.random()*2500)}
else if(st=="wait"){clearTimeout(to);st="done";set("#e8b84a","太早了！<span style=font-size:16px>点击重试</span>")}else if(st=="go"){const ms=Math.round(performance.now()-t0);R.push(ms);st="done";const av=Math.round(R.reduce((a,b)=>a+b)/R.length);
set("#3a6ea5",`${ms} ms<span style=font-size:16px>${ms<200?"⚡ 闪电反应！":ms<280?"👍 很不错":ms<400?"🙂 正常水平":"🐢 再试试"}<br>点击再来</span>`);rs.textContent=`已测 ${R.length} 次 · 平均 ${av} ms · 最快 ${Math.min(...R)} ms`;if(!localStorage.rbest||ms<localStorage.rbest)localStorage.rbest=ms}};
wh.textContent=localStorage.mole||0;holes.innerHTML=Array.from({length:9},(_,i)=>`<div data-h=${i} style="aspect-ratio:1;border-radius:50%;background:radial-gradient(#5a4030,#8a6a50);display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;user-select:none;transition:.1s"></div>`).join("");
let sc=0,on=false,cur=-1,mt,gt;const H=[...holes.children];const pop=()=>{if(!on)return;H.forEach(h=>h.textContent="");cur=Math.random()*9|0;const gold=Math.random()<.15;H[cur].textContent=gold?"🌟":"🐹";H[cur].dataset.g=gold?1:0;mt=setTimeout(pop,Math.max(450,900-sc*10))};
holes.onpointerdown=e=>{const h=e.target.closest("[data-h]");if(!on||!h)return;if(+h.dataset.h==cur&&h.textContent){sc+=h.dataset.g=="1"?3:1;ws.textContent=sc;h.textContent="💥";cur=-1;clearTimeout(mt);setTimeout(pop,250)}};
wg.onclick=()=>{sc=0;ws.textContent=0;on=true;let t=30;wt.textContent=t;clearInterval(gt);gt=setInterval(()=>{wt.textContent=--t;if(t<=0){on=false;clearInterval(gt);clearTimeout(mt);H.forEach(h=>h.textContent="");if(sc>(+localStorage.mole||0))localStorage.mole=sc;wh.textContent=localStorage.mole;wt.textContent="结束"}},1000);pop()};window.__cur=()=>cur</script></html>
