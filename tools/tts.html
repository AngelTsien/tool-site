<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字朗读 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>文字朗读</h1></header><main><div class=panel><textarea id=t>主祝福你，保护你。愿主使他的脸光照你，赐恩给你。</textarea><div class=row><div><label>声音</label><select id=vo></select></div><div><label>语速 <span id=rv>1</span></label><input type=range id=r min=0.5 max=2 step=0.1 value=1></div></div>
<p class=row><button id=pl>▶ 朗读</button><button class=alt id=ps>⏸ 暂停/继续</button><button class=alt id=sp>⏹ 停止</button></p><p id=msg style="color:#a99"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="tts");r.unshift("tts");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const S=speechSynthesis;let V=[];const lv=()=>{V=S.getVoices();vo.innerHTML="";V.forEach((v,i)=>{if(/zh|cmn|en/i.test(v.lang))vo.add(new Option(v.name+" ("+v.lang+")",i))});msg.textContent=V.length?"":"浏览器还没有可用的语音（手机和电脑浏览器一般都有）"};
lv();S.onvoiceschanged=lv;r.oninput=()=>rv.textContent=r.value;pl.onclick=()=>{S.cancel();const u=new SpeechSynthesisUtterance(t.value);if(V[vo.value])u.voice=V[vo.value];u.lang="zh-CN";u.rate=r.value;S.speak(u)};
ps.onclick=()=>S.paused?S.resume():S.pause();sp.onclick=()=>S.cancel()</script></html>
