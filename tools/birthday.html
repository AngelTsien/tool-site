<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生日提醒 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>生日提醒</h1></header><main><div class=panel><div class=row><input id=nm placeholder="姓名" style="width:120px"><input type=date id=bd><label><input type=checkbox id=ny> 不知道年份</label><input id=nt placeholder="备注（如：送书）" style="flex:1"><button id=ad>添加</button></div></div><div id=up class=panel style="display:none;background:linear-gradient(135deg,#fde8d8,#f6e0ec)"></div><div id=ls class=grid></div>
<div class=panel><p class=row><button class=alt id=ex>导出</button><label class=alt style="cursor:pointer">导入 <input type=file id=im accept=".json" style="display:none"></label></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="birthday");r.unshift("birthday");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.bday||'[{"n":"妈妈","d":"1965-12-08","t":""},{"n":"小明","d":"2015-11-03","t":"送绘本圣经"}]');const T=new Date();T.setHours(0,0,0,0);
const nx=d=>{const[y,m,dd]=d.split("-").map(Number);let n=new Date(T.getFullYear(),m-1,dd);if(n<T)n=new Date(T.getFullYear()+1,m-1,dd);return[Math.round((n-T)/864e5),y>1900?n.getFullYear()-y:null,n]};const W="日一二三四五六";
const rd=()=>{localStorage.bday=JSON.stringify(L);const S=L.map((x,i)=>[x,i,...nx(x.d)]).sort((a,b)=>a[2]-b[2]);ls.innerHTML=S.map(([x,i,k,a,n])=>`<div class=card style="--c:${k==0?"#f6c9b4":k<=7?"#f6d9a8":"#eee"};text-align:center"><div style="font-size:30px">${k==0?"🎉":"🎂"}</div><h3>${x.n}</h3><p>${n.getMonth()+1}月${n.getDate()}日 周${W[n.getDay()]}${a!=null?` · ${a} 岁`:""}</p><div style="font-size:28px;font-weight:700;color:#b98a62">${k==0?"就是今天！":k+" 天后"}</div><p>${x.t||""}</p><button class=alt onclick="confirm('删除？')&&(L.splice(${i},1),rd())">删除</button></div>`).join("");
const soon=S.filter(s=>s[2]<=7);up.style.display=soon.length?"":"none";up.innerHTML="<b>🔔 一周内的生日：</b>"+soon.map(s=>`${s[0].n}（${s[2]?s[2]+" 天后":"今天"}）`).join("、")};
ad.onclick=()=>{if(!nm.value||!bd.value)return;L.push({n:nm.value,d:ny.checked?"1900"+bd.value.slice(4):bd.value,t:nt.value});nm.value=nt.value="";rd()};
ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)]));a.download="生日列表.json";a.click()};im.onchange=()=>{const r=new FileReader();r.onload=()=>{try{L=JSON.parse(r.result);rd()}catch(e){alert("文件格式不对")}};r.readAsText(im.files[0])};rd()</script></html>
