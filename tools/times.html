<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乘法表练习 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>乘法表练习</h1></header><main><div class=row style="justify-content:center;margin-bottom:10px"><button id=m1>📋 乘法表</button><button class=alt id=m2>⚡ 限时挑战</button></div><div id=A class=panel style="overflow:auto"><p style="color:#a99;font-size:13px">点任意一格听口诀</p><div id=tb style="display:grid;grid-template-columns:repeat(9,minmax(64px,1fr));gap:4px;min-width:600px"></div></div>
<div id=Bx class=panel style="display:none;text-align:center"><div class=row style="justify-content:center"><label>只练</label><select id=only><option value=0>全部</option>${[2,3,4,5,6,7,8,9].map(n=>`<option>${n}</option>`).join("")}</select><select id=dur><option>30</option><option selected>60</option><option>90</option></select>秒<button id=go>开始</button></div>
<div id=q style="font-size:56px;font-weight:800;margin:20px 0">准备好了吗？</div><input id=an type=number inputmode=numeric style="font-size:32px;width:140px;text-align:center"><div class=row style="justify-content:center;margin-top:10px" id=kp></div><p><span>⏱ <b id=tm>0</b></span>　<span>✅ <b id=ok>0</b></span>　<span>❌ <b id=ng>0</b></span>　<span>最高 <b id=hi></b></span></p><p id=wr style="color:#c05a4a"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="times");r.unshift("times");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const CN="零一二三四五六七八九",cn=n=>n<10?CN[n]:n%10?(n<20?"十":CN[n/10|0]+"十")+CN[n%10]:CN[n/10]+"十",kj=(a,b)=>{const r=a*b;return CN[a]+CN[b]+(r<10?"得":"")+cn(r)};
only.innerHTML='<option value=0>全部</option>'+[2,3,4,5,6,7,8,9].map(n=>`<option>${n}</option>`).join("");
tb.innerHTML=Array.from({length:9},(_,r)=>Array.from({length:9},(_,c)=>c<=r?`<div onclick="say('${kj(c+1,r+1)}',this)" style="background:hsl(${r*35},55%,92%);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font-size:14px"><b>${c+1}×${r+1}=${(c+1)*(r+1)}</b><br><span style="color:#7a706a">${kj(c+1,r+1)}</span></div>`:"<div></div>").join("")).join("");
window.say=(t,el)=>{el.animate([{transform:"scale(1.15)"},{transform:"none"}],300);try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
m1.onclick=()=>{A.style.display="";Bx.style.display="none";m1.className="";m2.className="alt"};m2.onclick=()=>{A.style.display="none";Bx.style.display="";m2.className="";m1.className="alt"};
let cur,run=false,iv,o=0,n=0,W={};hi.textContent=localStorage.times||0;const nq=()=>{const a=+only.value||2+Math.random()*8|0,b=1+Math.random()*9|0;cur=Math.random()<.5?[a,b]:[b,a];q.textContent=`${cur[0]} × ${cur[1]} = ?`;an.value="";an.focus()};
const sub=()=>{if(!run||an.value==="")return;if(+an.value==cur[0]*cur[1]){o++;q.style.color="#4a9a5a"}else{n++;q.style.color="#c05a4a";const k=cur.join("×");W[k]=(W[k]||0)+1}ok.textContent=o;ng.textContent=n;setTimeout(()=>q.style.color="",200);nq()};
an.onkeydown=e=>{if(e.key=="Enter")sub()};kp.innerHTML=[1,2,3,4,5,6,7,8,9,0,"⌫","✓"].map(k=>`<button class=alt style="width:52px;font-size:20px" data-k="${k}">${k}</button>`).join("");kp.onclick=e=>{const k=e.target.dataset.k;if(k==null)return;if(k=="⌫")an.value=an.value.slice(0,-1);else if(k=="✓")sub();else an.value+=k};
go.onclick=()=>{o=n=0;W={};ok.textContent=ng.textContent=0;wr.textContent="";run=true;let t=+dur.value;tm.textContent=t;clearInterval(iv);iv=setInterval(()=>{tm.textContent=--t;if(t<=0){clearInterval(iv);run=false;q.textContent=`🎉 答对 ${o} 题！`;if(o>(+localStorage.times||0))localStorage.times=o;hi.textContent=localStorage.times;const w=Object.keys(W);wr.textContent=w.length?"需要加强："+w.join("、"):""}},1000);nq()};window.__c=()=>cur;window.__kj=kj</script></html>
