<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单位换算 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>单位换算</h1></header><main><div class=panel><label>类别</label><select id=cat></select><div class=row style="margin-top:10px"><input id=v type=number value=1 style="width:140px"><select id=fu></select><span>=</span></div><div class="stat" id=out style="margin-top:14px"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="unit");r.unshift("unit");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const U={"长度":{"米":1,"千米":1000,"厘米":.01,"毫米":.001,"英寸":.0254,"英尺":.3048,"英里":1609.344,"市尺":1/3,"码":.9144},"重量":{"千克":1,"克":.001,"斤":.5,"两":.05,"吨":1000,"磅":.45359237,"盎司":.0283495},"面积":{"平方米":1,"平方千米":1e6,"公顷":1e4,"亩":666.667,"平方英尺":.092903,"英亩":4046.86},"体积":{"升":1,"毫升":.001,"立方米":1000,"加仑(美)":3.78541,"杯(美)":.236588},"温度":{"摄氏度":0,"华氏度":0,"开尔文":0}};
Object.keys(U).forEach(c=>cat.add(new Option(c)));const fill=()=>{fu.innerHTML="";Object.keys(U[cat.value]).forEach(u=>fu.add(new Option(u)));calc()};
const toC={"摄氏度":x=>x,"华氏度":x=>(x-32)*5/9,"开尔文":x=>x-273.15},fromC={"摄氏度":x=>x,"华氏度":x=>x*9/5+32,"开尔文":x=>x+273.15};
function calc(){const x=+v.value,u=U[cat.value];out.innerHTML=Object.keys(u).map(k=>{const r=cat.value=="温度"?fromC[k](toC[fu.value](x)):x*u[fu.value]/u[k];return`<div><b>${+r.toPrecision(6)}</b>${k}</div>`}).join("")}
cat.onchange=fill;fu.onchange=v.oninput=calc;fill()</script></html>
