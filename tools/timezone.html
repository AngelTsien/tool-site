<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时区转换 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>时区转换</h1></header><main><div class=panel><div class=row><label>基准城市</label><select id=bz></select><input type=datetime-local id=dt><button class=alt id=nw>现在</button></div><div class=row style="margin-top:8px"><select id=adz></select><button class=alt id=ad>+ 添加城市</button></div></div><div id=ls class=grid></div>
<div class=panel><h3>🤝 一起开会的合适时间（各地 8:00–22:00 都醒着）</h3><div id=ov class=out></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="timezone");r.unshift("timezone");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const Z={"罗马":"Europe/Rome","北京":"Asia/Shanghai","纽约":"America/New_York","洛杉矶":"America/Los_Angeles","伦敦":"Europe/London","台北":"Asia/Taipei","香港":"Asia/Hong_Kong","东京":"Asia/Tokyo","悉尼":"Australia/Sydney","温哥华":"America/Vancouver","多伦多":"America/Toronto","新加坡":"Asia/Singapore","柏林":"Europe/Berlin","巴黎":"Europe/Paris","耶路撒冷":"Asia/Jerusalem","迪拜":"Asia/Dubai","首尔":"Asia/Seoul","吉隆坡":"Asia/Kuala_Lumpur","奥克兰":"Pacific/Auckland","芝加哥":"America/Chicago"};
let C=JSON.parse(localStorage.tzc||'["罗马","北京","纽约","洛杉矶"]');Object.keys(Z).forEach(k=>{bz.add(new Option(k));adz.add(new Option(k))});
const off=(tz,d)=>{const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(d).map(x=>[x.type,x.value]));return(Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-d.getTime())/6e4};
const base=()=>{const[d,t]=dt.value.split("T"),[y,m,dd]=d.split("-").map(Number),[h,mi]=t.split(":").map(Number),g=Date.UTC(y,m-1,dd,h,mi);let u=new Date(g-off(Z[bz.value],new Date(g))*6e4);u=new Date(g-off(Z[bz.value],u)*6e4);return u};
const hr=(tz,d)=>+new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",hourCycle:"h23"}).format(d)%24;const fmt=(tz,d,o)=>new Intl.DateTimeFormat("zh-CN",{timeZone:tz,...o}).format(d);const setNow=()=>{const n=new Date(),o=off(Z[bz.value],n),l=new Date(n.getTime()+o*6e4);dt.value=l.toISOString().slice(0,16);f()};
const f=()=>{localStorage.tzc=JSON.stringify(C);const u=base(),b0=off(Z[bz.value],u);ls.innerHTML=C.map((c,i)=>{const o=off(Z[c],u),h=hr(Z[c],u),df=(o-b0)/60;return`<div class=card style="--c:${h>=7&&h<19?"#f6d9a8":"#b8c4e0"};text-align:center"><p>${h>=7&&h<19?"☀️":"🌙"} ${c} <span style="color:#a99;font-size:12px">UTC${o>=0?"+":""}${o/60}</span></p><div style="font-size:40px;font-weight:700">${fmt(Z[c],u,{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})}</div><p>${fmt(Z[c],u,{month:"long",day:"numeric",weekday:"short"})}　${df?(df>0?"+":"")+df+" 小时":"基准"}</p>${c==bz.value?"":`<button class=alt onclick="C.splice(${i},1);f()">移除</button>`}</div>`}).join("");
const ok=[];for(let h=0;h<24;h++){const t=new Date(u.getTime()-((u.getTime()/6e4+b0)%1440)*6e4+h*36e5);if(C.every(c=>{const x=hr(Z[c],t);return x>=8&&x<22}))ok.push(C.map(c=>c+" "+fmt(Z[c],t,{hour:"2-digit",minute:"2-digit",hourCycle:"h23"})).join("  |  "))}ov.textContent=ok.join("\n")||"没有所有城市都在 8:00–22:00 的时段"};
bz.value="罗马";bz.onchange=f;dt.oninput=f;nw.onclick=setNow;ad.onclick=()=>{if(!C.includes(adz.value))C.push(adz.value);f()};setNow();window.__off=off</script></html>
