<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>待办清单 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>待办清单</h1></header><main><div class=panel><div class=row><input id=t placeholder="添加一件事，回车确认" style="flex:1"><button id=ad>添加</button></div><div class=row style="margin-top:10px"><button class=alt data-f=all>全部</button><button class=alt data-f=open>未完成</button><button class=alt data-f=done>已完成</button><button class=alt id=cl>清除已完成</button></div></div><div class=panel><div id=ls></div><p id=st style="color:#a99"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="todo");r.unshift("todo");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.todo||"[]"),F="all";const sv=()=>{localStorage.todo=JSON.stringify(L);rd()};
const rd=()=>{ls.innerHTML=L.map((x,i)=>[x,i]).filter(([x])=>F=="all"||(F=="done")==x.d).map(([x,i])=>`<div class=row style="padding:8px 0;border-bottom:1px solid #f0e8e0"><input type=checkbox ${x.d?"checked":""} onchange="L[${i}].d=this.checked;sv()"><span style="flex:1;${x.d?"text-decoration:line-through;color:#aaa":""}">${x.t.replace(/</g,"&lt;")}</span><button class=alt onclick="L.splice(${i},1);sv()">✕</button></div>`).join("")||"<p style='color:#a99'>暂无事项 🎉</p>";st.textContent=`共 ${L.length} 项，已完成 ${L.filter(x=>x.d).length} 项`};
const add=()=>{if(t.value.trim()){L.push({t:t.value.trim(),d:false});t.value="";sv()}};ad.onclick=add;t.onkeydown=e=>{if(e.key=="Enter")add()};document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F=b.dataset.f;rd()});cl.onclick=()=>{L=L.filter(x=>!x.d);sv()};rd()</script></html>
