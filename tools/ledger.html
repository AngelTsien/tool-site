<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记账本 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>记账本</h1></header><main><div class=panel><div class=row><select id=ty><option value=-1>支出</option><option value=1>收入</option></select><input id=am type=number placeholder="金额" style="width:110px"><select id=ca><option>餐饮</option><option>交通</option><option>购物</option><option>住房</option><option>奉献</option><option>工资</option><option>其他</option></select><input id=no placeholder="备注" style="flex:1"><input type=date id=dt><button id=ad>记一笔</button></div></div>
<div class="panel stat" id=sm></div><div class=panel><h3>分类</h3><div id=cs></div></div><div class=panel><div class=row><h3 style="flex:1">明细</h3><button class=alt id=ex>导出 CSV</button></div><div id=ls></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="ledger");r.unshift("ledger");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.ledger||"[]");dt.valueAsDate=new Date();const m=v=>"¥"+v.toFixed(2);
const rd=()=>{localStorage.ledger=JSON.stringify(L);const inc=L.filter(x=>x.a>0).reduce((s,x)=>s+x.a,0),out=-L.filter(x=>x.a<0).reduce((s,x)=>s+x.a,0);sm.innerHTML=`<div><b>${m(inc)}</b>收入</div><div><b>${m(out)}</b>支出</div><div><b>${m(inc-out)}</b>结余</div>`;
const C={};L.filter(x=>x.a<0).forEach(x=>C[x.c]=(C[x.c]||0)-x.a);cs.innerHTML=Object.entries(C).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:6px 0">${k} ${m(v)}<div style="height:10px;border-radius:5px;background:linear-gradient(90deg,#d9a47c,#c48fa8);width:${v/out*100}%"></div></div>`).join("")||"<p style=color:#a99>还没有支出</p>";
ls.innerHTML=L.map((x,i)=>`<div class=row style="padding:6px 0;border-bottom:1px solid #f0e8e0"><span style="color:#a99">${x.d}</span><span>${x.c}</span><span style="flex:1;color:#7a706a">${x.n}</span><b style="color:${x.a>0?"#4a9a5a":"#c05a4a"}">${x.a>0?"+":""}${x.a.toFixed(2)}</b><button class=alt onclick="L.splice(${i},1);rd()">✕</button></div>`).join("")};
ad.onclick=()=>{const a=+am.value;if(!a)return;L.unshift({a:a*ty.value,c:ca.value,n:no.value,d:dt.value});am.value=no.value="";rd()};
ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff日期,分类,金额,备注\n"+L.map(x=>[x.d,x.c,x.a,x.n].join(",")).join("\n")]));a.download="记账本.csv";a.click()};rd()</script></html>
