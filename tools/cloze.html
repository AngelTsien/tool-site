<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>经文默写 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>经文默写</h1></header><main><div class=panel><label>经文</label><textarea id=t style="min-height:80px">你们要先求他的国和他的义，这些东西都要加给你们了。</textarea><div class=row><input id=r value="马太福音 6:33"><label>挖空比例 <span id=pv>30</span>%</label><input type=range id=p min=10 max=90 value=30><button id=go>生成练习</button></div></div>
<div class=panel><h3 id=rf></h3><div id=q style="font-size:22px;line-height:2.4"></div><p class=row><button id=ck>检查答案</button><button class=alt id=sh>显示答案</button></p><p id=res style="font-size:18px"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="cloze");r.unshift("cloze");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let A=[];p.oninput=()=>pv.textContent=p.value;const go0=()=>{rf.textContent=r.value;const ch=[...t.value],idx=ch.map((c,i)=>/[\u4e00-\u9fffA-Za-z]/.test(c)?i:-1).filter(i=>i>=0),n=Math.max(1,Math.round(idx.length*p.value/100)),S=new Set(idx.sort(()=>Math.random()-.5).slice(0,n));A=[];
q.innerHTML=ch.map((c,i)=>S.has(i)?(A.push(c),`<input data-i=${A.length-1} maxlength=1 style="width:1.8em;text-align:center;font-size:20px;padding:2px">`):c).join("");res.textContent=""};
ck.onclick=()=>{let ok=0;q.querySelectorAll("input").forEach(x=>{const g=x.value==A[x.dataset.i];ok+=g;x.style.background=g?"#d7ebdc":"#f5d0c8"});res.textContent=`答对 ${ok}/${A.length}${ok==A.length?" 🎉 太棒了！":""}`};
sh.onclick=()=>q.querySelectorAll("input").forEach(x=>{x.value=A[x.dataset.i];x.style.background="#f3e6d6"});document.getElementById("go").onclick=go0;go0()</script></html>
