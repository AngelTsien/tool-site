<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>番茄钟 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>番茄钟</h1></header><main><div class=panel style="text-align:center"><div class=row style="justify-content:center"><button class=alt data-m=25>专注 25</button><button class=alt data-m=5>短休 5</button><button class=alt data-m=15>长休 15</button></div>
<svg viewBox="0 0 200 200" style="width:min(70vw,280px);margin:16px auto;display:block"><circle cx=100 cy=100 r=88 fill=none stroke="#eee4da" stroke-width=12 /><circle id=ring cx=100 cy=100 r=88 fill=none stroke="#e07a5f" stroke-width=12 stroke-linecap=round transform="rotate(-90 100 100)" stroke-dasharray=553 /><text id=tx x=100 y=112 text-anchor=middle font-size=40 fill="#3a3330">25:00</text></svg>
<div class=row style="justify-content:center"><button id=go>开始</button><button class=alt id=rs>重置</button></div><p>今天完成的番茄：<span id=cnt></span></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="pomodoro");r.unshift("pomodoro");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let tot=1500,left=1500,t=null,mode=25;const K="pomo"+new Date().toDateString(),sh=()=>{tx.textContent=String(left/60|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");ring.style.strokeDashoffset=553*(1-left/tot);cnt.textContent="🍅".repeat(+localStorage[K]||0)||"还没有"};
const beep=()=>{try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.6)}catch(e){}};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{clearInterval(t);t=null;go.textContent="开始";mode=+b.dataset.m;tot=left=mode*60;ring.style.stroke=mode==25?"#e07a5f":"#81b29a";sh()});
go.onclick=()=>{if(t){clearInterval(t);t=null;go.textContent="继续";return}go.textContent="暂停";t=setInterval(()=>{left--;if(left<=0){clearInterval(t);t=null;beep();if(mode==25)localStorage[K]=(+localStorage[K]||0)+1;left=0;go.textContent="开始";document.title="⏰ 时间到！"}sh()},1000)};rs.onclick=()=>{clearInterval(t);t=null;left=tot;go.textContent="开始";sh()};sh()</script></html>
