<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>热量估算 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>热量估算</h1></header><main><div class=panel><h3>🔥 每日所需热量</h3><div class=row><select id=sx><option value=f>女</option><option value=m>男</option></select><label>年龄</label><input id=ag type=number value=35 style="width:70px"><label>身高cm</label><input id=ht type=number value=165 style="width:80px"><label>体重kg</label><input id=wt type=number value=60 style="width:80px"><select id=ac><option value=1.2>久坐</option><option value=1.375 selected>轻度活动</option><option value=1.55>中度运动</option><option value=1.725>高强度</option></select></div><div class=stat id=bm style="margin-top:10px"></div></div>
<div class=panel><h3>🍽️ 今天吃了什么</h3><div class=row><input id=q placeholder="搜索食物，如 米饭" list=fl style="flex:1"><datalist id=fl></datalist><input id=g type=number value=100 style="width:80px"><span>克/份</span><button id=ad>加入</button></div><div id=ls style="margin-top:10px"></div><div style="height:14px;background:#eee4da;border-radius:7px;margin-top:10px;overflow:hidden"><div id=bar style="height:14px;width:0;background:linear-gradient(90deg,#8fc79a,#e8c26a,#e08a7a);transition:.4s"></div></div><p id=tt style="font-size:18px"></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="calorie");r.unshift("calorie");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const F={"米饭":[116,"g"],"馒头":[223,"g"],"面条(煮)":[110,"g"],"全麦面包":[246,"g"],"鸡蛋":[72,"个"],"牛奶":[54,"g"],"豆浆":[31,"g"],"鸡胸肉":[133,"g"],"猪肉(瘦)":[143,"g"],"牛肉":[125,"g"],"三文鱼":[208,"g"],"豆腐":[81,"g"],"苹果":[52,"g"],"香蕉":[93,"g"],"橙子":[47,"g"],"西兰花":[34,"g"],"番茄":[18,"g"],"土豆":[77,"g"],"红薯":[86,"g"],"燕麦":[389,"g"],"饺子":[40,"个"],"包子":[200,"个"],"披萨":[266,"g"],"汉堡":[540,"个"],"薯条":[312,"g"],"可乐":[43,"g"],"拿铁":[190,"杯"],"奶茶":[300,"杯"],"巧克力":[546,"g"],"坚果":[600,"g"],"意面(煮)":[158,"g"],"炒饭":[180,"g"],"沙拉(无酱)":[20,"g"],"酸奶":[72,"g"]};
Object.keys(F).forEach(k=>fl.insertAdjacentHTML("beforeend",`<option value="${k}">`));let E=JSON.parse(localStorage.cal||"[]"),need=2000;const k0=new Date().toDateString();if(localStorage.calday!=k0){E=[];localStorage.calday=k0}
const b=()=>{const w=+wt.value,h=+ht.value,a=+ag.value,bmr=10*w+6.25*h-5*a+(sx.value=="m"?5:-161);need=Math.round(bmr*ac.value);bm.innerHTML=`<div><b>${Math.round(bmr)}</b>基础代谢 kcal</div><div><b>${need}</b>每日消耗 kcal</div><div><b>${need-500}</b>减脂建议 kcal</div><div><b>${need+300}</b>增肌建议 kcal</div>`;rd()};
q.oninput=()=>{const f=F[q.value];if(f)g.value=f[1]=="g"?100:1};const rd=()=>{localStorage.cal=JSON.stringify(E);const T=E.reduce((s,x)=>s+x.k,0);ls.innerHTML=E.map((x,i)=>`<div class=row style="padding:4px 0;border-bottom:1px solid #f0e8e0"><span style="flex:1">${x.n} ${x.g}${x.u}</span><b>${x.k} kcal</b><button class=alt onclick="E.splice(${i},1);rd()">✕</button></div>`).join("");
bar.style.width=Math.min(100,T/need*100)+"%";tt.innerHTML=`今日 <b>${T}</b> / ${need} kcal，${T<=need?`还可以吃 <b style=color:#4a9a5a>${need-T}</b>`:`超出 <b style=color:#c05a4a>${T-need}</b>`}`};
ad.onclick=()=>{const f=F[q.value];if(!f){q.style.borderColor="#e08a7a";return}q.style.borderColor="";const u=f[1]=="g"?"克":f[1],k=Math.round(f[1]=="g"?f[0]*g.value/100:f[0]*g.value);E.push({n:q.value,g:+g.value,u,k});q.value="";rd()};[sx,ag,ht,wt,ac].forEach(e=>e.oninput=b);b()</script></html>
