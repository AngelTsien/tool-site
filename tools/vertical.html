<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竖排古风文字 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>竖排古风文字</h1></header><main><div class=panel><textarea id=t>床前明月光，疑是地上霜。举头望明月，低头思故乡。</textarea><div class=row style="margin-top:8px"><select id=st><option value=0>📜 宣纸古风</option><option value=1>🧧 红笺</option><option value=2>🌫 素雅灰</option><option value=3>🌌 墨夜</option></select>
<select id=ft><option value="serif">宋体/明体</option><option value="'KaiTi','STKaiti',serif">楷体</option><option value="sans-serif">黑体</option></select><label style="margin:0"><input type=checkbox id=gd checked> 格线</label><label style="margin:0"><input type=checkbox id=pc> 去标点</label></div>
<div class=row style="margin-top:8px">字号<input type=range id=fs min=24 max=90 value=52>每列<input type=number id=cl value=10 min=3 max=30 style="width:64px">字<input id=sg placeholder="落款（如：李白·静夜思）" style="flex:1"></div><div class=row style="margin-top:8px"><button id=dl>💾 下载图片</button><button class=alt id=cp>复制竖排文字</button></div></div>
<div class=panel style="text-align:center;overflow:auto"><canvas id=cv style="max-height:70vh;box-shadow:0 4px 16px #0002;border-radius:4px"></canvas></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="vertical");r.unshift("vertical");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const S=[["#f4ecd8","#2b2420","#c9b79a","#b3261e"],["#b3261e","#fbe9c6","#d9705f","#fbe9c6"],["#eceae6","#3a3a3a","#cfcac2","#9b3a2e"],["#1b1d24","#e8dfc8","#3a3e4a","#c95a4a"]];
const cols=()=>{let s=t.value.replace(/\r/g,"");if(pc.checked)s=s.replace(/[，。、；：！？,.;:!?“”"'‘’（）()《》]/g," ");const n=Math.max(3,+cl.value||10),out=[];s.split("\n").forEach(p=>{const a=[...p.trim()];if(!a.length)return;for(let i=0;i<a.length;i+=n)out.push(a.slice(i,i+n))});return out};
function go(){const C=cols(),F=+fs.value,n=Math.max(3,+cl.value||10),g=F*1.5,pad=F*1.4,sig=[...sg.value],W=pad*2+(C.length+(sig.length?1.2:0))*g,H=pad*2+n*F*1.15;cv.width=Math.max(W,200);cv.height=H;const x=cv.getContext("2d"),[bg,fg,ln,sl]=S[st.value];
x.fillStyle=bg;x.fillRect(0,0,cv.width,H);if(st.value==0){for(let i=0;i<300;i++){x.fillStyle=`rgba(120,90,50,${Math.random()*.05})`;x.fillRect(Math.random()*cv.width,Math.random()*H,2+Math.random()*6,1)}}x.strokeStyle=ln;x.lineWidth=2;x.strokeRect(pad/2,pad/2,cv.width-pad,H-pad);
x.font=`${F}px ${ft.value}`;x.textAlign="center";x.textBaseline="middle";C.forEach((c,i)=>{const cx=cv.width-pad-g*i-g/2;if(gd.checked&&i){x.beginPath();x.moveTo(cx+g/2,pad);x.lineTo(cx+g/2,H-pad);x.stroke()}x.fillStyle=fg;
c.forEach((ch,j)=>{const cy=pad+F*1.15*j+F*.6;if(/[，。、；：！？,.;:!?]/.test(ch)){x.save();x.font=`${F*.8}px ${ft.value}`;x.fillText(ch,cx+F*.3,cy-F*.3);x.restore()}else if(/[（）()《》“”「」—…]/.test(ch)){x.save();x.translate(cx,cy);x.rotate(Math.PI/2);x.fillText(ch,0,0);x.restore()}else x.fillText(ch,cx,cy)})});
if(sig.length){const cx=pad+g*.5,fz=F*.55;x.font=`${fz}px ${ft.value}`;x.fillStyle=fg;sig.forEach((ch,j)=>x.fillText(ch,cx,H-pad-fz*1.2*(sig.length-j)-fz*1.6));x.fillStyle=sl;const s=fz*1.3;x.fillRect(cx-s/2,H-pad-s*1.1,s,s);x.fillStyle=bg;x.font=`bold ${fz*.7}px serif`;x.fillText("印",cx,H-pad-s*.6)}}
[t,st,ft,gd,pc,fs,cl,sg].forEach(e=>e.oninput=e.onchange=go);dl.onclick=()=>{const a=document.createElement("a");a.href=cv.toDataURL();a.download="竖排.png";a.click()};
cp.onclick=()=>{const C=cols(),n=Math.max(...C.map(c=>c.length));const r=Array.from({length:n},(_,j)=>C.map(c=>c[j]||"　").reverse().join("　"));navigator.clipboard&&navigator.clipboard.writeText(r.join("\n"));cp.textContent="✓ 已复制";setTimeout(()=>cp.textContent="复制竖排文字",1500)};go();</script></html>
