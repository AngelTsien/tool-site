<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亲子故事卡 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>亲子故事卡</h1></header><main><div class=panel style="text-align:center"><div id=cards class=grid style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div><p class=row style="justify-content:center;margin-top:14px"><button id=all style="font-size:18px">🎲 全部重抽</button><label><input type=checkbox id=bib> 圣经主题</label><button class=alt id=rd>🔊 读出来</button></p></div>
<div class=panel><h3>✨ 故事开头</h3><p id=op style="font-size:19px;line-height:1.8"></p><label>接着编下去（可以轮流每人一句）</label><textarea id=t placeholder="然后……"></textarea><p class=row><button class=alt id=sv>保存这个故事</button></p><div id=saved></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="story");r.unshift("story");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const D={n:{"🧒 主角":["一只爱迷路的小兔子","一个不敢说话的小女孩","一只会唱歌的小鸭子","一个好奇的小男孩","一只怕黑的小猫头鹰","一只想飞的小企鹅"],"🏞️ 地点":["在大森林深处","在一座云朵上的城堡","在海底的珊瑚村","在奶奶家的阁楼","在会说话的花园","在下雪的小镇"],"❓ 遇到的问题":["弄丢了最重要的宝贝","朋友生气不理他了","一场大雨把路冲断了","迷路找不到回家的路","被大家误会了","要去参加比赛却很害怕"],"🎁 神奇的帮助":["一张会发光的地图","一位慈祥的老爷爷","一只聪明的小狗","一首勇敢的歌","一个温暖的拥抱","一封神秘的信"]},
b:{"🧒 主角":["小大卫","小撒母耳","约瑟","小米利暗","撒该","小拿缦的使女"],"🏞️ 地点":["在伯利恒的山坡上","在加利利海边","在挪亚的方舟里","在耶路撒冷城墙下","在埃及的王宫","在旷野的帐棚里"],"❓ 遇到的问题":["遇到一个巨大的困难","被哥哥们嫉妒","大家都看不起他","需要说出真话却很害怕","没有足够的食物","迷失了方向"],"🎁 神奇的帮助":["神听了他的祷告","一个勇敢的朋友","五饼二鱼","一道彩虹","一颗明亮的星星","一首赞美的诗歌"]}};let C={};
const pk=a=>a[Math.random()*a.length|0];const draw=k=>{C[k]=pk(D[bib.checked?"b":"n"][k]);rdr()};const rdr=()=>{const S=D[bib.checked?"b":"n"];cards.innerHTML=Object.keys(S).map(k=>`<div class=card style="--c:#f6d9a8;cursor:pointer;min-height:130px" onclick="draw('${k}')"><p>${k}</p><h3 style="font-size:19px">${C[k]}</h3><p style="font-size:12px">点一下换一张</p></div>`).join("");
const K=Object.keys(S);op.textContent=`从前，${C[K[1]]}，住着${C[K[0]]}。有一天，${C[K[0]].replace(/^一(只|个)/,"这$1")}${C[K[2]]}……就在这时，出现了${C[K[3]]}！`};window.draw=draw;
all.onclick=()=>{Object.keys(D[bib.checked?"b":"n"]).forEach(k=>C[k]=pk(D[bib.checked?"b":"n"][k]));rdr();cards.animate([{opacity:.3,transform:"rotateY(90deg)"},{opacity:1,transform:"none"}],400)};bib.onchange=all.onclick;
rd.onclick=()=>{try{const u=new SpeechSynthesisUtterance(op.textContent+t.value);u.lang="zh-CN";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};let S=JSON.parse(localStorage.stories||"[]");const sh=()=>saved.innerHTML=S.map((s,i)=>`<details style="margin:6px 0"><summary>${s.d} 的故事</summary><p>${s.t}</p><button class=alt onclick="S.splice(${i},1);localStorage.stories=JSON.stringify(S);sh()">删除</button></details>`).join("");
sv.onclick=()=>{S.unshift({d:new Date().toLocaleDateString("zh-CN"),t:op.textContent+t.value});localStorage.stories=JSON.stringify(S);t.value="";sh()};all.onclick();sh()</script></html>
