<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片信息/去隐私 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>照片信息/去隐私</h1></header><main><div class=panel><input type=file id=f accept="image/jpeg,image/*"><p style="font-size:13px;color:#a99">照片只在你的浏览器里读取，不会上传</p></div><div class=panel id=out style="display:none"><div class=row style="align-items:flex-start"><img id=pv style="width:160px;border-radius:10px"><div id=tb style="flex:1;min-width:220px"></div></div><div id=gp></div>
<p class=row><button id=cl>🧹 去除所有信息并下载</button><span id=cs style="color:#7a706a"></span></p></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="exif");r.unshift("exif");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const TG={0x010F:"相机品牌",0x0110:"相机型号",0x0112:"方向",0x0131:"软件",0x0132:"修改时间",0x9003:"拍摄时间",0x829A:"曝光时间",0x829D:"光圈 F",0x8827:"ISO",0x920A:"焦距 mm",0xA002:"宽度",0xA003:"高度",0xA434:"镜头",0x9209:"闪光灯"};
const parse=buf=>{const v=new DataView(buf);if(v.getUint16(0)!=0xFFD8)return null;let o=2;while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);if(m==0xFFE1&&v.getUint32(o+4)==0x45786966){const t=o+10,le=v.getUint16(t)==0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le),R={},G={};
const val=(e)=>{const ty=u16(e+2),n=u32(e+4),sz=[0,1,1,2,4,8,1,1,2,4,8][ty]*n,p=sz>4?t+u32(e+8):e+8;if(ty==2){let s="";for(let i=0;i<n-1;i++)s+=String.fromCharCode(v.getUint8(p+i));return s.trim()}if(ty==3)return u16(p);if(ty==4)return u32(p);if(ty==5||ty==10){const a=[];for(let i=0;i<n;i++)a.push(u32(p+i*8)/u32(p+i*8+4));return n==1?a[0]:a}return null};
const ifd=(p,dst,tags)=>{const n=u16(p);let sub=0,gps=0;for(let i=0;i<n;i++){const e=p+2+i*12,tg=u16(e);if(tg==0x8769)sub=t+u32(e+8);else if(tg==0x8825)gps=t+u32(e+8);else if(!tags||tags[tg])dst[tg]=val(e)}return[sub,gps]};
const[s1,g1]=ifd(t+u32(t+4),R,TG);if(s1)ifd(s1,R,TG);if(g1)ifd(g1,G);return{R,G}}o+=2+len;if(m==0xFFDA)break}return{R:{},G:{}}};
let file;f.onchange=async()=>{file=f.files[0];const buf=await file.arrayBuffer();const r=parse(buf)||{R:{},G:{}};out.style.display="";pv.src=URL.createObjectURL(file);const R=r.R,G=r.G;const fm=(k,x)=>k==0x829A&&x<1?"1/"+Math.round(1/x)+" 秒":typeof x=="number"?+x.toFixed(2):x;
tb.innerHTML=`<p><b>${file.name}</b> · ${(file.size/1024).toFixed(0)} KB</p>`+(Object.keys(R).length?Object.entries(R).map(([k,x])=>`<div class=row style="border-bottom:1px solid #f0e8e0;padding:3px 0"><span style="width:90px;color:#7a706a">${TG[k]}</span><b>${fm(+k,x)}</b></div>`).join(""):"<p style=color:#a99>没有找到 EXIF 信息（可能已被清除，或不是 JPEG）</p>");
if(G[2]&&G[4]){const dm=a=>a[0]+a[1]/60+a[2]/3600,lat=dm(G[2])*(G[1]=="S"?-1:1),lon=dm(G[4])*(G[3]=="W"?-1:1);gp.innerHTML=`<p style="background:#fbe9e5;padding:10px;border-radius:10px">⚠️ <b>照片包含 GPS 位置</b>：${lat.toFixed(5)}, ${lon.toFixed(5)}　<a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=15/${lat}/${lon}" target=_blank>在地图查看</a><br>分享前建议去除</p>`}else gp.innerHTML="<p style='color:#4a9a5a'>✓ 没有 GPS 位置信息</p>";window.__r=r};
cl.onclick=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);c.toBlob(b=>{cs.textContent=`已去除，新文件 ${(b.size/1024).toFixed(0)} KB`;const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=file.name.replace(/\.\w+$/,"")+"_clean.jpg";a.click()},"image/jpeg",.95)};im.src=URL.createObjectURL(file)};window.__parse=parse</script></html>
