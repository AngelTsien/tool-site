<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>查经讨论卡 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>查经讨论卡</h1></header><main><div class=panel><div class=row><input id=ps value="尼希米记 1:1-11" style="flex:1"><select id=tp><option value=g>通用（任何经文）</option><option value=n>叙事/人物</option><option value=e>书信/教导</option><option value=p>诗篇/祷告</option></select></div><label>自己补充的问题（每行一个，可选）</label><textarea id=my style="min-height:60px">尼希米听见坏消息后的第一个反应是什么？</textarea>
<div class=row><button id=go>生成讨论卡</button><button class=alt id=sf>🔀 换一组</button><button class=alt onclick="print()">🖨 打印</button><label><input type=checkbox id=one> 一张一张显示</label></div></div><div id=out></div><div id=nav class=row style="justify-content:center;display:none"><button class=alt id=pv>← 上一张</button><span id=pi></span><button class=alt id=nx>下一张 →</button></div><style>@media print{header,footer,.panel:first-child,#nav{display:none}}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="study");r.unshift("study");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const Q={o:{g:["这段经文发生在什么背景下？","有哪些重复出现的词或想法？","这段经文里有哪些人物？他们说了什么、做了什么？","哪一句最打动你？为什么？"],n:["故事的起因、经过、结果是什么？","主角面对了什么困难？他怎么回应？","神在这个故事里做了什么？"],e:["作者写给谁？他们面对什么处境？","这段有哪些命令或劝勉？","有哪些“因为…所以…”的逻辑？"],p:["作者的情绪是怎样变化的？","作者如何描述神？","有哪些比喻或画面？"]},
i:{g:["这段经文让我们更认识神的哪一方面？","这段经文对当时的读者意味着什么？","这段经文和耶稣基督有什么关联？","有哪些地方不太明白，需要一起讨论？"],n:["为什么主角会这样选择？","这个故事和整本圣经的大故事有什么联系？"],e:["这些教导背后的原因是什么？","这里的“福音”和“行为”是什么关系？"],p:["为什么作者在困境中仍然能赞美？","这篇诗歌怎样指向基督？"]},
a:{g:["这周我可以怎样具体实践这段经文？","有什么需要认罪悔改，或需要感恩的？","我可以为谁、为什么事祷告？","有没有一个应许可以抓住？"],n:["在我生活中有没有类似的“破口”需要我站出来？","我可以学习主角的哪一点？"],e:["哪一条劝勉是我最难做到的？需要谁的帮助？"],p:["我可以用这篇诗歌写一段自己的祷告吗？"]}};
const NM={o:["👀 观察","#dbe8f6"],i:["🔍 解释","#f6d9a8"],a:["🌱 应用","#b9dcc8"]};let C=[],ix=0;const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
const gen=()=>{C=[];["o","i","a"].forEach(l=>pick([...Q[l].g,...Q[l][tp.value]||[]],l=="a"?3:2).forEach(q=>C.push([l,q])));my.value.split("\n").filter(x=>x.trim()).forEach(q=>C.splice(2,0,["o",q.trim()]));ix=0;rd()};
const card=([l,q],k)=>`<div class=panel style="border-left:8px solid ${NM[l][1]};min-height:120px"><div class=row style="justify-content:space-between"><span class=tag style="background:${NM[l][1]}">${NM[l][0]}</span><span style="color:#a99">${ps.value} · ${k+1}/${C.length}</span></div><p style="font-size:21px;line-height:1.6;margin:14px 0">${q}</p></div>`;
const rd=()=>{nav.style.display=one.checked?"":"none";out.innerHTML=one.checked?card(C[ix],ix):C.map(card).join("");pi.textContent=`${ix+1} / ${C.length}`};go.onclick=sf.onclick=gen;one.onchange=rd;pv.onclick=()=>{ix=Math.max(0,ix-1);rd()};nx.onclick=()=>{ix=Math.min(C.length-1,ix+1);rd()};gen()</script></html>
