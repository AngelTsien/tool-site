<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词听写 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>单词听写</h1></header><main><div class=panel><label>词表（每行：单词 | 中文意思，可只写单词）</label><textarea id=t style="min-height:120px">apple | 苹果
grace | 恩典
faith | 信心
church | 教会
family | 家庭</textarea><div class=row><select id=lg><option value="en-US">英语</option><option value="zh-CN">中文</option></select><label>语速</label><input type=range id=rt min=0.5 max=1.3 step=0.1 value=0.8><label><input type=checkbox id=sf checked> 打乱</label><label>每词读</label><select id=rp><option>1</option><option selected>2</option><option>3</option></select>遍<button id=go>开始听写</button></div><p id=nv style="color:#a99;font-size:13px"></p></div>
<div class=panel id=dz style="text-align:center;display:none"><p id=pg style="color:#a99"></p><button id=ag style="font-size:22px;padding:14px 30px">🔊 再读一遍</button><p id=hint style="color:#7a706a"></p><input id=an placeholder="写下你听到的单词" style="font-size:22px;width:min(80vw,320px);text-align:center" autocomplete=off autocapitalize=off spellcheck=false><p><button id=nx>下一个 →</button></p></div><div class=panel id=rs style="display:none"></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="dictation");r.unshift("dictation");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=[],i=0,A=[];if(!window.speechSynthesis)nv.textContent="⚠ 此浏览器不支持朗读";const sp=w=>{try{speechSynthesis.cancel();for(let k=0;k<+rp.value;k++){const u=new SpeechSynthesisUtterance(w);u.lang=lg.value;u.rate=+rt.value;speechSynthesis.speak(u)}}catch(e){}};
const show=()=>{pg.textContent=`第 ${i+1} / ${L.length} 个`;hint.textContent=L[i][1]?"提示："+L[i][1]:"";an.value="";an.focus();sp(L[i][0])};
go.onclick=()=>{L=t.value.split("\n").map(l=>l.split("|").map(s=>s.trim())).filter(a=>a[0]);if(sf.checked)L.sort(()=>Math.random()-.5);if(!L.length)return;i=0;A=[];dz.style.display="";rs.style.display="none";show()};ag.onclick=()=>sp(L[i][0]);
const nxt=()=>{A.push(an.value.trim());i++;if(i<L.length)return show();dz.style.display="none";const ok=L.filter((w,k)=>A[k].toLowerCase()==w[0].toLowerCase()).length;rs.style.display="";rs.innerHTML=`<h2 style="text-align:center">得分 ${ok} / ${L.length} ${ok==L.length?"🎉":""}</h2>`+L.map((w,k)=>{const g=A[k].toLowerCase()==w[0].toLowerCase();return`<p style="font-size:18px">${g?"✅":"❌"} <b>${w[0]}</b> ${w[1]?"（"+w[1]+"）":""} ${g?"":`<span style="color:#c05a4a">你写的：${A[k]||"（空）"}</span>`}</p>`}).join("")+`<p style="text-align:center"><button onclick="go.click()">再来一次</button></p>`};
nx.onclick=nxt;an.onkeydown=e=>{if(e.key=="Enter")nxt()};window.__L=()=>L</script></html>
