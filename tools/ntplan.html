<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年读完新约 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>一年读完新约</h1></header><main><style>.tb{columns:3 200px;column-gap:14px;font-size:13px}.tb div{break-inside:avoid;padding:3px 0;border-bottom:1px dotted #ddd;display:flex;gap:6px;align-items:center;cursor:pointer}.tb div.ok{color:#aaa;text-decoration:line-through}.tb i{font-style:normal;width:16px;height:16px;border:1.5px solid #b98a62;border-radius:4px;flex:none}.tb .ok i{background:#8fc79a;border-color:#8fc79a}
.mh{column-span:all;font-weight:700;color:#8a5a3a;margin:10px 0 4px;font-size:15px}@media print{header,footer,.np{display:none!important}.tb{font-size:10.5px;columns:4}main{padding:0}}</style>
<div class="panel np"><div class=row><label style="margin:0">开始日期</label><input type=date id=sd><select id=md><option value=7>每天读（365 天）</option><option value=5>周一至周五（周末补读）</option><option value=6>周一至周六（主日休息）</option></select></div>
<div class=row style="margin-top:8px"><label style="margin:0">范围</label><select id=rg><option value=nt>新约 260 章</option><option value=gos>四福音 89 章</option><option value=ps>诗篇+箴言 181 章</option></select><label style="margin:0">天数</label><input id=dy type=number value=365 style="width:80px"><input id=tt placeholder="标题" value="一年读完新约" style="flex:1"></div>
<div class=row style="margin-top:8px"><button onclick="print()">🖨 打印读经表</button><button class=alt id=rs>清空打卡</button><span id=pg style="color:#7a706a"></span></div></div><h2 id=hd style="text-align:center;color:#8a5a3a"></h2><div class=tb id=tb></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="ntplan");r.unshift("ntplan");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const NT=[["太",28],["可",16],["路",24],["约",21],["徒",28],["罗",16],["林前",16],["林后",13],["加",6],["弗",6],["腓",4],["西",4],["帖前",5],["帖后",3],["提前",6],["提后",4],["多",3],["门",1],["来",13],["雅",5],["彼前",5],["彼后",3],["约壹",5],["约贰",1],["约叁",1],["犹",1],["启",22]],R={nt:NT,gos:NT.slice(0,4),ps:[["诗",150],["箴",31]]};
let K=JSON.parse(localStorage.ntplan||"{}");const S=JSON.parse(localStorage.ntcfg||"{}");sd.value=S.sd||new Date().getFullYear()+"-01-01";md.value=S.md||7;rg.value=S.rg||"nt";dy.value=S.dy||365;tt.value=S.tt||"一年读完新约";
const go=()=>{localStorage.ntcfg=JSON.stringify({sd:sd.value,md:md.value,rg:rg.value,dy:dy.value,tt:tt.value});hd.textContent=tt.value;const ch=R[rg.value].flatMap(([b,n])=>Array.from({length:n},(_,i)=>[b,i+1])),days=[],d=new Date(sd.value+"T12:00");
const N=Math.max(1,+dy.value||365);while(days.length<N&&days.length<2000){const w=d.getDay();if(md.value==7||(md.value==5&&w>0&&w<6)||(md.value==6&&w>0))days.push(new Date(d));d.setDate(d.getDate()+1)}
let h="",lm=-1,done=0;days.forEach((dd,i)=>{const a=ch.slice(Math.floor(i*ch.length/N),Math.floor((i+1)*ch.length/N));if(!a.length)return;const k=dd.toISOString().slice(0,10),lab=a[0][0]==a.at(-1)[0]?a[0][0]+a[0][1]+(a.length>1?"-"+a.at(-1)[1]:""):a.map(x=>x[0]+x[1]).join("、");
if(dd.getMonth()!=lm){lm=dd.getMonth();h+=`<div class=mh>${dd.getFullYear()}年${lm+1}月</div>`}if(K[k])done++;h+=`<div data-k=${k} class="${K[k]?"ok":""}"><i></i><span style="width:44px;color:#999">${dd.getMonth()+1}/${dd.getDate()}</span>${lab}</div>`});tb.innerHTML=h;const tot=tb.querySelectorAll("[data-k]").length;pg.textContent=`已完成 ${done}/${tot} 天（${Math.round(done/tot*100)||0}%）· 平均每天 ${(ch.length/N).toFixed(2)} 章`};
tb.onclick=e=>{const r=e.target.closest("[data-k]");if(!r)return;K[r.dataset.k]=!K[r.dataset.k];localStorage.ntplan=JSON.stringify(K);go()};[sd,md,rg,dy,tt].forEach(x=>x.oninput=go);rs.onclick=()=>{if(confirm("清空所有打卡？")){K={};localStorage.ntplan="{}";go()}};go();</script></html>
