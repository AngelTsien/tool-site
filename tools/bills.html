<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活缴费记录 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>生活缴费记录</h1></header><main><div class=panel><div class=row><input type=month id=mo><select id=ty><option>💡 电费</option><option>💧 水费</option><option>🔥 燃气</option><option>🌐 网费</option><option>📱 话费</option><option>🏢 物业</option><option>🏠 房租</option><option>➕ 其他</option></select><input id=am type=number placeholder="金额" style="width:100px"><input id=us type=number placeholder="用量(度/吨/方，可选)" style="width:150px"><button id=ad>记录</button></div></div>
<div class="panel stat" id=sm></div><div class=panel><h3>近 12 个月</h3><canvas id=c width=800 height=260 style="width:100%"></canvas><div id=lg class=row style="font-size:13px"></div></div><div class=panel><h3>明细</h3><div id=ls></div><button class=alt id=ex>导出 CSV</button></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="bills");r.unshift("bills");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let L=JSON.parse(localStorage.bills||"[]");const now=new Date().toISOString().slice(0,7);mo.value=now;const CO={"💡 电费":"#e8b84a","💧 水费":"#5a9fd0","🔥 燃气":"#e07a5f","🌐 网费":"#8a7ac0","📱 话费":"#6aa57f","🏢 物业":"#a08a70","🏠 房租":"#c48fa8","➕ 其他":"#999"};
const rd=()=>{localStorage.bills=JSON.stringify(L);const M=Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-11+i);return d.toISOString().slice(0,7)});const sum=m=>L.filter(x=>x.m==m).reduce((s,x)=>s+x.a,0),yr=L.filter(x=>x.m.slice(0,4)==now.slice(0,4)).reduce((s,x)=>s+x.a,0);
const pm=new Date();pm.setDate(1);pm.setMonth(pm.getMonth()-1);const p=sum(pm.toISOString().slice(0,7)),t=sum(now);sm.innerHTML=`<div><b>${t.toFixed(0)}</b>本月</div><div><b>${p.toFixed(0)}</b>上月</div><div><b style="color:${t>p?"#c05a4a":"#4a9a5a"}">${p?((t-p)/p*100).toFixed(0)+"%":"–"}</b>环比</div><div><b>${yr.toFixed(0)}</b>今年累计</div><div><b>${(yr/(+now.slice(5))).toFixed(0)}</b>月均</div>`;
const x=c.getContext("2d");x.clearRect(0,0,800,260);const mx=Math.max(1,...M.map(sum)),bw=800/12;M.forEach((m,i)=>{let y0=230;Object.keys(CO).forEach(k=>{const v=L.filter(e=>e.m==m&&e.t==k).reduce((s,e)=>s+e.a,0);if(!v)return;const h=v/mx*200;x.fillStyle=CO[k];x.fillRect(i*bw+12,y0-h,bw-24,h);y0-=h});x.fillStyle="#888";x.font="13px sans-serif";x.textAlign="center";x.fillText(m.slice(5)+"月",i*bw+bw/2,252);const s=sum(m);if(s)x.fillText(s.toFixed(0),i*bw+bw/2,y0-6)});
lg.innerHTML=Object.entries(CO).map(([k,v])=>`<span><span style="display:inline-block;width:10px;height:10px;background:${v};border-radius:2px"></span> ${k}</span>`).join(" ");ls.innerHTML=[...L].sort((a,b)=>b.m.localeCompare(a.m)).map(e=>`<div class=row style="padding:4px 0;border-bottom:1px solid #f0e8e0"><span style="color:#a99">${e.m}</span><span style="flex:1">${e.t}${e.u?` · ${e.u} 单位 · 单价 ${(e.a/e.u).toFixed(2)}`:""}</span><b>${e.a.toFixed(2)}</b><button class=alt onclick="L.splice(${L.indexOf(e)},1);rd()">✕</button></div>`).join("")};
ad.onclick=()=>{const a=+am.value;if(!(a>0))return;L.push({m:mo.value,t:ty.value,a,u:+us.value||0});am.value=us.value="";rd()};am.onkeydown=e=>{if(e.key=="Enter")ad.click()};ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff月份,类别,金额,用量\n"+L.map(e=>[e.m,e.t,e.a,e.u].join(",")).join("\n")]));a.download="缴费记录.csv";a.click()};rd()</script></html>
