<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼音注音 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>拼音注音</h1></header><main><div class=panel><textarea id=t>耶和华是我的牧者，我必不致缺乏。</textarea><div class=row><select id=md><option value=ruby>字上注音</option><option value=line>拼音一行</option><option value=num>数字声调</option><option value=first>首字母</option></select><button class=alt id=cp>复制</button></div></div><div class=panel id=o style="font-size:26px;line-height:2.4"></div></main><footer>所有处理都在你的浏览器里完成</footer><script src="../static/vendor/pinyin-pro.js"></script><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="pinyin");r.unshift("pinyin");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const P=pinyinPro;const f=()=>{const v=t.value;if(md.value=="ruby")o.innerHTML=P.html(v);else o.textContent=md.value=="line"?P.pinyin(v):md.value=="num"?P.pinyin(v,{toneType:"num"}):P.pinyin(v,{pattern:"first",toneType:"none"})};t.oninput=md.onchange=f;cp.onclick=()=>navigator.clipboard.writeText(o.innerText);f()</script></html>
