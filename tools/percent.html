<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百分比/折扣 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>百分比/折扣</h1></header><main><div class=grid style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
<div class=panel><h3>🏷️ 打折</h3>原价 <input id=a1 type=number value=299 style="width:90px"> 打 <input id=a2 type=number value=8 style="width:60px"> 折<p id=r1 class=res></p></div>
<div class=panel><h3>📊 X 是 Y 的百分之几</h3><input id=b1 type=number value=45 style="width:90px"> 占 <input id=b2 type=number value=60 style="width:90px"><p id=r2 class=res></p></div>
<div class=panel><h3>📈 涨跌幅</h3>从 <input id=c1 type=number value=80 style="width:90px"> 变成 <input id=c2 type=number value=100 style="width:90px"><p id=r3 class=res></p></div>
<div class=panel><h3>🧮 Y 的 X%</h3><input id=d1 type=number value=10 style="width:70px">% × <input id=d2 type=number value=3500 style="width:100px"><p id=r4 class=res></p></div>
<div class=panel><h3>🛒 满减</h3>满 <input id=e1 type=number value=300 style="width:70px"> 减 <input id=e2 type=number value=50 style="width:70px">，购物 <input id=e3 type=number value=280 style="width:80px"><p id=r5 class=res></p></div>
<div class=panel><h3>↩️ 已知折后价求原价</h3>折后 <input id=f1 type=number value=168 style="width:80px"> 是 <input id=f2 type=number value=7 style="width:60px"> 折<p id=r6 class=res></p></div></div><style>.res{font-size:18px;color:#b98a62;line-height:1.6}</style></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="percent");r.unshift("percent");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const n=v=>+(+v).toFixed(2);const f=()=>{r1.innerHTML=`折后 <b>${n(a1.value*a2.value/10)}</b>，省 ${n(a1.value*(1-a2.value/10))}（${n(100-a2.value*10)}% off）`;r2.innerHTML=`<b>${n(b1.value/b2.value*100)}%</b>`;
const ch=(c2.value-c1.value)/c1.value*100;r3.innerHTML=`<b style="color:${ch>=0?"#c05a4a":"#4a9a5a"}">${ch>=0?"+":""}${n(ch)}%</b>（${ch>=0?"增加":"减少"} ${n(Math.abs(c2.value-c1.value))}）`;r4.innerHTML=`<b>${n(d1.value*d2.value/100)}</b>`;
const e=+e3.value,need=e1.value-e;r5.innerHTML=need>0?`还差 <b>${n(need)}</b> 可减 ${e2.value}；凑单后实付 ${n(+e1.value-e2.value)}，相当于 ${n((e1.value-e2.value)/e1.value*10)} 折`:`实付 <b>${n(e-e2.value)}</b>，相当于 ${n((e-e2.value)/e*10)} 折`;r6.innerHTML=`原价 <b>${n(f1.value/f2.value*10)}</b>`};document.querySelectorAll("input").forEach(i=>i.oninput=f);f()</script></html>
