<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行打包清单 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>旅行打包清单</h1></header><main><div class=panel><div class=row><label>天数</label><input id=dy type=number value=5 style="width:70px"><span id=sc></span></div><div class=row style="margin-top:8px"><input id=ni placeholder="自己添加物品" style="flex:1"><button id=ad>添加</button><button class=alt id=gn>生成清单</button><button class=alt id=rs>全部取消勾选</button></div>
<div style="height:10px;background:#eee4da;border-radius:5px;margin-top:12px;overflow:hidden"><div id=bar style="height:10px;background:linear-gradient(90deg,#c48fa8,#8fae9a);width:0;transition:.3s"></div></div><p id=pr style="color:#7a706a"></p></div><div id=ls class=grid></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="packing");r.unshift("packing");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const S={"✈️ 坐飞机":{"证件":["护照/身份证","登机牌","签证"],"随身":["充电宝","耳机","颈枕","眼罩"]},"🏖️ 海边":{"海边":["泳衣","防晒霜","墨镜","拖鞋","遮阳帽"]},"⛰️ 露营/徒步":{"户外":["登山鞋","雨衣","头灯","水壶","驱蚊液","急救包"]},"💼 出差":{"工作":["电脑","充电器","名片","正装","转换插头"]},"⛪ 营会/退修会":{"营会":["圣经","笔记本","笔","诗歌本","个人药品"]},"👶 带小孩":{"小孩":["尿布","湿巾","奶瓶","玩具","备用衣服","儿童药"]}};
const base=d=>({"衣物":[`内衣 ×${d}`,`袜子 ×${d}`,`上衣 ×${Math.ceil(d*.7)}`,`裤子 ×${Math.ceil(d/3)}`,"睡衣","外套"],"洗漱":["牙刷牙膏","洗面奶","毛巾","护肤品","梳子"],"电子":["手机","充电器","插头"],"其他":["钱包","钥匙","药品","雨伞"]});
let on=JSON.parse(localStorage.pks||'["✈️ 坐飞机"]'),L=JSON.parse(localStorage.pkl||"null");sc.innerHTML=Object.keys(S).map(k=>`<label style="margin-right:8px"><input type=checkbox value="${k}" ${on.includes(k)?"checked":""}> ${k}</label>`).join("");
const gen=()=>{on=[...sc.querySelectorAll("input:checked")].map(i=>i.value);const G=base(+dy.value);on.forEach(k=>Object.assign(G,S[k]));L=Object.entries(G).map(([g,a])=>({g,it:a.map(n=>({n,d:false}))}));rd()};
const rd=()=>{localStorage.pks=JSON.stringify(on);localStorage.pkl=JSON.stringify(L);const all=L.flatMap(g=>g.it),d=all.filter(i=>i.d).length;bar.style.width=(all.length?d/all.length*100:0)+"%";pr.textContent=`已打包 ${d}/${all.length}`+(d==all.length&&d?" ✅ 可以出发啦！":"");
ls.innerHTML=L.map((g,i)=>`<div class=panel style="margin:0"><h3 style="margin-top:0">${g.g}</h3>${g.it.map((it,j)=>`<label style="display:block;padding:4px 0;${it.d?"text-decoration:line-through;color:#aaa":""}"><input type=checkbox ${it.d?"checked":""} onchange="L[${i}].it[${j}].d=this.checked;rd()"> ${it.n}</label>`).join("")}</div>`).join("")};
ad.onclick=()=>{if(!ni.value.trim())return;let g=L.find(x=>x.g=="自定义");if(!g)L.push(g={g:"自定义",it:[]});g.it.push({n:ni.value.trim(),d:false});ni.value="";rd()};gn.onclick=gen;sc.onchange=gen;dy.onchange=gen;rs.onclick=()=>{L.forEach(g=>g.it.forEach(i=>i.d=false));rd()};L?rd():gen()</script></html>
