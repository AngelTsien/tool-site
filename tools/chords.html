<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和弦移调 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>和弦移调</h1></header><main><div class=panel><label>歌谱（和弦写在方括号里 [C]，或单独一行和弦）</label><textarea id=t style="min-height:150px;font-family:monospace">[G]奇异恩[G7]典 何等[C]甘[G]甜
我罪已[Em]得赦[D]免
G      D/F#   Em   C
前我失[G]丧 今被[G7]寻[C]回[G]</textarea>
<div class=row><button class=alt id=dn>♭ 降半音</button><b id=sh style="min-width:70px;text-align:center">原调</b><button class=alt id=upb>♯ 升半音</button><select id=to></select><label><input type=checkbox id=fl> 用降号</label><button class=alt id=cp>复制</button></div></div><div class=panel><pre id=o class=out style="font-size:16px;line-height:1.7"></pre></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="chords");r.unshift("chords");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const S="C C# D D# E F F# G G# A A# B".split(" "),Fl="C Db D Eb E F Gb G Ab A Bb B".split(" "),ix=n=>{let i=S.indexOf(n);return i<0?Fl.indexOf(n):i};let k=0;const RE=/\b([A-G](?:#|b)?)((?:maj|min|m|sus|dim|aug|add)?\d*(?:sus\d)?)(?:\/([A-G](?:#|b)?))?(?![a-z#])/g;
const tr=c=>c.replace(RE,(m,r,q,b)=>{const T=fl.checked?Fl:S,x=n=>T[(ix(n)+k+120)%12];return x(r)+q+(b?"/"+x(b):"")});const isCh=l=>l.trim()&&l.trim().split(/\s+/).every(w=>/^[A-G](#|b)?[a-z0-9]*(\/[A-G](#|b)?)?$/.test(w));
const key=()=>{const m=t.value.match(/\[([A-G][#b]?)/)||t.value.match(/\b([A-G][#b]?)\b/);return m?m[1]:"C"};S.forEach((n,i)=>to.add(new Option("转到 "+n+" 调",i)));
const f=()=>{const o0=key();sh.textContent=(k>0?"+":"")+k+" 半音";o.innerHTML="";const out=t.value.split("\n").map(l=>isCh(l)?tr(l):l.replace(/\[([^\]]+)\]/g,(m,c)=>"["+tr(c)+"]")).join("\n");o.innerHTML=out.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\[([^\]]+)\]/g,"<b style='color:#b98a62'>[$1]</b>");to.value=(ix(o0)+k+120)%12};
dn.onclick=()=>{k--;f()};upb.onclick=()=>{k++;f()};to.onchange=()=>{k=((+to.value-ix(key()))%12+12)%12;if(k>6)k-=12;f()};t.oninput=fl.onchange=f;cp.onclick=()=>navigator.clipboard.writeText(o.innerText);f()</script></html>
