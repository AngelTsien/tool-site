<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新朋友跟进 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>新朋友跟进</h1></header><main><div class=panel><div class=row><input id=n placeholder="新朋友姓名" style="flex:1"><input id=p placeholder="电话/微信" style="flex:1"></div><div class=row style="margin-top:8px"><label style="margin:0">首次来访</label><input type=date id=d><input id=by placeholder="谁邀请的" style="flex:1"><input id=cg placeholder="负责跟进同工" style="flex:1"></div>
<input id=nt placeholder="备注（家庭、需要、信仰背景…）" style="width:100%;margin-top:8px"><div class=row style="margin-top:8px"><button id=ad>➕ 登记新朋友</button><span style="color:#7a706a;font-size:13px">登记后自动安排 3 天后第一次问候</span></div></div>
<div class=panel id=sm style="display:flex;justify-content:space-around;text-align:center"></div><div class=row style="margin-bottom:10px"><select id=fs><option value="">全部阶段</option></select><button class=alt id=fd>⏰ 只看今天该跟进</button><input id=q placeholder="🔍" style="width:110px"><button class=alt id=ex>导出 CSV</button></div><div id=ls></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="newcomer");r.unshift("newcomer");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>const ST=["👋 初次来访","📞 已问候","🏠 已探访/约饭","👥 参加小组","🌱 稳定聚会","📖 慕道/受洗班"],td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},pl=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
let L=JSON.parse(localStorage.newcomer||"[]"),DUE=0;d.value=td();fs.innerHTML+=ST.map((s,i)=>`<option value=${i}>${s}</option>`).join("");
const rd=()=>{localStorage.newcomer=JSON.stringify(L);const t=td(),due=L.filter(x=>x.nx&&x.nx<=t);sm.innerHTML=`<div><b style="font-size:24px">${L.length}</b><br>新朋友</div><div><b style="font-size:24px;color:#c05a4a">${due.length}</b><br>待跟进</div><div><b style="font-size:24px;color:#5a9a6a">${L.filter(x=>x.s>=4).length}</b><br>已稳定</div>`;
ls.innerHTML=L.map((x,i)=>[x,i]).filter(([x])=>(fs.value===""||x.s==fs.value)&&(!DUE||(x.nx&&x.nx<=t))&&(!q.value||(x.n+x.p+x.cg+x.nt).includes(q.value))).sort((a,b)=>(a[0].nx||"9").localeCompare(b[0].nx||"9")).map(([x,i])=>`<div class=panel style="border-left:6px solid hsl(${x.s*25+10} 55% 60%)">
<div class=row><b style="font-size:18px;flex:1">${x.n}</b><span class=tag>${ST[x.s]}</span></div><div style="color:#7a706a;font-size:14px;margin:4px 0">📞 ${x.p||"-"} · 来访 ${x.d} · 邀请人 ${x.by||"-"} · 跟进 ${x.cg||"-"}${x.nt?"<br>📝 "+x.nt:""}</div>
<div style="height:8px;background:#eee4da;border-radius:4px;margin:6px 0"><div style="height:100%;width:${(x.s+1)/ST.length*100}%;background:#8fc79a;border-radius:4px"></div></div>
<div style="font-size:14px">${x.nx?(x.nx<=t?`<b style="color:#c05a4a">⏰ 该跟进了（${x.nx}）</b>`:`下次联系：${x.nx}`):"✅ 无待办"}</div>${(x.log||[]).slice(-3).map(l=>`<div style="font-size:13px;color:#888">· ${l}</div>`).join("")}
<div class=row style="margin-top:6px"><button onclick="up(${i})">✔ 已联系，进入下一步</button><select onchange="L[${i}].nx=this.value?pl(td(),+this.value):'';rd()"><option value="">改约…</option><option value=1>明天</option><option value=7>一周后</option><option value=14>两周后</option><option value=30>一个月后</option><option value="">不再提醒</option></select><button class=alt onclick="lg(${i})">📝 记录</button><button class=alt onclick="confirm('删除？')&&(L.splice(${i},1),rd())">✕</button></div></div>`).join("")||"<p style='color:#a99'>没有记录</p>"};
const up=i=>{const x=L[i];x.log=[...(x.log||[]),`${td()} ${ST[x.s]} → ${ST[Math.min(x.s+1,ST.length-1)]}`];x.s=Math.min(x.s+1,ST.length-1);x.nx=x.s>=4?pl(td(),30):pl(td(),7);rd()};
const lg=i=>{const s=prompt("记录这次联系的情况：");if(s){L[i].log=[...(L[i].log||[]),td()+" "+s];rd()}};
ad.onclick=()=>{if(!n.value.trim())return;L.unshift({n:n.value.trim(),p:p.value,d:d.value,by:by.value,cg:cg.value,nt:nt.value,s:0,nx:pl(d.value||td(),3),log:[]});n.value=p.value=by.value=nt.value="";rd()};
fs.onchange=q.oninput=rd;fd.onclick=()=>{DUE=!DUE;fd.style.background=DUE?"#b98a62":"";fd.style.color=DUE?"#fff":"";rd()};
ex.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff姓名,电话,来访,邀请人,跟进同工,阶段,下次联系,备注\n"+L.map(x=>[x.n,x.p,x.d,x.by,x.cg,ST[x.s].replace(/^\S+ /,""),x.nx,x.nt].join(",")).join("\n")]));a.download="新朋友跟进.csv";a.click()};rd();</script></html>
