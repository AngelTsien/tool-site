<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会议计时/发言排队 · 小工具站</title><link rel="stylesheet" href="../static/style.css"><header><a href="../index.html">← 小工具站</a><h1>会议计时/发言排队</h1></header><main><div class=panel><div class=row><input id=nm placeholder="发言人姓名" style="flex:1"><input id=mn type=number value=3 min=1 style="width:70px">分钟<button id=ad>➕ 排队</button></div>
<div class=row style="margin-top:8px"><label style="margin:0">会议总时长</label><input id=tot type=number value=60 style="width:80px">分钟 <button class=alt id=rs>重置</button></div></div>
<div class=panel style="text-align:center" id=bx><div id=cur style="font-size:22px;color:#7a706a">还没开始</div><div id=clk style="font-size:min(22vw,110px);font-weight:700;font-variant-numeric:tabular-nums">00:00</div>
<div style="height:12px;background:#eee4da;border-radius:6px;overflow:hidden"><div id=bar style="height:100%;width:0;background:#8fc79a;transition:.3s"></div></div><p id=meet style="color:#7a706a"></p>
<div class=row style="justify-content:center"><button id=go>▶ 开始/下一位</button><button class=alt id=pz>⏸ 暂停</button><button class=alt id=ex>+1 分钟</button></div></div>
<div class=panel><h3 style="margin-top:0">🧑‍🤝‍🧑 发言队列</h3><div id=ql></div><h3>✅ 已发言</h3><div id=dn style="color:#7a706a"></div></div></main><footer>所有处理都在你的浏览器里完成</footer><script>try{let r=JSON.parse(localStorage.recent||"[]").filter(x=>x!="meeting");r.unshift("meeting");localStorage.recent=JSON.stringify(r.slice(0,6))}catch(e){}</script><script>let Q=JSON.parse(localStorage.mtq||"[]"),D=[],C=null,el=0,run=0,me=0,last=0;const f=s=>{s=Math.max(0,Math.round(s));return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const rd=()=>{localStorage.mtq=JSON.stringify(Q);ql.innerHTML=Q.map((x,i)=>`<div class=row style="padding:6px 0;border-bottom:1px dashed #eee"><b style="flex:1">${i+1}. ${x.n}</b><span>${x.m} 分</span><button class=alt onclick="Q.splice(${i},1);rd()">✕</button>${i?`<button class=alt onclick="Q.splice(${i-1},0,Q.splice(${i},1)[0]);rd()">↑</button>`:""}</div>`).join("")||"<p style='color:#a99'>队列为空</p>";dn.innerHTML=D.map(x=>`${x.n}：${f(x.u)}${x.u>x.m*60?" ⚠️超时":""}`).join("<br>");draw()};
const draw=()=>{if(!C){clk.textContent="00:00";bar.style.width=0;bx.style.background=""}else{const L=C.m*60-el;clk.textContent=(L<0?"-":"")+f(Math.abs(L));const p=Math.min(1,el/(C.m*60));bar.style.width=p*100+"%";bar.style.background=L<0?"#e08a7a":L<30?"#e8c26a":"#8fc79a";bx.style.background=L<0?"#fbe3de":"";cur.textContent="🎤 "+C.n+(Q[0]?"　下一位："+Q[0].n:"")}const r=tot.value*60-me;meet.textContent=`会议已进行 ${f(me)} · 剩余 ${f(r)} · 队列预计 ${Q.reduce((a,x)=>a+ +x.m,0)} 分钟`+(r<Q.reduce((a,x)=>a+x.m*60,0)?" ⚠️ 时间不够":"")};
ad.onclick=()=>{if(!nm.value.trim())return;Q.push({n:nm.value.trim(),m:+mn.value||3});nm.value="";rd()};nm.onkeydown=e=>{if(e.key=="Enter")ad.onclick()};
go.onclick=()=>{if(C)D.push({...C,u:el});C=Q.shift()||null;el=0;run=!!C;if(!C)cur.textContent="🎉 全部发言完毕";rd()};pz.onclick=()=>{if(C)run=!run;pz.textContent=run?"⏸ 暂停":"▶ 继续"};ex.onclick=()=>{if(C){C.m++;draw()}};
rs.onclick=()=>{C=null;D=[];el=me=0;run=0;rd()};setInterval(()=>{if(run){el++;me++;if(C&&C.m*60-el==0&&navigator.vibrate)navigator.vibrate(300);draw()}},1000);rd();</script></html>
